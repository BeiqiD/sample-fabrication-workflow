name: Verify

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Record dependency status
        if: always()
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.install.outcome }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.STAGE_OUTCOME === "success" ? "success" : "failure",
              context: "pre-pr/install",
              description: process.env.STAGE_OUTCOME === "success" ? "npm ci passed" : "npm ci failed",
            });

      - name: Run tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Record test status
        if: steps.install.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.STAGE_OUTCOME === "success" ? "success" : "failure",
              context: "pre-pr/tests",
              description: process.env.STAGE_OUTCOME === "success" ? "npm test passed" : "npm test failed",
            });

      - name: Run production build
        id: build
        if: steps.install.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record build status
        if: steps.install.outcome == 'success' && steps.tests.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.STAGE_OUTCOME === "success" ? "success" : "failure",
              context: "pre-pr/build",
              description: process.env.STAGE_OUTCOME === "success" ? "npm run build passed" : "npm run build failed",
            });

      - name: Fail when verification did not pass
        if: steps.install.outcome != 'success' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
