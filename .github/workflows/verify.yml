name: Verify

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - v2/backend-foundation

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Mark verification pending
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_PUBLISH_STATUSES: "1"
          STAGE_OUTCOME: pending
          STATUS_CONTEXT: pre-pr/install
        run: |
          node scripts/publish-commit-status.mjs
          node scripts/run-verification.mjs --mode ci --status pending

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Record dependency status
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_OUTCOME: ${{ steps.install.outcome }}
          STATUS_CONTEXT: pre-pr/install
          STATUS_SUCCESS_DESCRIPTION: npm ci passed
          STATUS_FAILURE_DESCRIPTION: npm ci failed
        run: node scripts/publish-commit-status.mjs

      - name: Run shared verification checks
        id: verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_PUBLISH_STATUSES: "1"
        run: npm run verify:ci

      - name: Close verification statuses when the gate did not run
        if: ${{ always() && (steps.verification.outcome == 'skipped' || steps.verification.outcome == 'cancelled') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_PUBLISH_STATUSES: "1"
        run: node scripts/run-verification.mjs --mode ci --status skipped
