name: Verify

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - v2/backend-foundation

permissions:
  contents: read
  statuses: write

jobs:
  apply_pr132_review_fixes:
    if: ${{ github.actor != 'github-actions[bot]' && github.ref_name == 'codex/pr132-review-fixes-staging' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/pr132-review-fixes-staging
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and apply the staged review-fix script
        run: |
          python - <<'EXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-pr132-review-fixes.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Unable to locate the staged Python patch')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Unexpected staged Python indentation')
          Path('/tmp/apply-pr132-review-fixes.py').write_text(
              '\n'.join(line[10:] if line else '' for line in lines) + '\n',
              encoding='utf-8',
          )
          EXTRACT
          python /tmp/apply-pr132-review-fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Verify review fixes
        run: |
          git diff --check
          npm run test:project-persistence
          npm test
          npm run build

      - name: Commit fixes on staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/projects/service.ts \
            worker/project-persistence-service.test.ts \
            docs/PRODUCT_ROADMAP.md \
            docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md \
            docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md \
            docs/PROJECT_DESIGN_FOUNDATION.md \
            docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md
          git commit -m "fix(project): address Phase 3A2 review findings"
          git push origin HEAD:codex/pr132-review-fixes-staging

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Record dependency status
        if: ${{ always() && steps.install.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.install.outcome }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.STAGE_OUTCOME === "success" ? "success" : "failure",
              context: "pre-pr/install",
              description: process.env.STAGE_OUTCOME === "success" ? "npm ci passed" : "npm ci failed",
            });

      - name: Run blob lifecycle contract
        id: blob_lifecycle
        shell: bash
        run: |
          set -o pipefail
          npm run verify:blob-lifecycle 2>&1 | tee blob-lifecycle.log

      - name: Record blob lifecycle status
        if: ${{ always() && steps.blob_lifecycle.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.blob_lifecycle.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("blob-lifecycle.log") ? fs.readFileSync("blob-lifecycle.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: "pre-pr/blob-lifecycle",
              description: outcome === "success" ? "blob lifecycle contract passed" : detail.slice(0, 140),
            });

      - name: Run reference foundation contract
        id: reference_foundation
        shell: bash
        run: |
          set -o pipefail
          npm run test:reference-foundation 2>&1 | tee reference-foundation.log
          npm run verify:reference-worker 2>&1 | tee -a reference-foundation.log
          npm run verify:reference-search-worker 2>&1 | tee -a reference-foundation.log

      - name: Record reference foundation status
        if: ${{ always() && steps.reference_foundation.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.reference_foundation.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("reference-foundation.log") ? fs.readFileSync("reference-foundation.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: "pre-pr/reference-foundation",
              description: outcome === "success" ? "reference foundation passed" : detail.slice(0, 140),
            });

      - name: Run Project foundation contract
        id: project_foundation
        shell: bash
        run: |
          set -o pipefail
          npm run test:project-foundation 2>&1 | tee project-foundation.log

      - name: Record Project foundation status
        if: ${{ always() && steps.project_foundation.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.project_foundation.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("project-foundation.log") ? fs.readFileSync("project-foundation.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: "pre-pr/project-foundation",
              description: outcome === "success" ? "Project foundation passed" : detail.slice(0, 140),
            });

      - name: Run Project persistence contract
        id: project_persistence
        shell: bash
        run: |
          set -o pipefail
          npm run verify:project-persistence 2>&1 | tee project-persistence.log

      - name: Record Project persistence status
        if: ${{ always() && steps.project_persistence.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.project_persistence.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("project-persistence.log") ? fs.readFileSync("project-persistence.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: "pre-pr/project-persistence",
              description: outcome === "success" ? "Project persistence passed" : detail.slice(0, 140),
            });

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Record test status
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("test.log") ? fs.readFileSync("test.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const location = lines.find((line) => /(?:^|\s)src\/[^\s]+\.test\.ts:\d+:\d+/.test(line));
            const detail = location || lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            const slug = detail.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 72) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: outcome === "success" ? "pre-pr/tests" : `pre-pr/tests/${slug}`,
              description: outcome === "success" ? "npm test passed" : detail.slice(0, 140),
            });

      - name: Run production build
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Record build status
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("build.log") ? fs.readFileSync("build.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /error TS|error:|Error:|failed/i.test(line)) || lines.at(-1) || "failure";
            const slug = detail.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 72) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: outcome === "success" ? "pre-pr/build" : `pre-pr/build/${slug}`,
              description: outcome === "success" ? "npm run build passed" : detail.slice(0, 140),
            });
