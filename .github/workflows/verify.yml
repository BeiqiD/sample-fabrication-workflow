name: Verify

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - v2/backend-foundation

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Record dependency status
        if: always()
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.install.outcome }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.STAGE_OUTCOME === "success" ? "success" : "failure",
              context: "pre-pr/install",
              description: process.env.STAGE_OUTCOME === "success" ? "npm ci passed" : "npm ci failed",
            });

      - name: Run blob lifecycle contract
        id: blob_lifecycle
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:blob-lifecycle 2>&1 | tee blob-lifecycle.log

      - name: Record blob lifecycle status
        if: steps.install.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.blob_lifecycle.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("blob-lifecycle.log") ? fs.readFileSync("blob-lifecycle.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: "pre-pr/blob-lifecycle",
              description: outcome === "success" ? "blob lifecycle contract passed" : detail.slice(0, 140),
            });

      - name: Run reference foundation contract
        id: reference_foundation
        if: steps.install.outcome == 'success' && steps.blob_lifecycle.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:reference-foundation 2>&1 | tee reference-foundation.log
          npm run verify:reference-worker 2>&1 | tee -a reference-foundation.log
          npm run verify:reference-search-worker 2>&1 | tee -a reference-foundation.log

      - name: Record reference foundation status
        if: steps.install.outcome == 'success' && steps.blob_lifecycle.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.reference_foundation.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("reference-foundation.log") ? fs.readFileSync("reference-foundation.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: "pre-pr/reference-foundation",
              description: outcome === "success" ? "reference foundation passed" : detail.slice(0, 140),
            });

      - name: Run tests
        id: tests
        if: steps.install.outcome == 'success' && steps.blob_lifecycle.outcome == 'success' && steps.reference_foundation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Record test status
        if: steps.install.outcome == 'success' && steps.blob_lifecycle.outcome == 'success' && steps.reference_foundation.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("test.log") ? fs.readFileSync("test.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const location = lines.find((line) => /(?:^|\s)src\/[^\s]+\.test\.ts:\d+:\d+/.test(line));
            const detail = location || lines.find((line) => /FAIL|AssertionError|Error:|×|✗/.test(line)) || lines.at(-1) || "failure";
            const slug = detail.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 72) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: outcome === "success" ? "pre-pr/tests" : `pre-pr/tests/${slug}`,
              description: outcome === "success" ? "npm test passed" : detail.slice(0, 140),
            });

      - name: Run production build
        id: build
        if: steps.install.outcome == 'success' && steps.blob_lifecycle.outcome == 'success' && steps.reference_foundation.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Record build status
        if: steps.install.outcome == 'success' && steps.blob_lifecycle.outcome == 'success' && steps.reference_foundation.outcome == 'success' && steps.tests.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STAGE_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require("fs");
            const outcome = process.env.STAGE_OUTCOME;
            const log = fs.existsSync("build.log") ? fs.readFileSync("build.log", "utf8") : "";
            const stripAnsi = (value) => value.replace(/\u001B\[[0-9;]*m/g, "");
            const lines = log.split(/\r?\n/).map((line) => stripAnsi(line).trim()).filter(Boolean);
            const detail = lines.find((line) => /error TS|error:|Error:|failed/i.test(line)) || lines.at(-1) || "failure";
            const slug = detail.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "-").replace(/^-+|-+$/g, "").slice(0, 72) || "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: outcome === "success" ? "success" : "failure",
              context: outcome === "success" ? "pre-pr/build" : `pre-pr/build/${slug}`,
              description: outcome === "success" ? "npm run build passed" : detail.slice(0, 140),
            });

      - name: Fail when verification did not pass
        if: steps.install.outcome != 'success' || steps.blob_lifecycle.outcome == 'failure' || steps.reference_foundation.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
