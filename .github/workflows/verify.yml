name: Apply PR 132 Review Fixes

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'codex/project-persistence-service' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/project-persistence-service
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract and apply the staged review-fix script
        run: |
          if grep -q "const contentReplayed" worker/projects/service.ts \
            && grep -q "rejects stale owned-content restore replays" worker/project-persistence-service.test.ts; then
            echo "Review fixes already applied"
          else
            python - <<'EXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-pr132-review-fixes.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('Unable to locate the staged Python patch')
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Unexpected staged Python indentation')
          Path('/tmp/apply-pr132-review-fixes.py').write_text(
              '\n'.join(line[10:] if line else '' for line in lines) + '\n',
              encoding='utf-8',
          )
          EXTRACT
            python /tmp/apply-pr132-review-fixes.py
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify review fixes
        run: |
          git diff --check
          npm run test:project-persistence
          npm test
          npm run build

      - name: Commit fixes to PR branch
        run: |
          if git diff --quiet; then
            echo "No review-fix changes remain"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/projects/service.ts \
            worker/project-persistence-service.test.ts \
            docs/PRODUCT_ROADMAP.md \
            docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md \
            docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md \
            docs/PROJECT_DESIGN_FOUNDATION.md \
            docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md
          git commit -m "fix(project): address Phase 3A2 review findings"
          git push origin HEAD:codex/project-persistence-service
