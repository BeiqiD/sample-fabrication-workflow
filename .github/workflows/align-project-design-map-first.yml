name: Align Project foundation with Map-first contract

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.ref == 'agent/global-reference-search-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-reference-search-ui
          fetch-depth: 0

      - name: Replace superseded Text-first Project wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_DESIGN_FOUNDATION.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'Last reviewed: 2026-08-08 after PR #128 source-focus review',
              'Last reviewed: 2026-08-09 after the Map-first Project interaction review',
              'review date',
          )

          replace_once(
              '[blob lifecycle contract](./BLOB_LIFECYCLE_CONTRACT.md). Project implementation\n'
              'must not bypass either contract.\n',
              '[blob lifecycle contract](./BLOB_LIFECYCLE_CONTRACT.md). Project implementation\n'
              'must not bypass either contract. The current product order is defined in\n'
              '[PRODUCT_ROADMAP.md](./PRODUCT_ROADMAP.md), and the Map-first interaction,\n'
              'placement, save, edge, Reading, and mobile contracts are defined in\n'
              '[PROJECT_CANVAS_INTERACTION_CONTRACT.md](./PROJECT_CANVAS_INTERACTION_CONTRACT.md).\n'
              'Those documents supersede older Text-first sequencing in this foundation.\n',
              'canonical contract links',
          )

          replace_once(
              'Project exposes two complementary views over the same items:\n\n'
              '- **Text** provides a deliberate reading and writing order.\n'
              '- **Map** provides spatial organization and user-defined connections.\n\n'
              'The views share content and references but keep independent placement data.\n',
              'Project exposes two projections over the same Project-local item occurrences:\n\n'
              '- **Map** is the primary creation and spatial-organization interface.\n'
              '- **Reading** provides one linear presentation for review, editing existing\n'
              '  Project-owned content, and ordering.\n\n'
              'The projections never own separate content. Every active occurrence has both\n'
              'a Map placement and a Reading placement; only their presentation metadata is\n'
              'separate.\n',
              'purpose projections',
          )

          replace_once(
              '- Map placement and Text placement are independent;\n',
              '- every active Project item occurrence has both a Map placement and a Reading\n'
              '  placement; coordinates and linear ordering are separate metadata over the\n'
              '  same content;\n',
              'placement constraint',
          )

          start = text.index('## Text, Map, and Inspector\n')
          end = text.index('## Resolution, deep links, and search\n')
          replacement = '''## Map, Reading, and Inspector

### Map

Map is the primary Project creation and organization interface. Desktop users:

- search read-only references in a sidebar or operation area;
- drag a result to an exact Map coordinate;
- double-click empty space to create Project-owned Markdown;
- add a generic Project-owned attachment through an explicit action or context
  menu;
- move and resize nodes without changing font size;
- connect items through fixed top/right/bottom/left handles;
- use an explicit hover/selected/focused `Open reference` action to navigate;
- save explicitly and through bounded autosave at semantic operation boundaries.

Clicking a node body selects it and opens Inspector; it does not navigate. One
reference target may have several independent Project item occurrences in the
same Project. Reference occurrences have no editable local title, caption,
description, or annotation override.

`@xyflow/react` is the intended desktop interaction layer. It is dynamically
loaded when Map opens and never becomes the database model. Placement, content,
and edge writes persist normalized rows rather than one opaque serialized flow.

### Reading

Reading renders every active Project item occurrence in one linear projection.
It creates no new items. It may:

- render complete Markdown, attachment, and reference blocks;
- edit existing Project-owned Markdown;
- edit allowed metadata of existing Project-owned attachments;
- open references and Inspector; and
- adjust the linear order through an accessible control.

Reading and Map edit the same content. Map size does not truncate Reading
content. Mobile defaults to Reading and provides only this limited editing
surface, not full Canvas placement, resizing, upload, or edge editing.

Reading order combines stable insertion/manual order with explicit ordered-edge
constraints. The schema preserves creation sequence, an insertion-friendly
`position_key`, and a future explicit `reading_role = none | precedes` on edges.
The final topological and cycle-resolution UX is deferred to the Reading phase;
not every visually directed edge is automatically a narrative-order edge.

### Inspector

Inspector carries detail that would make Map nodes or Reading blocks too large.
It may:

- show complete content and the dynamically resolved source path;
- expand a Step's directly related Comments and attachments read-only;
- add one of those child objects through the same authoritative Project
  insertion operation;
- open the source object;
- remove the selected occurrence from the current Project; and
- later show Project presence/backlink information.

Inspector does not expose source mutation controls.

'''
          text = text[:start] + replacement + text[end:]

          replace_once(
              '#### Phase 2C2: global search and reusable selection UI\n\n'
              'The following slice adds a URL-owned global Search page and a reusable\n'
              'result picker that consumes the Phase 2C1 API without changing ranking or\n'
              'lifecycle behavior.\n',
              '#### Phase 2C2: reusable Project discovery surface\n\n'
              'Draft PR #130 adds the reusable result/search surface that the Project Map\n'
              'sidebar will consume. The current URL-owned `/search` page is temporary\n'
              'integration scaffolding rather than a permanent workspace.\n',
              'phase 2C2 wording',
          )

          replace_once(
              'Backlinks are required for navigation and deletion safety. Before a permanent\n'
              'delete, the system must be able to report, for example, “Referenced by 3 items\n'
              'in 2 Projects.” The authoritative Project backlink relationship is the future\n'
              '`project_items.reference_target_id`; a Project or Project-owned content may\n'
              'itself be soft-deleted without cascading into references held by another\n'
              'Project.\n',
              'The natural reverse-reference relationship is the future\n'
              '`project_items.reference_target_id`. The same target may occur several times\n'
              'inside one Project; future backlink UI should normally count distinct Projects\n'
              'rather than occurrence rows. Backlink presentation is deferred and is not an\n'
              'alpha or MVP requirement. A Project or Project-owned content may itself be\n'
              'soft-deleted without cascading into references held by another Project.\n',
              'backlink semantics',
          )

          replace_once(
              '- Text placements, Map placements, and edges;\n',
              '- Reading placements, Map placements, and edges;\n',
              'export placement name',
          )

          roadmap_start = text.index('## Implementation roadmap\n')
          roadmap_end = text.index('## First-version non-goals\n')
          roadmap = '''## Implementation roadmap

The canonical detailed roadmap is [PRODUCT_ROADMAP.md](./PRODUCT_ROADMAP.md).
The Project sequence is Map-first:

| Phase | Scope | Current state |
|---|---|---|
| 0–2C1. Foundation | Source/blob lifecycle, registry, resolver, destinations, exact focus, deterministic search | Complete through PR #129 |
| 2C2. Reusable discovery | Project-embeddable browse/select surface plus temporary `/search` harness | Draft PR #130 |
| 3A. Project core | Projects, Markdown/generic attachments, repeatable item occurrences, Map/Reading placements, basic-edge schema, revisions, insertion, export | Next |
| 3B1. Map kernel | Desktop React Flow pan/zoom/select/move/resize/save with lightweight nodes | Not started |
| 3B2. Reference placement | Sidebar search, drag/drop, pending node, authoritative insertion, repeated references | Not started |
| 3B3. Owned content | Double-click Markdown and generic attachment insertion | Not started |
| 3B4. Basic edges | Bezier, four handles, endpoint arrows, optional label | Not started |
| 3C. Reading projection | No creation; render/edit existing owned content and adjust linear order | Not started |
| 3D. Editor/media hardening | Markdown/TeX, previews, save/conflict UX, human-readable export | Not started |
| 4. Advanced Canvas | Inspector depth, groups, copy/paste, PDF preview, screenshot capture, performance | Deferred |
| 5. Later capabilities | Portability release, semantic search, read-only LLM insight, collaboration research | Deferred |

Map and Reading are projections over one occurrence set. Map is not delayed
until after an independent Text product, and Reading does not require a second
copy of any content.

'''
          text = text[:roadmap_start] + roadmap + text[roadmap_end:]

          replace_once(
              '- deriving one mandatory Text hierarchy from Map edges;\n',
              '- assuming every directed Map edge defines Reading order;\n',
              'non-goal ordering',
          )

          replace_once(
              'No Map dependency is required during the blob, resolver, deep-link, search, or\n'
              'Text phases.\n',
              'No Map dependency is required during the blob, resolver, deep-link, search, or\n'
              'Project-schema phases. React Flow is selected and license-verified when Phase\n'
              '3B1 begins.\n',
              'dependency timing',
          )

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/align-project-design-map-first.yml

      - name: Validate contract references
        run: |
          grep -q 'PROJECT_CANVAS_INTERACTION_CONTRACT.md' docs/PROJECT_DESIGN_FOUNDATION.md
          grep -q 'Map is the primary Project creation' docs/PROJECT_DESIGN_FOUNDATION.md
          ! grep -q 'Text is the first Project workspace to implement' docs/PROJECT_DESIGN_FOUNDATION.md

      - name: Commit alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_DESIGN_FOUNDATION.md .github/workflows/align-project-design-map-first.yml
          git commit -m 'Align Project foundation with Map-first workspace'
          git push origin HEAD:agent/global-reference-search-ui
