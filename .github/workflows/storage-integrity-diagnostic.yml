name: Apply storage integrity routes and Markdown removal

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: "github.event.head_commit.message == 'chore: apply storage integrity routes and Markdown removal'"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source patches
        run: |
          python .github/scripts/apply-storage-integrity-routes.py
          python .github/scripts/apply-markdown-removal.py

      - name: Install dependencies
        run: npm ci

      - name: Verify complete implementation
        run: |
          npm test
          npm run verify:d1-migrations
          npm run build
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations worker src shared package.json
          git commit -m "feat: verify blob reuse and remove Markdown"
          git push origin HEAD:agent/storage-integrity-markdown-removal
