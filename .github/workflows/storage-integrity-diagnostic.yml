name: Apply storage integrity foundation

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: run storage integrity foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply patches
        run: |
          python .github/scripts/apply-storage-integrity-core.py
          python .github/scripts/apply-storage-integrity-integration.py

      - name: Install dependencies
        run: npm ci

      - name: Verify foundation
        run: |
          npm run verify:storage-integrity
          npm run test:project-persistence
          npm run test:project-foundation
          npm run build
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0024_blob_integrity_quarantine.sql \
            shared/project-types.ts package.json \
            worker/managed-storage.ts worker/switchdrive-storage.ts \
            worker/blob-lifecycle/storage.ts worker/blob-lifecycle/reuse.ts \
            worker/project-foundation-routes.ts worker/project-foundation-routes.test.ts \
            worker/project-routes.test.ts worker/switchdrive-storage.test.ts \
            worker/blob-integrity.test.ts
          git commit -m "feat: verify physical blobs before reuse"
          git push origin HEAD:agent/storage-integrity-markdown-removal
