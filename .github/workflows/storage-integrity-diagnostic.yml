name: Finalize storage integrity documentation

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  finalize:
    if: "github.event.head_commit.message == 'chore: finalize storage integrity documentation'"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply permanent documentation and gate updates
        run: python .github/scripts/finalize-storage-integrity.py

      - name: Install dependencies
        run: npm ci

      - name: Verify the permanent safety gate and Reading lifecycle
        run: |
          npm run verify:blob-lifecycle
          npm run verify:project-reading
          git diff --check

      - name: Remove temporary implementation machinery and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json docs/BLOB_LIFECYCLE_IMPLEMENTATION_PLAN.md \
            docs/BLOB_LIFECYCLE_OPERATIONS.md docs/PRODUCT_ROADMAP.md
          git rm \
            .github/scripts/apply-markdown-removal.py \
            .github/scripts/apply-storage-integrity-core.py \
            .github/scripts/apply-storage-integrity-integration.py \
            .github/scripts/apply-storage-integrity-routes.py \
            .github/scripts/fix-storage-integrity-route-tests.py \
            .github/scripts/fix-storage-integrity-test-import.py \
            .github/scripts/finalize-storage-integrity.py \
            .github/workflows/storage-integrity-diagnostic.yml
          git commit -m "docs: record storage integrity operations"
          git push origin HEAD:agent/storage-integrity-markdown-removal
