name: Apply PR 132 Round 2 Fixes

on:
  push:
    branches:
      - codex/pr132-round2-fixes-staging

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/project-persistence-service
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply review fixes
        shell: bash
        run: |
          cat > /tmp/apply-pr132-round2.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/apply-pr132-round2.py.gz.b64 | gzip -d > /tmp/apply-pr132-round2.py
          python /tmp/apply-pr132-round2.py

      - name: Install dependencies
        run: npm ci

      - name: Verify review fixes
        shell: bash
        run: |
          git diff --check
          npm run test:project-foundation
          npm run verify:project-persistence
          npm test
          npm run build

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0020_project_persistence_guards.sql \
            package.json \
            worker/projects/service.ts \
            worker/project-persistence-guards.test.ts \
            worker/project-database-input-guards.test.ts \
            worker/reference-routes.ts \
            worker/index.ts \
            worker/project-routes.ts \
            worker/project-foundation-routes.ts \
            worker/project-foundation-routes.test.ts \
            docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md \
            docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md
          git commit -m "fix(project): enforce persistence and route ownership contracts"
          git push origin HEAD:codex/project-persistence-service
