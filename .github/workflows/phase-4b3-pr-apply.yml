name: Apply Phase 4B3 implementation from PR

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'codex/phase-4b3-canvas-alignment-z-order' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4b3-canvas-alignment-z-order
          fetch-depth: 0

      - name: Apply bounded Phase 4B3 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase-4b3-apply.yml').read_text().splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index("          PY", start)
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          )
          exec(compile(source, 'phase-4b3-apply.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Check patch formatting
        run: |
          git diff --check
          test -f .phase-4b3-bootstrap

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Canvas productivity slice
        run: npm run verify:project-canvas-productivity

      - name: Commit implementation
        shell: bash
        run: |
          rm -f \
            .phase-4b3-bootstrap \
            .github/workflows/phase-4b3-apply.yml \
            .github/workflows/phase-4b3-pr-apply.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(project): complete Phase 4B3 Canvas productivity"
          git push origin HEAD:codex/phase-4b3-canvas-alignment-z-order
