name: Temporary PR136 edge surface retry

on:
  push:
    branches:
      - agent/project-basic-edges
    paths:
      - .github/workflows/tmp-pr136-edge-surface-retry.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire authoritative edges into React Flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/project/ProjectMapSurface.tsx')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once('''  Background,
          Controls,
          NodeResizer,
          ReactFlow,
          applyNodeChanges,
          type Node,''', '''  Background,
          ConnectionMode,
          Controls,
          Handle,
          MarkerType,
          NodeResizer,
          Position,
          ReactFlow,
          applyNodeChanges,
          type Connection,
          type Edge,
          type Node,''')
          replace_once('import type { ProjectMapGeometry } from "../../../shared/project-types";', 'import type { ProjectEdgeRecord } from "../../../shared/project-api";\nimport type { ProjectEdgeHandle, ProjectMapGeometry } from "../../../shared/project-types";\nimport type { ProjectPendingEdgePreview } from "../../lib/project-edges";')
          replace_once('type ProjectFlowNode = Node<ProjectFlowNodeData, "projectItem">;', 'type ProjectFlowNode = Node<ProjectFlowNodeData, "projectItem">;\ntype ProjectFlowEdge = Edge;')
          replace_once('  nodes: ProjectNodeDescriptor[];\n', '  nodes: ProjectNodeDescriptor[];\n  edges?: ProjectEdgeRecord[];\n  pendingEdge?: ProjectPendingEdgePreview | null;\n')
          replace_once('  selectedItemId: string | null;\n  geometryInteractionDisabled?: boolean;\n  onSelect: (itemId: string | null) => void;\n', '  selectedItemId: string | null;\n  selectedEdgeId?: string | null;\n  geometryInteractionDisabled?: boolean;\n  onSelect: (itemId: string | null) => void;\n  onEdgeSelect?: (edgeId: string | null) => void;\n  onEdgeConnect?: (connection: {\n    sourceItemId: string;\n    targetItemId: string;\n    sourceHandle: ProjectEdgeHandle;\n    targetHandle: ProjectEdgeHandle;\n  }) => void;\n')
          replace_once('  >\n    <NodeResizer', '''  >
            <Handle type="source" id="top" position={Position.Top} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <Handle type="source" id="right" position={Position.Right} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <Handle type="source" id="bottom" position={Position.Bottom} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <Handle type="source" id="left" position={Position.Left} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <NodeResizer''')
          replace_once('const PROJECT_EDGES: [] = [];\n', '')
          replace_once('const NOOP_ACTION = () => undefined;\n', '''const NOOP_ACTION = () => undefined;
          const NOOP_EDGE_SELECT = (_edgeId: string | null) => undefined;

          function isProjectEdgeHandle(value: string | null | undefined): value is ProjectEdgeHandle {
            return value === "top" || value === "right" || value === "bottom" || value === "left";
          }

          function projectFlowMarker(marker: "none" | "arrow") {
            return marker === "arrow" ? { type: MarkerType.ArrowClosed } : undefined;
          }

          function buildFlowEdge(edge: ProjectEdgeRecord, selected: boolean): ProjectFlowEdge {
            return {
              id: edge.id,
              source: edge.sourceItemId,
              target: edge.targetItemId,
              sourceHandle: edge.sourceHandle,
              targetHandle: edge.targetHandle,
              type: "default",
              label: edge.label ?? undefined,
              markerStart: projectFlowMarker(edge.markerStart),
              markerEnd: projectFlowMarker(edge.markerEnd),
              selected,
              selectable: true,
              deletable: false,
            };
          }

          function buildPendingFlowEdge(edge: ProjectPendingEdgePreview): ProjectFlowEdge {
            return {
              id: edge.edgeId,
              source: edge.sourceItemId,
              target: edge.targetItemId,
              sourceHandle: edge.sourceHandle,
              targetHandle: edge.targetHandle,
              type: "default",
              label: edge.label ?? undefined,
              markerStart: projectFlowMarker(edge.markerStart),
              markerEnd: projectFlowMarker(edge.markerEnd),
              selectable: false,
              deletable: false,
              animated: edge.status === "saving",
              className: `project-edge-pending ${edge.status}`,
            };
          }
          ''')
          replace_once('  nodes: descriptors,\n  pendingReference = null,\n', '  nodes: descriptors,\n  edges = [],\n  pendingEdge = null,\n  pendingReference = null,\n')
          replace_once('  selectedItemId,\n  geometryInteractionDisabled = false,\n  onSelect,\n  onGeometryCommit,\n', '  selectedItemId,\n  selectedEdgeId = null,\n  geometryInteractionDisabled = false,\n  onSelect,\n  onEdgeSelect = NOOP_EDGE_SELECT,\n  onEdgeConnect,\n  onGeometryCommit,\n')
          replace_once('  const flowNodesRef = useRef<ProjectFlowNode[]>(projectedNodes);\n', '''  const flowNodesRef = useRef<ProjectFlowNode[]>(projectedNodes);
          const projectedEdges = useMemo(() => {
            const active = edges.map((edge) => buildFlowEdge(edge, edge.id === selectedEdgeId));
            if (pendingEdge && !active.some((edge) => edge.id === pendingEdge.edgeId)) active.push(buildPendingFlowEdge(pendingEdge));
            return active;
          }, [edges, pendingEdge, selectedEdgeId]);
          ''')
          replace_once('''  const handleNodeClick = useCallback<NodeMouseHandler<ProjectFlowNode>>((_event, node) => {
            if (!node.data.pendingReference && !node.data.pendingAttachment) onSelect(node.id);
            setContextMenu(null);
          }, [onSelect]);
          const handlePaneClick = useCallback(() => {
            onSelect(null);
            setContextMenu(null);
          }, [onSelect]);
          const handleSelectionChange = useCallback<OnSelectionChangeFunc<ProjectFlowNode>>(({ nodes }) => {
            const selected = [...nodes].reverse().find((node) => !node.data.pendingReference && !node.data.pendingAttachment);
            onSelect(selected?.id ?? null);
          }, [onSelect]);''', '''  const handleNodeClick = useCallback<NodeMouseHandler<ProjectFlowNode>>((_event, node) => {
            if (!node.data.pendingReference && !node.data.pendingAttachment) {
              onSelect(node.id);
              onEdgeSelect(null);
            }
            setContextMenu(null);
          }, [onEdgeSelect, onSelect]);
          const handleEdgeClick = useCallback((_event: React.MouseEvent, edge: ProjectFlowEdge) => {
            if (pendingEdge?.edgeId === edge.id) return;
            onEdgeSelect(edge.id);
            onSelect(null);
            setContextMenu(null);
          }, [onEdgeSelect, onSelect, pendingEdge]);
          const handlePaneClick = useCallback(() => {
            onSelect(null);
            onEdgeSelect(null);
            setContextMenu(null);
          }, [onEdgeSelect, onSelect]);
          const handleSelectionChange = useCallback<OnSelectionChangeFunc<ProjectFlowNode>>(({ nodes }) => {
            const selected = [...nodes].reverse().find((node) => !node.data.pendingReference && !node.data.pendingAttachment);
            if (selected) {
              onSelect(selected.id);
              onEdgeSelect(null);
            }
          }, [onEdgeSelect, onSelect]);
          const handleConnect = useCallback((connection: Connection) => {
            if (geometryInteractionDisabled || !onEdgeConnect || !connection.source || !connection.target
              || !isProjectEdgeHandle(connection.sourceHandle) || !isProjectEdgeHandle(connection.targetHandle)) return;
            onEdgeConnect({
              sourceItemId: connection.source,
              targetItemId: connection.target,
              sourceHandle: connection.sourceHandle,
              targetHandle: connection.targetHandle,
            });
          }, [geometryInteractionDisabled, onEdgeConnect]);''')
          replace_once('    <ReactFlow<ProjectFlowNode>\n      nodes={flowNodes}\n      edges={PROJECT_EDGES}', '    <ReactFlow<ProjectFlowNode, ProjectFlowEdge>\n      nodes={flowNodes}\n      edges={projectedEdges}')
          replace_once('      onNodeClick={handleNodeClick}\n      onSelectionChange={handleSelectionChange}', '      onNodeClick={handleNodeClick}\n      onEdgeClick={handleEdgeClick}\n      onConnect={handleConnect}\n      onSelectionChange={handleSelectionChange}')
          replace_once('      nodesDraggable={!geometryInteractionDisabled}\n      nodesConnectable={false}\n      elementsSelectable', '      nodesDraggable={!geometryInteractionDisabled}\n      nodesConnectable={!geometryInteractionDisabled}\n      edgesReconnectable={false}\n      connectionMode={ConnectionMode.Loose}\n      elementsSelectable')

          path.write_text(text)

          css = Path('src/components/project/project-map-surface.css')
          css_text = css.read_text()
          if '.project-edge-handle {' not in css_text:
              css_text += '''\n\n.project-edge-handle {\n  width: 10px;\n  height: 10px;\n  border-width: 2px;\n}\n\n.project-edge-pending {\n  stroke-dasharray: 6 5;\n}\n'''
          css.write_text(css_text)
          PY
      - name: Verify edge surface types and mounted behavior
        run: |
          npm run test:project-map-mounted
          npm run build
      - name: Commit verified edge surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr136-edge-surface.yml .github/workflows/tmp-pr136-edge-surface-retry.yml
          git add src/components/project/ProjectMapSurface.tsx src/components/project/project-map-surface.css
          git diff --cached --check
          git commit -m "feat(project): render basic Project edges"
          git push origin HEAD:agent/project-basic-edges
