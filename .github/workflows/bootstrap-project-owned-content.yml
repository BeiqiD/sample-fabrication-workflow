name: Bootstrap project owned content workspace

on:
  push:
    branches:
      - agent/project-owned-content

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package dependencies
        run: tar -czf /tmp/project-owned-content-deps.tgz node_modules
      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          name: project-owned-content-dependencies
          path: /tmp/project-owned-content-deps.tgz
          if-no-files-found: error
          retention-days: 1
