name: Finalize project owned content workspace

on:
  push:
    branches:
      - agent/project-owned-content

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified implementation
        shell: bash
        run: |
          set -euo pipefail
          archive=.tmp/project-owned-content-changes.xz.b64
          if [[ ! -f "$archive" ]]; then
            echo "No staged implementation archive; nothing to finalize."
            exit 0
          fi
          base64 --decode "$archive" > /tmp/project-owned-content-changes.tar.xz
          tar -xJf /tmp/project-owned-content-changes.tar.xz -C .
          rm -f "$archive"
          rmdir .tmp 2>/dev/null || true
          git rm --ignore-unmatch .github/workflows/bootstrap-project-owned-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(project): add owned content creation"
          git push origin HEAD:agent/project-owned-content
