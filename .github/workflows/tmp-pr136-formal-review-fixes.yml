name: Temporary PR136 formal review fixes

on:
  push:
    branches:
      - agent/project-basic-edges

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply formal review fixes
        run: |
          python scripts/tmp-pr136-formal-review-fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path("src/project-reference-placement-contract.test.ts")
          text = path.read_text()
          old = 'expect(map).toContain("buildFlowNode(descriptor, true, null, callbacks)");'
          new = 'expect(map).toContain("buildFlowNode(descriptor, true, true, null, callbacks)");\n    expect(map).toContain("edgeInteractionDisabled: boolean");'
          if text.count(old) != 1:
              raise SystemExit(f"expected one Phase 3B2 pending-node contract anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused edge mounted regressions
        run: npm run test:project-edges-mounted

      - name: Verify edge slice
        run: npm run verify:project-edges

      - name: Run complete tests and mounted suite
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified formal review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-pr136-formal-review-fixes.py
          git add \
            src/components/project/ProjectMapSurface.tsx \
            src/pages/ProjectPage.tsx \
            src/lib/use-project-edge-controller.ts \
            src/project-edges.mount.test.tsx \
            src/project-edge-surface.mount.test.tsx \
            src/project-edges-contract.test.ts \
            src/project-reference-placement-contract.test.ts \
            docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md \
            docs/PROJECT_EDGES_IMPLEMENTATION_PLAN.md \
            docs/PRODUCT_ROADMAP.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(project): address formal edge review"
          git push origin HEAD:agent/project-basic-edges
