name: Temporary PR136 edge mounted

on:
  push:
    branches:
      - agent/project-basic-edges
    paths:
      - .github/workflows/tmp-pr136-edge-mounted.yml

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run focused Project edge mounted tests
        run: npx vitest run --config vitest.mounted.config.ts src/project-edges.mount.test.tsx src/project-edge-surface.mount.test.tsx
      - name: Remove temporary workflow after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr136-edge-mounted.yml
          git commit -m "chore(ci): remove PR136 edge mounted isolator"
          git push origin HEAD:agent/project-basic-edges
