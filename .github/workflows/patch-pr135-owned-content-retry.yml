name: Patch PR135 owned-content retry semantics

on:
  push:
    branches:
      - agent/project-owned-content

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-owned-content
      - name: Apply focused retry-state patch
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('src/pages/ProjectPage.tsx')
          page = page_path.read_text()
          replacements = [
              (
                  'if (!projectId || !snapshot || !current || current.status === "saving" || !current.value.trim()) return;',
                  'if (!projectId || !snapshot || !current || (current.status !== "editing" && current.status !== "uncertain") || !current.value.trim()) return;',
              ),
              (
                  'if (!current || (current.status !== "error" && current.status !== "conflict" && current.status !== "uncertain")) return;\n    void saveMarkdown();',
                  'if (!current || current.status !== "uncertain") return;\n    void saveMarkdown();',
              ),
              (
                  'if (!file || !current || (current.status !== "error" && current.status !== "conflict" && current.status !== "uncertain")) return;',
                  'if (!file || !current || current.status !== "uncertain") return;',
              ),
              (
                  'if (!projectId || !snapshot || !current || current.status === "saving") return;\n    const content = snapshot.contents.find((candidate) => candidate.id === current.contentId);',
                  'if (!projectId || !snapshot || !current || (current.status !== "editing" && current.status !== "uncertain")) return;\n    const content = snapshot.contents.find((candidate) => candidate.id === current.contentId);',
              ),
              (
                  'if (!current || (current.status !== "error" && current.status !== "conflict" && current.status !== "uncertain")) return;\n    void saveAttachmentMetadata();',
                  'if (!current || current.status !== "uncertain") return;\n    void saveAttachmentMetadata();',
              ),
              (
                  ': "The attachment operation must be retried or explicitly cancelled before leaving."',
                  ': "The attachment operation failed deterministically. Cancel it before leaving, then start a new attachment operation if needed."',
              ),
              (
                  '{(pendingAttachment?.status === "error" || pendingAttachment?.status === "conflict" || pendingAttachment?.status === "uncertain") && <button type="button" className="button primary compact-button" onClick={retryAttachment}>Retry attachment</button>}',
                  '{pendingAttachment?.status === "uncertain" && <button type="button" className="button primary compact-button" onClick={retryAttachment}>Retry exact attachment</button>}',
              ),
              (
                  '{(markdownEditor?.status === "error" || markdownEditor?.status === "conflict" || markdownEditor?.status === "uncertain") && <button type="button" className="button primary compact-button" onClick={retryMarkdownSave}>Retry exact Markdown save</button>}',
                  '{markdownEditor?.status === "uncertain" && <button type="button" className="button primary compact-button" onClick={retryMarkdownSave}>Retry exact Markdown save</button>}',
              ),
              (
                  '{(attachmentEditor?.status === "error" || attachmentEditor?.status === "conflict" || attachmentEditor?.status === "uncertain") && <button type="button" className="button primary compact-button" onClick={retryAttachmentMetadata}>Retry exact metadata save</button>}',
                  '{attachmentEditor?.status === "uncertain" && <button type="button" className="button primary compact-button" onClick={retryAttachmentMetadata}>Retry exact metadata save</button>}',
              ),
              (
                  '{(pendingAttachment.status === "error" || pendingAttachment.status === "conflict" || pendingAttachment.status === "uncertain") && <div className="project-owned-content-pending-actions">\n            <button type="button" className="button primary compact-button" onClick={retryAttachment}>Retry</button>\n            {(pendingAttachment.status !== "uncertain" || !pendingAttachmentInputRef.current) && <button type="button" className="button compact-button" onClick={() => cancelAttachment(false)}>Cancel</button>}\n          </div>}',
                  '{(pendingAttachment.status === "error" || pendingAttachment.status === "conflict" || pendingAttachment.status === "uncertain") && <div className="project-owned-content-pending-actions">\n            {pendingAttachment.status === "uncertain" && <button type="button" className="button primary compact-button" onClick={retryAttachment}>Retry exact attachment</button>}\n            {(pendingAttachment.status !== "uncertain" || !pendingAttachmentInputRef.current) && <button type="button" className="button compact-button" onClick={() => cancelAttachment(false)}>Cancel</button>}\n          </div>}',
              ),
              (
                  '<button type="button" className="button primary compact-button" disabled={attachmentEditor.status === "saving"} onClick={() => void saveAttachmentMetadata()}>\n                {attachmentEditor.status === "saving" ? "Saving…" : attachmentEditor.status === "uncertain" ? "Retry exact save" : "Save metadata"}\n              </button>',
                  '{(attachmentEditor.status === "editing" || attachmentEditor.status === "saving" || attachmentEditor.status === "uncertain") && <button type="button" className="button primary compact-button" disabled={attachmentEditor.status === "saving"} onClick={() => void saveAttachmentMetadata()}>\n                {attachmentEditor.status === "saving" ? "Saving…" : attachmentEditor.status === "uncertain" ? "Retry exact save" : "Save metadata"}\n              </button>}',
              ),
          ]
          for old, new in replacements:
              count = page.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              page = page.replace(old, new)
          page_path.write_text(page)

          test_path = Path('src/project-owned-content-contract.test.ts')
          test = test_path.read_text()
          marker = '\n  it("uses MIME identity for image rendering and keeps source attachments on the reference path", () => {'
          addition = '''\n  it("only exact-retries outcome-uncertain owned-content mutations", () => {\n    const page = read("./pages/ProjectPage.tsx");\n    expect(page).toContain('if (!current || current.status !== "uncertain") return;\\n    void saveMarkdown();');\n    expect(page).toContain('if (!file || !current || current.status !== "uncertain") return;');\n    expect(page).toContain('if (!current || current.status !== "uncertain") return;\\n    void saveAttachmentMetadata();');\n    expect(page).toContain('pendingAttachment?.status === "uncertain"');\n    expect(page).toContain('markdownEditor?.status === "uncertain"');\n    expect(page).toContain('attachmentEditor?.status === "uncertain"');\n    expect(page).not.toContain('pendingAttachment?.status === "error" || pendingAttachment?.status === "conflict" || pendingAttachment?.status === "uncertain") && <button type="button" className="button primary compact-button" onClick={retryAttachment}');\n  });\n'''
          if marker not in test:
              raise SystemExit('Could not find contract-test insertion marker')
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test)
          PY
      - name: Commit focused patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pr135-owned-content-retry.yml
          git add src/pages/ProjectPage.tsx src/project-owned-content-contract.test.ts
          git diff --cached --check
          git commit -m "fix(project): limit exact retry to uncertain outcomes"
          git push origin HEAD:agent/project-owned-content
