name: Temporary Map double-click fix

on:
  push:
    branches:
      - agent/fix-project-map-double-click

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-project-map-double-click
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply fix
        run: python scripts/tmp-fix-project-map-double-click.py
      - name: Run real Surface regression
        run: npm run test:project-map-mounted -- --run src/project-map-surface.mount.test.tsx
      - name: Run owned-content gate
        run: npm run verify:project-owned-content
      - name: Run full tests
        run: npm test
      - name: Run production build
        run: npm run build
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-fix-project-map-double-click.py
          git add src/components/project/ProjectMapSurface.tsx src/project-map-surface.mount.test.tsx
          git commit -m "fix(project): reserve Map double click for Markdown"
          git push origin HEAD:agent/fix-project-map-double-click
