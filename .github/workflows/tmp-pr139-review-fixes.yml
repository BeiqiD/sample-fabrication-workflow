name: Temporary PR 139 review fixes

on:
  push:
    branches:
      - agent/project-stability-local-geometry-delete

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-stability-local-geometry-delete
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply review fixes
        run: python scripts/tmp-pr139-review-fixes-v2.py

      - name: Run focused mounted regressions
        run: |
          npm run test:project-edges-mounted
          npm run test:project-map-mounted

      - name: Verify Project Map
        run: npm run verify:project-map

      - name: Verify Project edges
        run: npm run verify:project-edges

      - name: Verify Project Reading
        run: npm run verify:project-reading

      - name: Run complete tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            scripts/tmp-pr139-review-fixes.py \
            scripts/tmp-pr139-review-fixes-v2.py
          git add \
            src/pages/ProjectPage.tsx \
            src/project-edges.mount.test.tsx \
            src/project-deletion.mount.test.tsx
          git commit -m "fix(project): address PR 139 review blockers"
          git push origin HEAD:agent/project-stability-local-geometry-delete
