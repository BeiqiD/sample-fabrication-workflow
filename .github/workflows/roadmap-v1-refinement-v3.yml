name: Apply v1 roadmap refinement v3

on:
  push:
    branches:
      - agent/roadmap-v1-feature-freeze-ui-refinement

permissions:
  contents: write

jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact documentation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fe36632d70039689c5af8d968dd3d81e41bc8ea0"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/roadmap-v1-refinement-v3.yml"

      - name: Apply roadmap update and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/roadmap-v1-refinement-runner-v3.py
          rm -f \
            .github/roadmap-v1-refinement-runner.py \
            .github/roadmap-v1-refinement-runner-v3.py \
            .github/workflows/roadmap-v1-refinement.yml \
            .github/workflows/roadmap-v1-refinement-v2.yml \
            .github/workflows/roadmap-v1-refinement-v3.yml
          git diff --check
          git add -A
          while IFS= read -r path; do
            case "$path" in
              docs/PRODUCT_ROADMAP.md|\
              .github/roadmap-v1-refinement-runner.py|\
              .github/roadmap-v1-refinement-runner-v3.py|\
              .github/workflows/roadmap-v1-refinement.yml|\
              .github/workflows/roadmap-v1-refinement-v2.yml|\
              .github/workflows/roadmap-v1-refinement-v3.yml)
                ;;
              *)
                echo "Unexpected staged path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          test -f docs/PRODUCT_ROADMAP.md
          test ! -e .github/workflows/roadmap-v1-refinement.yml
          test ! -e .github/workflows/roadmap-v1-refinement-v2.yml
          test ! -e .github/workflows/roadmap-v1-refinement-v3.yml

      - name: Commit documentation-only roadmap update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: define v1 feature freeze and refinement phases"
          git push origin "HEAD:${GITHUB_REF_NAME}"
