name: Debug Project Persistence

on:
  push:
    branches:
      - codex/project-persistence-service
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/project-persistence-service
          fetch-depth: 0

      - name: Apply reviewed Project service corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("worker/projects/service.ts")
          source = path.read_text()
          changed = False

          def apply(pattern: str, replacement: str, marker: str) -> None:
              global source, changed
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count == 1:
                  source = updated
                  changed = True
                  return
              if marker not in source:
                  raise SystemExit(f"Reviewed service pattern was not found: {marker}")

          apply(
              r'''async function requireItemBundle\(db: D1Database, projectId: string, itemId: string\) \{\s+const bundle = await readItemBundle\(db, projectId, itemId\);\s+if \(!bundle\) notFound\("Project item not found"\);\s+return bundle;\s+\}''',
              '''async function requireItemBundle(db: D1Database, projectId: string, itemId: string) {
            const bundle = await readItemBundle(db, projectId, itemId);
            if (!bundle) notFound("Project item not found");
            if (!bundle.placement) {
              conflict("Project item is missing its authoritative placement");
            }
            return bundle;
          }''',
              'Project item is missing its authoritative placement',
          )
          apply(
              r'''WHERE pc\.project_id = \? AND pc\.deleted_at IS NULL AND pi\.deleted_at IS NULL\s+ORDER BY pi\.created_sequence, pc\.id\s+`\)\.bind\(projectId\),''',
              '''WHERE pc.project_id = ?
              AND (? = 1 OR (pc.deleted_at IS NULL AND pi.deleted_at IS NULL))
            ORDER BY pi.created_sequence, pc.id
          `).bind(projectId, includeDeleted ? 1 : 0),''',
              'ORDER BY pi.created_sequence, pc.id\n          `).bind(projectId, includeDeleted ? 1 : 0)',
          )
          apply(
              r'''WHERE pc\.project_id = \? AND pc\.deleted_at IS NULL AND pi\.deleted_at IS NULL\s+ORDER BY pi\.created_sequence, pca\.project_content_id\s+`\)\.bind\(projectId\),''',
              '''WHERE pc.project_id = ?
              AND (? = 1 OR (pc.deleted_at IS NULL AND pi.deleted_at IS NULL))
            ORDER BY pi.created_sequence, pca.project_content_id
          `).bind(projectId, includeDeleted ? 1 : 0),''',
              'ORDER BY pi.created_sequence, pca.project_content_id\n          `).bind(projectId, includeDeleted ? 1 : 0)',
          )
          apply(
              r'''SELECT \* FROM project_items\s+WHERE project_id = \? AND deleted_at IS NULL\s+ORDER BY created_sequence, id\s+`\)\.bind\(projectId\),''',
              '''SELECT * FROM project_items
            WHERE project_id = ? AND (? = 1 OR deleted_at IS NULL)
            ORDER BY created_sequence, id
          `).bind(projectId, includeDeleted ? 1 : 0),''',
              'WHERE project_id = ? AND (? = 1 OR deleted_at IS NULL)',
          )
          apply(
              r'''WHERE pi\.project_id = \? AND pi\.deleted_at IS NULL\s+ORDER BY pi\.created_sequence, pmp\.id\s+`\)\.bind\(projectId\),''',
              '''WHERE pi.project_id = ? AND (? = 1 OR pi.deleted_at IS NULL)
            ORDER BY pi.created_sequence, pmp.id
          `).bind(projectId, includeDeleted ? 1 : 0),''',
              'ORDER BY pi.created_sequence, pmp.id\n          `).bind(projectId, includeDeleted ? 1 : 0)',
          )
          apply(
              r'''WHERE pe\.project_id = \? AND pe\.deleted_at IS NULL\s+AND source\.deleted_at IS NULL AND target\.deleted_at IS NULL\s+ORDER BY pe\.created_at, pe\.id\s+`\)\.bind\(projectId\),''',
              '''WHERE pe.project_id = ?
              AND (? = 1 OR (
                pe.deleted_at IS NULL
                AND source.deleted_at IS NULL
                AND target.deleted_at IS NULL
              ))
            ORDER BY pe.created_at, pe.id
          `).bind(projectId, includeDeleted ? 1 : 0),''',
              'ORDER BY pe.created_at, pe.id\n          `).bind(projectId, includeDeleted ? 1 : 0)',
          )
          apply(
              r'''WHERE pi\.project_id = \? AND pi\.deleted_at IS NULL\s+ORDER BY rt\.target_type, rt\.target_id\s+`\)\.bind\(projectId\),''',
              '''WHERE pi.project_id = ? AND (? = 1 OR pi.deleted_at IS NULL)
            ORDER BY rt.target_type, rt.target_id
          `).bind(projectId, includeDeleted ? 1 : 0),''',
              'ORDER BY rt.target_type, rt.target_id\n          `).bind(projectId, includeDeleted ? 1 : 0)',
          )
          apply(
              r'''if \(results\.some\(\(result\) => resultChanges\(result\) !== 1\)\) \{\s+return returnCreateReplayOrConflict\(\s+db,\s+projectId,\s+input\.itemId,\s+\(bundle\) => bundleMatchesAttachmentCreate\(bundle, input\),\s+\);\s+\}''',
              '''if (
              resultChanges(results[0]) !== 1
              || resultChanges(results[1]) !== 1
              || resultChanges(results[2]) < 1
              || resultChanges(results[3]) !== 1
              || resultChanges(results[4]) !== 1
            ) {
              return returnCreateReplayOrConflict(
                db,
                projectId,
                input.itemId,
                (bundle) => bundleMatchesAttachmentCreate(bundle, input),
              );
            }''',
              'resultChanges(results[2]) < 1',
          )

          if changed:
              path.write_text(source)
          PY

      - name: Commit reviewed Project service corrections
        run: |
          if git diff --quiet -- worker/projects/service.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/projects/service.ts
          git commit -m "fix(project): harden snapshot and attachment replay semantics"
          git push origin HEAD:codex/project-persistence-service

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Project persistence verification
        id: persistence
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:project-persistence 2>&1 | tee project-persistence.log

      - name: Upload Project persistence log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: project-persistence-diagnostics-${{ github.sha }}
          path: project-persistence.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when Project persistence verification failed
        if: ${{ steps.persistence.outcome != 'success' }}
        run: exit 1
