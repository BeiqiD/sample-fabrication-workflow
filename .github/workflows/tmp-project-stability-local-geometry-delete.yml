name: Temporary Project stability fixes

on:
  push:
    branches:
      - agent/project-stability-local-geometry-delete

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-stability-local-geometry-delete
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply stability fixes
        run: |
          python scripts/tmp-project-stability-local-geometry-delete.py
          python scripts/tmp-project-stability-followup.py
          python scripts/tmp-project-stability-navigation.py

      - name: Run focused stability tests
        run: |
          npm run test:project-map-mounted
          npm run test:project-edges-mounted
          npm run test:project-edges
          npm run test:project-map

      - name: Verify Project persistence
        run: npm run verify:project-persistence

      - name: Verify Project Map
        run: npm run verify:project-map

      - name: Verify Project edges
        run: npm run verify:project-edges

      - name: Verify Project Reading
        run: npm run verify:project-reading

      - name: Run complete tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified stability fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            scripts/tmp-project-stability-local-geometry-delete.py \
            scripts/tmp-project-stability-followup.py \
            scripts/tmp-project-stability-navigation.py
          git add \
            docs/PRODUCT_ROADMAP.md \
            docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md \
            docs/PROJECT_READING_IMPLEMENTATION_PLAN.md \
            package.json \
            src/components/ConfirmDeleteDialog.tsx \
            src/lib/project-client.ts \
            src/lib/project-client.test.ts \
            src/pages/ProjectPage.tsx \
            src/project-deletion.mount.test.tsx \
            src/project-edge-surface.mount.test.tsx \
            src/project-edges-contract.test.ts \
            src/project-edges.mount.test.tsx \
            src/project-local-working-state.mount.test.tsx
          if git diff --cached --quiet; then
            echo "No Project stability changes to commit"
            exit 0
          fi
          git commit -m "fix(project): stabilize local geometry and lifecycle"
          git push origin HEAD:agent/project-stability-local-geometry-delete
