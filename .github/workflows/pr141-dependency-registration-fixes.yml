name: Apply PR 141 dependency and registration fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: apply PR 141 dependency and registration fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply complete dependency and registration reconciliation fixes
        shell: bash
        run: |
          cat > /tmp/apply-pr141.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/apply-pr141.py.gz.b64 | gzip -d > /tmp/apply-pr141.py
          python /tmp/apply-pr141.py

      - name: Install dependencies
        run: npm ci

      - name: Verify complete implementation
        run: |
          npm run verify:blob-lifecycle
          npm run verify:project-persistence
          npm test
          npm run build
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            migrations/0027_fabublox_dependency_publication.sql \
            worker/blob-lifecycle/registration.ts \
            worker/index.ts \
            worker/comment-submission-routes.ts \
            worker/project-foundation-routes.ts \
            worker/fabublox-import-recovery.test.ts \
            worker/blob-registration-reconciliation.test.ts \
            docs/BLOB_LIFECYCLE_CONTRACT.md \
            docs/BLOB_LIFECYCLE_IMPLEMENTATION_PLAN.md \
            docs/BLOB_LIFECYCLE_OPERATIONS.md
          git rm .github/workflows/pr141-dependency-registration-fixes.yml
          git commit -m "fix: validate import dependencies and reconcile uploads"
          git push origin HEAD:agent/storage-integrity-markdown-removal
