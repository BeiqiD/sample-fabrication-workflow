name: PR 141 primary reconciliation fix rerun

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-integrity-markdown-removal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1f5fbc94d3dd188e3be8c64b19ce6c912cf3608a"
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path(".github/workflows/pr141-primary-reconciliation-fix.yml")
          lines = source_path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          source = textwrap.dedent("\n".join(lines[start:end]))
          exec(compile(source, str(source_path), "exec"), {"__name__": "__main__"})

          Path(".github/workflows/pr141-primary-reconciliation-fix-rerun.yml").unlink()
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify lifecycle and storage integrity
        run: npm run verify:blob-lifecycle
      - name: Run ordinary and mounted tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/blob-lifecycle/registration.ts worker/index.ts worker/comment-submission-routes.ts worker/project-foundation-routes.ts worker/blob-registration-reconciliation.test.ts .github/workflows/pr141-primary-reconciliation-fix.yml .github/workflows/pr141-primary-reconciliation-fix-rerun.yml
          git commit -m "fix(storage): preserve R2 objects when reconciliation authority is unavailable"
          git push origin HEAD:agent/storage-integrity-markdown-removal
