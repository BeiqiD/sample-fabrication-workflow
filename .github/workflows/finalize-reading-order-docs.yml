name: Finalize Reading-order document wording

on:
  push:
    branches:
      - agent/global-reference-search-ui

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-reference-search-ui
          fetch-depth: 0

      - name: Remove remaining superseded wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/PRODUCT_ROADMAP.md',
              '  creates the occurrence, and creates both placements;\n',
              '  creates the occurrence, creates its Map placement, and assigns\n  `created_sequence`;\n',
              'authoritative insertion wording',
          )
          replace_once(
              'docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md',
              '   previews, save/conflict UX, accessible ordering.\n',
              '   previews, save/conflict UX, and accessible Reading presentation.\n',
              'Phase 3D wording',
          )
          PY
          rm .github/workflows/finalize-reading-order-docs.yml
          rm .github/finalize-reading-order.trigger

      - name: Validate final document wording
        run: |
          git diff --check
          ! grep -q 'creates both placements' docs/PRODUCT_ROADMAP.md
          ! grep -q 'accessible ordering' docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize insertion-order Reading contract'
          git push origin HEAD:agent/global-reference-search-ui
