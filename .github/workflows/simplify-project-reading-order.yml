name: Simplify first Project Reading order contract

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  simplify:
    if: github.event.pull_request.head.ref == 'agent/global-reference-search-ui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-reference-search-ui
          fetch-depth: 0

      - name: Apply insertion-order-only Reading contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # Canvas interaction contract
          path = Path('docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'Map is the primary creation and organization interface. Reading is a linear\n'
              'projection for review, narrative editing, and ordering. They never own separate\n'
              'copies of the content.\n',
              'Map is the primary creation and organization interface. Reading is a linear\n'
              'projection for review and limited editing. In the first version it follows the\n'
              'immutable Project-item insertion sequence. The projections never own separate\n'
              'copies of the content.\n',
              'Canvas core Reading role',
          )
          text = replace_once(
              text,
              '- Reading position;\n',
              '- deterministic Reading position derived from creation sequence;\n',
              'repeated reference Reading position',
          )
          text = replace_once(
              text,
              '- adjusting Reading order through a simple accessible control; and\n',
              '- reviewing the fixed insertion-order sequence; and\n',
              'mobile Reading order control',
          )
          text = replace_once(
              text,
              '5. creates its Map placement;\n'
              '6. creates its Reading placement; and\n'
              '7. returns the canonical inserted item and Project revision.\n',
              '5. creates its Map placement;\n'
              '6. assigns its immutable per-Project creation sequence; and\n'
              '7. returns the canonical inserted item and Project revision.\n',
              'reference insertion Reading placement',
          )
          start = text.index('## Reading projection and ordering\n')
          end = text.index('## Markdown and mixed media\n')
          replacement = '''## Reading projection and first-version order

Reading contains every active Project item occurrence and provides no creation
operations. It allows:

- complete rendering of existing items;
- editing existing Project-owned Markdown;
- editing allowed metadata of existing Project-owned attachments; and
- opening references and Inspector.

Reference blocks remain read-only. Mobile defaults to this projection and keeps
the same limited editing boundary.

### Initial deterministic order

The first Project release orders Reading strictly by immutable Project-local
insertion sequence:

```text
created_sequence ascending
project_item.id ascending as a deterministic tie-breaker
```

`created_sequence` is assigned transactionally when the Project item occurrence
is created and is never rewritten by Map position, node movement, edge direction,
or content edits. Every active occurrence therefore appears in Reading without a
separate Reading-placement row.

The initial release has no manual Reading reorder, `position_key`,
`reading_role`, topological sort, or cycle-resolution UX. Visual arrows express
Map relationships only and never affect Reading order.

A later phase may introduce explicit custom ordering or an edge-informed linear
projection after real Project use demonstrates the need. That later decision may
add a dedicated ordering model and migration; Phase 3A should not reserve
speculative columns or tables now.

'''
          text = text[:start] + replacement + text[end:]
          text = replace_once(
              text,
              '- update Reading placement/order;\n',
              '',
              'save Reading mutation',
          )
          text = replace_once(
              text,
              'project_items                    Project-local occurrences; content XOR reference\n'
              'project_map_placements           one active placement per occurrence\n'
              'project_reading_placements       one active position per occurrence\n'
              'project_edges                    Project-local edges with fixed handles/markers\n',
              'project_items                    Project-local occurrences; content XOR reference; immutable created_sequence\n'
              'project_map_placements           one active placement per occurrence\n'
              'project_edges                    Project-local edges with fixed handles/markers; no Reading-order field in v1\n',
              'Canvas schema list',
          )
          text = replace_once(
              text,
              'Every active Project item occurrence must have both a Map placement and Reading\n'
              'placement, even if one is initially auto-generated.\n',
              'Every active Project item occurrence has one Map placement and automatically\n'
              'appears in Reading through `project_items.created_sequence`. The first version\n'
              'does not persist a separate Reading placement.\n',
              'Canvas placement invariant',
          )
          text = replace_once(
              text,
              '- assume every directed edge defines Reading order;\n',
              '- assume any Map edge affects first-version Reading order;\n- add speculative Reading-order tables or columns before a concrete later design;\n',
              'Canvas migration non-goal',
          )
          text = replace_once(
              text,
              '1. **Phase 3A — Project core schema and save contracts**: normalized identities,\n'
              '   generic attachments, placements, edges, revisions, authoritative reference\n'
              '   insertion, removal, export, and D1/workerd gates.\n',
              '1. **Phase 3A — Project core schema and save contracts**: normalized identities,\n'
              '   generic attachments, immutable creation sequence, Map placements, edges,\n'
              '   revisions, authoritative reference insertion, removal, export, and\n'
              '   D1/workerd gates.\n',
              'Canvas Phase 3A',
          )
          text = replace_once(
              text,
              '4. **Phase 3B3 — Project-owned creation**: double-click Markdown, generic Add\n'
              '   attachment, image/file rendering, same-item Reading placement.\n',
              '4. **Phase 3B3 — Project-owned creation**: double-click Markdown, generic Add\n'
              '   attachment, image/file rendering, and automatic insertion-order Reading\n'
              '   inclusion.\n',
              'Canvas Phase 3B3',
          )
          text = replace_once(
              text,
              '6. **Phase 3C — Reading projection**: no creation, complete rendering, editing of\n'
              '   existing owned content, manual/order-constraint work.\n',
              '6. **Phase 3C — Reading projection**: no creation, complete insertion-order\n'
              '   rendering, and editing of existing owned content.\n',
              'Canvas Phase 3C',
          )
          text = replace_once(
              text,
              '- the final Reading linearization and cycle-resolution UX;\n',
              '- whether later versions need manual or edge-informed Reading order;\n',
              'Canvas deferred Reading question',
          )
          path.write_text(text, encoding='utf-8')

          # Current Project design foundation
          path = Path('docs/PROJECT_DESIGN_FOUNDATION.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '- Reading positions;\n',
              '- immutable Project-local creation sequence used by Reading;\n',
              'foundation owned Reading position',
          )
          text = replace_once(
              text,
              '- Reading position;\n',
              '- deterministic Reading position derived from creation sequence;\n',
              'foundation repeated reference Reading position',
          )
          text = replace_once(
              text,
              '1. source or Project-content identity;\n'
              '2. external reference-registry identity;\n'
              '3. Project-local item occurrence identity;\n'
              '4. Map placement identity;\n'
              '5. Reading placement identity.\n',
              '1. source or Project-content identity;\n'
              '2. external reference-registry identity;\n'
              '3. Project-local item occurrence identity, including immutable creation sequence;\n'
              '4. Map placement identity.\n\n'
              'Reading is initially derived from the item occurrence creation sequence rather\n'
              'than owning a separate placement identity.\n',
              'foundation identity layers',
          )
          text = replace_once(
              text,
              'Each active Project item occurrence has:\n\n'
              '- one active Map placement; and\n'
              '- one active Reading placement.\n\n'
              'One may initially be auto-generated, but Map-only and Reading-only content are\n'
              'not first-version states. Coordinates and Reading order are different metadata\n'
              'over the same occurrence.\n',
              'Each active Project item occurrence has one active Map placement and appears\n'
              'automatically in Reading through its immutable `created_sequence`. Map-only and\n'
              'Reading-only content are not first-version states, but Reading does not require\n'
              'a separate placement row until a later custom-order design exists.\n',
              'foundation both projections',
          )
          text = replace_once(
              text,
              'project_map_placements\n'
              '- project_item_id\n'
              '- x\n'
              '- y\n'
              '- width\n'
              '- height\n'
              '- z_index\n'
              '- updated_at\n\n'
              'project_reading_placements\n'
              '- project_item_id\n'
              '- position_key\n'
              '- updated_at\n\n'
              'project_edges\n',
              'project_map_placements\n'
              '- project_item_id\n'
              '- x\n'
              '- y\n'
              '- width\n'
              '- height\n'
              '- z_index\n'
              '- updated_at\n\n'
              'project_edges\n',
              'foundation remove Reading table',
          )
          text = replace_once(
              text,
              '- label\n- reading_role                # reserved: none | precedes\n- created_at\n',
              '- label\n- created_at\n',
              'foundation remove reading_role',
          )
          text = replace_once(
              text,
              'creates both placements, and returns the new Project revision.\n',
              'creates the Map placement, assigns `created_sequence`, and returns the new\nProject revision.\n',
              'foundation insertion placements',
          )
          text = replace_once(
              text,
              '- open references and Inspector; and\n- adjust linear order through an accessible control.\n',
              '- open references and Inspector; and\n- follow the deterministic insertion-order sequence.\n',
              'foundation Reading controls',
          )
          start = text.index('### Reading order reservation\n')
          end = text.index('## Markdown and mixed media\n')
          replacement = '''### First-version Reading order

Reading initially follows immutable Project-local insertion order only:

```text
created_sequence ascending
project_item.id ascending as a deterministic tie-breaker
```

The first Project schema does not add `project_reading_placements`,
`position_key`, `reading_role`, manual reordering, topological sorting, or cycle
handling. Map coordinates and arrows do not affect Reading order.

A later phase may add a dedicated custom-order model after real use clarifies
whether manual ordering, edge-informed ordering, or both are worthwhile. That
future decision is intentionally allowed to add a migration rather than forcing
speculative ordering fields into Phase 3A.

'''
          text = text[:start] + replacement + text[end:]
          text = replace_once(
              text,
              'Visual direction and Reading-order participation are separate fields.\n',
              'Visual direction affects Map presentation only; edges do not participate in\nfirst-version Reading order.\n',
              'foundation edge Reading behavior',
          )
          text = replace_once(
              text,
              'normalized mutations for items, content, placements, Reading order, and edges.\n',
              'normalized mutations for items, content, Map placements, and edges.\n',
              'foundation save mutations',
          )
          text = replace_once(
              text,
              '- Map and Reading placements;\n',
              '- Map placements and the item creation sequence used by Reading;\n',
              'foundation export Reading placement',
          )
          text = replace_once(
              text,
              '2. Phase 3A Project core schema, save/revision contract, placements, basic-edge\n'
              '   schema, authoritative insertion, and export;\n',
              '2. Phase 3A Project core schema, save/revision contract, creation sequence, Map\n'
              '   placement, basic-edge schema, authoritative insertion, and export;\n',
              'foundation roadmap Phase 3A',
          )
          text = replace_once(
              text,
              '7. Phase 3C no-creation Reading projection;\n',
              '7. Phase 3C no-creation insertion-order Reading projection;\n',
              'foundation roadmap Phase 3C',
          )
          path.write_text(text, encoding='utf-8')

          # Canonical roadmap
          path = Path('docs/PRODUCT_ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '│  ├─ edit allowed attachment metadata\n'
              '│  └─ adjust order, but create no new items\n',
              '│  ├─ edit allowed attachment metadata\n'
              '│  └─ follow immutable insertion order and create no new items\n',
              'roadmap final Reading interaction',
          )
          text = replace_once(
              text,
              '2. **Identity layers remain separate.** Source/content identity,\n'
              '   `reference_targets`, Project-item occurrence identity, and Map/Reading\n'
              '   placement identity are not collapsed into one row or one React Flow node.\n'
              '3. **Map and Reading share content.** Every active Project item occurrence has\n'
              '   both a Map placement and a Reading placement. Editing content once updates\n'
              '   both projections.\n',
              '2. **Identity layers remain separate.** Source/content identity,\n'
              '   `reference_targets`, Project-item occurrence identity, and Map placement\n'
              '   identity are not collapsed into one row or one React Flow node.\n'
              '3. **Map and Reading share content.** Every active Project item occurrence has\n'
              '   a Map placement and automatically appears in Reading by immutable creation\n'
              '   sequence. Editing content once updates both projections.\n',
              'roadmap identity and Reading invariant',
          )
          text = replace_once(
              text,
              '- one active `project_map_placements` row per item occurrence;\n'
              '- one active `project_reading_placements` row per item occurrence;\n'
              '- `project_edges` with fixed four-side handles, endpoint marker direction, and\n',
              '- one active `project_map_placements` row per item occurrence;\n'
              '- immutable per-Project `created_sequence` on each item occurrence for Reading;\n'
              '- `project_edges` with fixed four-side handles, endpoint marker direction, and\n',
              'roadmap Phase 3A placement rows',
          )
          text = replace_once(
              text,
              'references, persist both placements and basic edges, save safely, reopen the\n'
              'Project, and export it completely.\n',
              'references, persist Map placements and basic edges, derive Reading from creation\n'
              'sequence, save safely, reopen the Project, and export it completely.\n',
              'roadmap Phase 3A exit',
          )
          text = replace_once(
              text,
              '- automatically create the Reading placement with deterministic insertion order.\n',
              '- make the new occurrence appear in Reading automatically through creation sequence.\n',
              'roadmap Phase 3B2 Reading placement',
          )
          text = replace_once(
              text,
              '- same occurrence automatically receives a Reading placement;\n',
              '- same occurrence automatically appears in Reading by creation sequence;\n',
              'roadmap Phase 3B3 Reading placement',
          )
          text = replace_once(
              text,
              '- references remain read-only;\n'
              '- simple accessible Reading reorder;\n'
              '- Map coordinates and edges remain intact;\n',
              '- references remain read-only;\n'
              '- fixed deterministic insertion-order presentation;\n'
              '- Map coordinates and edges remain intact;\n',
              'roadmap Phase 3C scope',
          )
          text = replace_once(
              text,
              'Reading ordering combines stable insertion/manual order with explicit\n'
              'ordered-arrow constraints. The schema stores immutable creation sequence,\n'
              'editable `position_key`, and optional future `reading_role = precedes` on edges.\n'
              'The final topological/cycle UX is deferred until this phase rather than frozen in\n'
              'Phase 3A.\n',
              'Reading initially uses immutable insertion sequence only. Phase 3A adds no\n'
              'Reading-placement table, manual reorder, edge-order field, topological sort, or\n'
              'cycle UX. A later dedicated design may add custom or edge-informed ordering if\n'
              'real Project use demonstrates the need.\n',
              'roadmap Phase 3C ordering paragraph',
          )
          text = replace_once(
              text,
              '8. Reading-order overlay and explicit order generation from marked edges;\n',
              '8. optional custom Reading-order design after real use demonstrates a need;\n',
              'roadmap advanced Canvas order',
          )
          text = replace_once(
              text,
              '- final Reading topological/cycle tooling beyond the reserved schema;\n',
              '- optional manual or edge-informed Reading ordering after real use;\n',
              'roadmap later Reading capability',
          )
          path.write_text(text, encoding='utf-8')

          # README discoverability
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '- [Data model](./docs/DATA_MODEL.md)\n'
              '- [Project, Text, and Map design foundation](./docs/PROJECT_DESIGN_FOUNDATION.md)\n',
              '- [Data model](./docs/DATA_MODEL.md)\n'
              '- [Product goal and roadmap](./docs/PRODUCT_ROADMAP.md)\n'
              '- [Current Map-first Project design foundation](./docs/PROJECT_DESIGN_FOUNDATION.md)\n'
              '- [Project Canvas interaction contract](./docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md)\n',
              'README Project docs',
          )
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/simplify-project-reading-order.yml

      - name: Validate simplified contract
        run: |
          grep -q 'orders Reading strictly by immutable Project-local' docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md
          grep -q 'does not persist a separate Reading placement' docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md
          grep -q 'does not add `project_reading_placements`' docs/PROJECT_DESIGN_FOUNDATION.md
          grep -q 'Reading initially uses immutable insertion sequence only' docs/PRODUCT_ROADMAP.md
          ! grep -q 'reading_role' docs/PROJECT_DESIGN_FOUNDATION.md
          ! grep -q 'project_reading_placements' docs/PRODUCT_ROADMAP.md

      - name: Commit document alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT_ROADMAP.md docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md docs/PROJECT_DESIGN_FOUNDATION.md README.md .github/workflows/simplify-project-reading-order.yml
          git commit -m 'Simplify initial Project Reading order'
          git push origin HEAD:agent/global-reference-search-ui
