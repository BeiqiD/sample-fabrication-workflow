name: Temporary Phase 3C Reading implementation

on:
  push:
    branches:
      - agent/project-reading-projection

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-reading-projection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 3C implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/tmp-phase3c-reading.py")
          text = path.read_text()
          needle = "dedent(r'''" + chr(92) + "\n"
          count = text.count(needle)
          if count != 5:
              raise SystemExit(f"expected 5 generated raw-string prefixes, found {count}")
          path.write_text(text.replace(needle, "dedent(r'''\n"))
          PY
          python scripts/tmp-phase3c-reading.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one test anchor in {path}, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/project-reading-contract.test.ts",
              "reserves empty-pane double click for Markdown creation without zooming",
              "reserves empty-pane double click for Markdown creation instead of viewport zoom",
          )
          replace_once(
              "src/project-page.mobile.mount.test.tsx",
              'expect(screen.getByText("# Design note\\n\\nPreserve the occurrence identity.")).toBeTruthy();',
              'expect(document.querySelector(".project-reading-markdown-source")?.textContent).toBe("# Design note\\n\\nPreserve the occurrence identity.");',
          )
          replace_once(
              "src/project-reading.mount.test.tsx",
              'expect(screen.getByText("# Design note\\n\\nPreserve the occurrence identity.")).toBeTruthy();',
              'expect(document.querySelector(".project-reading-markdown-source")?.textContent).toBe("# Design note\\n\\nPreserve the occurrence identity.");',
          )
          replace_once(
              "src/project-reading.mount.test.tsx",
              'if (String(path) === "/api/projects/project-a/contents/content-note" && init?.method === "PATCH") {',
              'if (String(path) === "/api/projects/project-a/contents/content-note/markdown" && init?.method === "PATCH") {',
          )
          replace_once(
              "src/project-reading.mount.test.tsx",
              'expect(request[0]).toBe("/api/projects/project-a/contents/content-note");',
              'expect(request[0]).toBe("/api/projects/project-a/contents/content-note/markdown");',
          )
          replace_once(
              "src/project-reading.mount.test.tsx",
              'expect(await screen.findByText("# Updated reading note\\n\\nFull body")).toBeTruthy();',
              'await waitFor(() => expect(document.querySelector(".project-reading-markdown-source")?.textContent).toBe("# Updated reading note\\n\\nFull body"));',
          )
          replace_once(
              "src/project-reading.mount.test.tsx",
              'if (String(path) === "/api/projects/project-a/contents/content-attachment" && init?.method === "PATCH") {',
              'if (String(path) === "/api/projects/project-a/contents/content-attachment/attachment" && init?.method === "PATCH") {',
          )
          replace_once(
              "src/project-reading.mount.test.tsx",
              'const body = JSON.parse(String(fetchMock.mock.calls[1][1]?.body));',
              'expect(fetchMock.mock.calls[1][0]).toBe("/api/projects/project-a/contents/content-attachment/attachment");\n    const body = JSON.parse(String(fetchMock.mock.calls[1][1]?.body));',
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              "Phase 3B3 Project-owned Markdown and generic attachment creation is complete in\nsquash-merged PR #135. Phase 3B4 basic Project-local edges are implemented in\nPR #136 and are awaiting clean formal re-review and squash merge. Phase 3C is\nthe next implementation phase after that merge.",
              "Phase 3B3 Project-owned Markdown and generic attachment creation is complete in\nsquash-merged PR #135. Phase 3B4 basic Project-local edges are complete in\nsquash-merged PR #136. Phase 3C Reading projection is the active implementation\ntarget.",
          )
          replace_once(
              "src/project-edges-contract.test.ts",
              'expect(roadmap).toContain("After PR #136 is squash-merged, add the no-creation **Reading projection** as Phase 3C");',
              'expect(roadmap).toContain("**Status:** complete; squash-merged in PR #136.");',
          )
          replace_once(
              "src/project-edges-contract.test.ts",
              'expect(canvas).toContain("the remaining sequence starts with Phase 3C");',
              'expect(canvas).toContain("Phase 3C is the active implementation slice");',
          )
          PY

      - name: Run focused Reading tests
        run: |
          npm run test:project-reading
          npm run test:project-reading-mounted

      - name: Verify Reading slice
        run: npm run verify:project-reading

      - name: Re-run edge gate
        run: npm run verify:project-edges

      - name: Run complete tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified Phase 3C implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/tmp-phase3c-reading.py
          git add \
            .github/workflows/verify.yml \
            docs/PRODUCT_ROADMAP.md \
            docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md \
            docs/PROJECT_READING_IMPLEMENTATION_PLAN.md \
            package.json \
            src/components/project/ProjectReadingSurface.tsx \
            src/pages/ProjectPage.tsx \
            src/project.css \
            src/project-page.mobile.mount.test.tsx \
            src/project-reading.mount.test.tsx \
            src/project-reading-contract.test.ts \
            src/project-owned-content-contract.test.ts \
            src/project-reference-placement-contract.test.ts \
            src/project-edges-contract.test.ts \
            worker/deployment-routing.test.ts
          if git diff --cached --quiet; then
            echo "No Phase 3C changes to commit"
            exit 0
          fi
          git commit -m "feat(project): add Reading projection"
          git push origin HEAD:agent/project-reading-projection
