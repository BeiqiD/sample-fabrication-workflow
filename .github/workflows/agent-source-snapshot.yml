name: Apply Comment rich-text change

on:
  push:
    branches:
      - agent/comment-markdown-rendering
    paths:
      - .github/workflows/agent-source-snapshot.yml
      - .agent/comment-rich-text.patch.gz.b64

permissions:
  contents: write

concurrency:
  group: agent-comment-markdown-rendering
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent/comment-rich-text.patch.gz.b64 | gzip --decompress > /tmp/comment-rich-text.patch
          git apply --check /tmp/comment-rich-text.patch
          git apply /tmp/comment-rich-text.patch
          rm -f .agent/comment-rich-text.patch.gz.b64
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/agent-source-snapshot.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify Comment rich text
        run: npm run verify:comment-rich-text

      - name: Re-verify Project Reading
        run: npm run verify:project-reading

      - name: Commit the clean feature tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: render comments with shared Markdown and TeX"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
