name: Apply Comment rich-text change

on:
  push:
    branches:
      - agent/comment-markdown-rendering
    paths:
      - .github/workflows/agent-source-snapshot.yml
      - .agent/comment-rich-text.patch.part.*

permissions:
  contents: write

concurrency:
  group: agent-comment-markdown-rendering
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reassemble and apply the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent/comment-rich-text.patch.part.00 \
            .agent/comment-rich-text.patch.part.010 \
            .agent/comment-rich-text.patch.part.011 \
            .agent/comment-rich-text.patch.part.012 \
            .agent/comment-rich-text.patch.part.013 \
            .agent/comment-rich-text.patch.part.02 \
            .agent/comment-rich-text.patch.part.03 \
            .agent/comment-rich-text.patch.part.04 \
            .agent/comment-rich-text.patch.part.05 \
            > /tmp/comment-rich-text.patch.gz.b64
          echo "2505177e079c1f9bcd9553ef7659bec8f0d6a3597099428372d1af4f312e5225  /tmp/comment-rich-text.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/comment-rich-text.patch.gz.b64 | gzip --decompress > /tmp/comment-rich-text.patch
          echo "bb443506b260e8792bc1bb91610d0e858bebe063106b4a8c56eb0fca117ddd2c  /tmp/comment-rich-text.patch" | sha256sum --check
          git apply --check /tmp/comment-rich-text.patch
          git apply /tmp/comment-rich-text.patch
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/rich-text.ts")
          source = path.read_text()
          before = "function linkAttributes(link: SafeRichTextUrl, title: string | null) {"
          after = "function linkAttributes(link: SafeRichTextUrl, title: string | null | undefined) {"
          if before not in source:
              raise SystemExit("expected rich-text helper signature was not found")
          path.write_text(source.replace(before, after, 1))
          PY
          rm -f .agent/comment-rich-text.patch.gz.b64 .agent/comment-rich-text.patch.part.*
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/agent-source-snapshot.yml
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Verify Comment rich text
        run: npm run verify:comment-rich-text

      - name: Re-verify Project Reading
        run: npm run verify:project-reading

      - name: Commit the clean feature tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: render comments with shared Markdown and TeX"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
