name: Agent source snapshot

on:
  push:
    branches:
      - agent/comment-markdown-rendering
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-snapshot
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
