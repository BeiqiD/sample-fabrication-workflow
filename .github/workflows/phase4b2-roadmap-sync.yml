name: Sync Phase 4B2 roadmap

on:
  push:
    branches:
      - codex/phase-4b2-authoritative-copy-paste

permissions:
  contents: write

jobs:
  sync-roadmap:
    if: ${{ !contains(github.event.head_commit.message, '[phase4b2-roadmap-synced]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4b2-authoritative-copy-paste
          fetch-depth: 0

      - name: Synchronize canonical roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PRODUCT_ROADMAP.md')
          text = path.read_text()
          replacements = [
            (
              'authoritative copy/paste is under active implementation in Draft PR #149',
              'authoritative copy/paste is implemented in Draft PR #149 pending independent review',
            ),
            (
              '**Status:** active. Phase 4B1 multi-selection, grouped geometry history, and bounded Canvas keyboard shortcuts are complete in PR #148. Phase 4B2 authoritative copy/paste is under active implementation in Draft PR #149: the typed clipboard, fresh-identity planner, ordered retry journal, and transactionally authorized attachment-copy backend are implemented; complete desktop shortcut wiring, acknowledged-result projection, and partial-paste recovery UX remain before the slice is complete.',
              '**Status:** active. Phase 4B1 multi-selection, grouped geometry history, and bounded Canvas keyboard shortcuts are complete in PR #148. Phase 4B2 authoritative copy/paste is implemented in Draft PR #149 pending independent review, including desktop copy/paste shortcuts, fresh ownership identities, ordered exact-retry journaling, transactional attachment authorization, acknowledged-result projection, authoritative reconciliation, and paused-partial-paste recovery/navigation protection. Phase 4B3 alignment assistance and explicit z-order are the next bounded slice after #149 review/merge.',
            ),
            (
              '1. Complete the active **Phase 4B2** work in Draft PR #149: connect desktop copy/paste shortcuts, project acknowledged results into the current Project snapshot and selection, and finish paused-partial-paste exact-retry and reconciliation UX.\n2. Complete the remaining **Phase 4B3** alignment-assistance and explicit z-order slice after copy/paste semantics are complete.',
              '1. Complete independent review and merge of the implemented **Phase 4B2** authoritative copy/paste slice in Draft PR #149.\n2. Implement the remaining **Phase 4B3** alignment-assistance and explicit z-order slice after #149 is accepted.',
            ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing roadmap context: {old[:100]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/phase4b2-roadmap-sync.yml
          git diff --check

      - name: Publish roadmap synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(project): synchronize Phase 4B2 roadmap [phase4b2-roadmap-synced]"
          git push origin HEAD:codex/phase-4b2-authoritative-copy-paste
