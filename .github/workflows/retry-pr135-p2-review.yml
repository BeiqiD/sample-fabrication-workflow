name: Retry remaining PR135 review fixes

on:
  push:
    branches:
      - agent/project-owned-content

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-owned-content
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply corrected review patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-pr135-p2-review.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(compile(textwrap.dedent(workflow[start:end]), '<pr135-review-patch>', 'exec'), {})

          # The first focused run exposed a test-only exact-string mismatch.
          contract = Path('src/project-owned-content-contract.test.ts')
          text = contract.read_text()
          old = "expect(workerSmoke).toContain('\\\"/api/project-assets\\\"');"
          if old not in text:
              old = "expect(workerSmoke).toContain('\\\"/api/project-assets\\\"')"
          if old not in text:
              old = "expect(workerSmoke).toContain('\"/api/project-assets\"');"
          if old not in text:
              raise SystemExit('Could not find Project asset smoke assertion')
          text = text.replace(old, 'expect(workerSmoke).toContain("/api/project-assets");', 1)
          contract.write_text(text)

          # Keep the generated smoke script readable after removing the pre-seeded fixture block.
          smoke = Path('scripts/verify-project-worker.mjs')
          text = smoke.read_text().replace('let miniflare;try {', 'let miniflare;\ntry {')
          smoke.write_text(text)

          # Align the server inline policy with the client preview whitelist.
          media = Path('worker/media-response.ts')
          text = media.read_text()
          text = text.replace('  "image/tiff",\n', '').replace('  "image/x-tiff",\n', '')
          media.write_text(text)

          media_test = Path('worker/media-response.test.ts')
          text = media_test.read_text()
          text = text.replace(
              '["image/png", "IMAGE/JPEG; charset=binary", "image/webp", "image/tiff"]',
              '["image/png", "IMAGE/JPEG; charset=binary", "image/webp"]',
          )
          text = text.replace(
              '["image/svg+xml", "text/html", "application/octet-stream", ""]',
              '["image/svg+xml", "image/tiff", "image/x-tiff", "text/html", "application/octet-stream", ""]',
          )
          media_test.write_text(text)

          package = Path('package.json')
          text = package.read_text()
          old = 'src/lib/project-map-model.test.ts worker/project-routes.test.ts"'
          if old not in text:
              raise SystemExit('Could not find dedicated owned-content test list')
          text = text.replace(
              old,
              'src/lib/project-map-model.test.ts worker/project-routes.test.ts worker/media-response.test.ts"',
              1,
          )
          package.write_text(text)

          docs = Path('docs/PROJECT_OWNED_CONTENT_IMPLEMENTATION_PLAN.md')
          text = docs.read_text()
          text = text.replace(
              '- browser-stable raster previews are limited to AVIF, BMP, GIF, JPEG, PNG, and WebP and render with `object-fit: contain`;',
              '- browser-stable raster previews and inline media responses use the same AVIF, BMP, GIF, JPEG, PNG, and WebP whitelist and render with `object-fit: contain`;',
          )
          docs.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify focused slice
        run: npm run verify:project-owned-content
      - name: Commit fixes and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pr135-p2-review.yml .github/workflows/retry-pr135-p2-review.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(project): close remaining owned-content review gaps"
          git push origin HEAD:agent/project-owned-content
