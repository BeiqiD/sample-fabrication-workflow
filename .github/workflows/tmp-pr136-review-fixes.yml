name: Temporary PR136 review fixes

on:
  push:
    branches:
      - agent/project-basic-edges

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply review fixes
        run: python scripts/tmp-pr136-review-fixes.py

      - name: Verify edge slice
        run: npm run verify:project-edges

      - name: Run complete tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-pr136-review-fixes.py
          git add src/components/project/ProjectMapSurface.tsx src/pages/ProjectPage.tsx src/lib/use-project-edge-controller.ts src/project-edge-surface.mount.test.tsx src/project-edges.mount.test.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(project): address edge review blockers"
          git push origin HEAD:agent/project-basic-edges
