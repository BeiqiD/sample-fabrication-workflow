name: Apply PR 146 review fixes

on:
  push:
    branches:
      - codex/phase-4a2-project-inspector

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4a2-project-inspector

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected replacement count in {path}: {old!r}")
              write(path, source.replace(old, new, 1))

          api_path = "shared/project-api.ts"
          api = read(api_path)
          if "export function projectCodePointLength" not in api:
              marker = "\nfunction hasProjectCodePointLengthAtMost(value: string, maximum: number) {"
              if api.count(marker) != 1:
                  raise SystemExit("project API length guard marker not found")
              helper = """
          export function projectCodePointLength(value: string) {
            let length = 0;
            for (const _character of value) {
              length += 1;
            }
            return length;
          }
          """
              api = api.replace(marker, helper + marker, 1)
              write(api_path, api)

          model_path = "src/lib/project-inspector-model.ts"
          model = read(model_path)
          value_import = 'import { projectCodePointLength } from "../../shared/project-api";\n'
          if value_import not in model:
              import_marker = 'import type {\n  ProjectItemRecord,'
              if model.count(import_marker) != 1:
                  raise SystemExit("Inspector model project API import marker not found")
              model = model.replace(import_marker, value_import + import_marker, 1)
          if model.count("String(source.length)") != 1:
              raise SystemExit("Inspector UTF-16 character count not found")
          model = model.replace(
              "String(source.length)",
              "String(projectCodePointLength(source))",
              1,
          )
          write(model_path, model)

          test_path = "src/lib/project-inspector-model.test.ts"
          test = read(test_path)
          test_name = 'it("describes Project-owned Markdown without inventing source provenance", () => {'
          start = test.find(test_name)
          if start < 0:
              raise SystemExit("Markdown Inspector test not found")
          snapshot_line = "    const snapshot = projectTestSnapshot();"
          snapshot_at = test.find(snapshot_line, start)
          if snapshot_at < 0:
              raise SystemExit("Markdown Inspector snapshot fixture not found")
          insertion_at = snapshot_at + len(snapshot_line)
          emoji_line = '\n    snapshot.contents[0].markdownSource = "A😀B";'
          if emoji_line not in test[start:]:
              test = test[:insertion_at] + emoji_line + test[insertion_at:]
          content_assert = '    expect(fieldValue(projection.detailFields, "Content type")).toBe("Markdown");'
          content_at = test.find(content_assert, start)
          if content_at < 0:
              raise SystemExit("Markdown content-type assertion not found")
          character_assert = '\n    expect(fieldValue(projection.detailFields, "Characters")).toBe("3");'
          if character_assert not in test[start:]:
              insertion_at = content_at + len(content_assert)
              test = test[:insertion_at] + character_assert + test[insertion_at:]
          write(test_path, test)

          package_path = "package.json"
          package = json.loads(read(package_path))
          reading = package["scripts"]["test:project-reading"].split()
          for path in [
              "src/lib/project-inspector-model.test.ts",
              "src/project-inspector-details.test.ts",
          ]:
              if path not in reading:
                  reading.append(path)
          package["scripts"]["test:project-reading"] = " ".join(reading)

          mounted = package["scripts"]["test:project-reading-mounted"].split()
          mount_path = "src/project-inspector-page.mount.test.tsx"
          if mount_path not in mounted:
              mounted.append(mount_path)
          package["scripts"]["test:project-reading-mounted"] = " ".join(mounted)
          write(package_path, json.dumps(package, indent=2, ensure_ascii=False) + "\n")

          details_path = "src/project-inspector-details.test.ts"
          details = read(details_path).replace('import { readFileSync } from "node:fs";\n', "")
          source_test = '\n  it("is mounted by the Project page in place of the legacy inline summary", () => {'
          start = details.find(source_test)
          if start < 0:
              raise SystemExit("source-matching pseudo-integration test not found")
          end = details.find("\n  });", start)
          if end < 0:
              raise SystemExit("source-matching pseudo-integration test end not found")
          details = details[:start] + details[end + len("\n  });"):]
          write(details_path, details)

          plan_path = "docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md"
          plan = read(plan_path)
          plan = plan.replace(
              "Status: Phase 4A active; Phase 4A1 is complete and Phase 4A2 is the current bounded implementation slice",
              "Status: Phase 4A active; Phase 4A1 and Phase 4A2 are complete, and Phase 4A3 is the current bounded implementation slice",
          )
          plan = plan.replace(
              "Last reviewed: 2026-08-16 after Phase 4A1 completion in PR #145",
              "Last reviewed: 2026-08-16 after Phase 4A2 completion in PR #146",
          )
          plan = plan.replace(
              "## Phase 4A2 — hierarchy, provenance, and type-specific inspection\n\nStatus: active.\n\nDeliver:",
              "## Phase 4A2 — hierarchy, provenance, and type-specific inspection\n\nStatus: complete in PR #146.\n\nDelivered:",
          )
          plan = plan.replace("Current bounded implementation:", "Delivered implementation:")
          plan = plan.replace(
              "This implementation does not add persistence fields, source mutation, child-reference insertion, or editable source snapshots.\n\n## Phase 4A3 — authoritative child-reference insertion\n\nDeliver after the Inspector hierarchy is stable:",
              "This implementation does not add persistence fields, source mutation, child-reference insertion, or editable source snapshots.\n\nExit: the Inspector exposes authoritative Project-local context, source hierarchy, provenance, type-specific details, and exact source navigation without creating a second source model.\n\n## Phase 4A3 — authoritative child-reference insertion\n\nStatus: current bounded implementation slice.\n\nDeliver after the Inspector hierarchy is stable:",
          )
          required_plan_phrases = [
              "Phase 4A1 and Phase 4A2 are complete",
              "Status: complete in PR #146.",
              "Status: current bounded implementation slice.",
          ]
          if not all(phrase in plan for phrase in required_plan_phrases):
              raise SystemExit("implementation plan status update incomplete")
          write(plan_path, plan)

          roadmap_path = "docs/PRODUCT_ROADMAP.md"
          roadmap = read(roadmap_path)
          roadmap = roadmap.replace(
              "Project/Comment renderer in PRs #143/#144, and Phase 4A1 canonical Project\noccurrence focus in PR #145",
              "Project/Comment renderer in PRs #143/#144, Phase 4A1 canonical Project\noccurrence focus in PR #145, and Phase 4A2 Inspector completeness in PR #146",
          )
          roadmap = roadmap.replace(
              "surfaces in PR #144. Phase 4A1 canonical Project occurrence focus is complete in\nPR #145. Phase 4A2 Inspector hierarchy, provenance, and type-specific detail is\nnow the active bounded slice. Storage, lifecycle, Reference, and rich-content foundations\nreturn to correctness maintenance rather than continuing as independent feature\ntracks.",
              "surfaces in PR #144. Phase 4A1 canonical Project occurrence focus is complete in\nPR #145, and Phase 4A2 Inspector hierarchy, provenance, type-specific detail, and\nexact source navigation are complete in PR #146. Phase 4A3 authoritative child-\nreference insertion is now the active bounded slice. Storage, lifecycle, Reference,\nand rich-content foundations return to correctness maintenance rather than continuing\nas independent feature tracks.",
          )
          roadmap = roadmap.replace(
              "**Status:** active; Phase 4A1 is complete in PR #145 and Phase 4A2 hierarchy/provenance is active.",
              "**Status:** active; Phase 4A1 is complete in PR #145, Phase 4A2 is complete in PR #146, and Phase 4A3 child-reference insertion is active.",
          )
          immediate_pattern = re.compile(
              r"1\. Complete \*\*Phase 4A2\*\* Inspector hierarchy, provenance, type-specific details,\n"
              r"   and exact source navigation\.\n"
              r"2\. Complete \*\*Phase 4A3\*\* authoritative child-reference insertion through the\n"
              r"   existing Reference and Project placement path\.\n"
              r"3\. Complete \*\*Phase 4B\*\* the selected v1 Canvas productivity operations\.\n"
              r"4\. Complete \*\*Phase 4C\*\* representative-scale performance work and make explicit\n"
              r"   include/defer decisions for remaining optional interaction candidates\.\n"
              r"5\. Declare the \*\*v1 feature freeze\*\* once the interaction-shaping feature set is\n"
              r"   stable\.\n"
              r"6\. Run \*\*Phase 5 frontend refinement\*\* as a dedicated whole-product pass\.\n"
              r"7\. Run \*\*Phase 6 release hardening\*\* and real-use/operational rehearsal\."
          )
          immediate = (
              "1. Complete **Phase 4A3** authoritative child-reference insertion through the\n"
              "   existing Reference and Project placement path.\n"
              "2. Complete **Phase 4B** the selected v1 Canvas productivity operations.\n"
              "3. Complete **Phase 4C** representative-scale performance work and make explicit\n"
              "   include/defer decisions for remaining optional interaction candidates.\n"
              "4. Declare the **v1 feature freeze** once the interaction-shaping feature set is\n"
              "   stable.\n"
              "5. Run **Phase 5 frontend refinement** as a dedicated whole-product pass.\n"
              "6. Run **Phase 6 release hardening** and real-use/operational rehearsal."
          )
          roadmap, substitutions = immediate_pattern.subn(immediate, roadmap, count=1)
          if substitutions != 1:
              raise SystemExit("roadmap immediate order was not updated")
          required_roadmap_phrases = [
              "Phase 4A2 Inspector completeness in PR #146",
              "Phase 4A3 authoritative child-\nreference insertion is now the active bounded slice",
              "Phase 4A2 is complete in PR #146",
          ]
          if not all(phrase in roadmap for phrase in required_roadmap_phrases):
              raise SystemExit("roadmap status update incomplete")
          write(roadmap_path, roadmap)
          PY

          cat > src/project-inspector-page.mount.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import { cleanup, render, screen, waitFor, within } from "@testing-library/react";
          import { createMemoryRouter, RouterProvider } from "react-router-dom";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import { ProjectPage } from "./pages/ProjectPage";
          import { projectTestSnapshot } from "./project-test-fixture";

          vi.mock("./components/project/ProjectMapSurface", async () => {
            const React = await import("react");
            return {
              ProjectMapSurface: React.forwardRef(function ProjectMapSurfaceFixture(
                props: {
                  selectedItemId?: string | null;
                  focusedItemId?: string | null;
                },
                ref: React.ForwardedRef<{
                  getViewportCenter: () => { x: number; y: number };
                }>,
              ) {
                React.useImperativeHandle(ref, () => ({
                  getViewportCenter: () => ({ x: 400, y: 300 }),
                }));
                return <div
                  data-testid="project-flow-canvas"
                  data-selected-item-id={props.selectedItemId ?? ""}
                  data-focused-item-id={props.focusedItemId ?? ""}
                >Map fixture</div>;
              }),
            };
          });

          function desktopMatchMedia() {
            return vi.fn(() => ({
              matches: true,
              media: "(min-width: 860px)",
              onchange: null,
              addEventListener: vi.fn(),
              removeEventListener: vi.fn(),
              addListener: vi.fn(),
              removeListener: vi.fn(),
              dispatchEvent: vi.fn(),
            }));
          }

          function jsonResponse(payload: unknown, status = 200) {
            return Promise.resolve(new Response(JSON.stringify(payload), {
              status,
              headers: { "content-type": "application/json" },
            }));
          }

          function renderProjectPage(initialEntry: string) {
            const router = createMemoryRouter([{
              path: "/projects/:projectId",
              element: <ProjectPage />,
            }], { initialEntries: [initialEntry] });
            return render(<RouterProvider router={router} />);
          }

          describe("mounted Project Inspector integration", () => {
            const fetchMock = vi.fn<typeof fetch>();

            beforeEach(() => {
              vi.stubGlobal("matchMedia", desktopMatchMedia());
              vi.stubGlobal("fetch", fetchMock);
            });

            afterEach(() => {
              cleanup();
              fetchMock.mockReset();
              vi.unstubAllGlobals();
            });

            it("mounts the authoritative Inspector through ProjectPage occurrence focus", async () => {
              const snapshot = projectTestSnapshot();
              fetchMock.mockResolvedValueOnce(await jsonResponse(snapshot));
              renderProjectPage("/projects/project-a?focus=item-reference");

              const map = await screen.findByTestId("project-flow-canvas");
              await waitFor(() => {
                expect(map.getAttribute("data-selected-item-id")).toBe("item-reference");
                expect(map.getAttribute("data-focused-item-id")).toBe("item-reference");
              });

              const inspector = screen.getByRole("complementary", { name: "Project Inspector" });
              expect(within(inspector).getByRole("heading", { level: 2, name: "Sample A" })).toBeTruthy();
              expect(within(inspector).getByRole("heading", { name: "Source & provenance" })).toBeTruthy();
              expect(within(inspector).getByText("sample:sample-a")).toBeTruthy();
              expect(within(inspector).getByRole("link", { name: "Open exact source" }).getAttribute("href"))
                .toBe("/samples/sample-a");
              expect(within(inspector).queryByText("The authoritative Project occurrence is unavailable."))
                .toBeNull();
            });
          });
          EOF

          git diff --check

      - name: Install dependencies
        run: npm clean-install

      - name: Run focused Project Inspector and Reading verification
        run: |
          npm run test:project-reading
          npm run test:project-reading-mounted
          npm run build

      - name: Commit review fixes
        shell: bash
        run: |
          rm .github/workflows/apply-pr146-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address Phase 4A2 review findings"
          git push origin HEAD:codex/phase-4a2-project-inspector
