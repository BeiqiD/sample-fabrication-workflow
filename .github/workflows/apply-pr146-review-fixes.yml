name: Apply PR 146 review fixes

on:
  push:
    branches:
      - codex/phase-4a2-project-inspector

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4a2-project-inspector

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one replacement in {path_name}, found {count}: {old[:80]!r}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "shared/project-api.ts",
              """function hasProjectCodePointLengthAtMost(value: string, maximum: number) {
            let length = 0;
            for (const _character of value) {
              length += 1;
              if (length > maximum) return false;
            }
            return true;
          }""",
              """export function projectCodePointLength(value: string) {
            let length = 0;
            for (const _character of value) {
              length += 1;
            }
            return length;
          }

          function hasProjectCodePointLengthAtMost(value: string, maximum: number) {
            let length = 0;
            for (const _character of value) {
              length += 1;
              if (length > maximum) return false;
            }
            return true;
          }""",
          )

          replace_once(
              "src/lib/project-inspector-model.ts",
              """import type {
            ProjectItemRecord,
            ProjectReferenceRecord,
            ProjectSnapshot,
          } from \"../../shared/project-api\";""",
              """import {
            projectCodePointLength,
            type ProjectItemRecord,
            type ProjectReferenceRecord,
            type ProjectSnapshot,
          } from \"../../shared/project-api\";""",
          )
          replace_once(
              "src/lib/project-inspector-model.ts",
              '{ label: "Characters", value: String(source.length) },',
              '{ label: "Characters", value: String(projectCodePointLength(source)) },',
          )

          replace_once(
              "src/lib/project-inspector-model.test.ts",
              """  it(\"describes Project-owned Markdown without inventing source provenance\", () => {
            const snapshot = projectTestSnapshot();
            const descriptor = projectMapNodes(snapshot)""",
              """  it(\"describes Project-owned Markdown without inventing source provenance\", () => {
            const snapshot = projectTestSnapshot();
            snapshot.contents[0].markdownSource = \"A😀B\";
            const descriptor = projectMapNodes(snapshot)""",
          )
          replace_once(
              "src/lib/project-inspector-model.test.ts",
              """    expect(fieldValue(projection.detailFields, \"Content type\")).toBe(\"Markdown\");
            expect(projection.contexts).toEqual([]);""",
              """    expect(fieldValue(projection.detailFields, \"Content type\")).toBe(\"Markdown\");
            expect(fieldValue(projection.detailFields, \"Characters\")).toBe(\"3\");
            expect(projection.contexts).toEqual([]);""",
          )

          replace_once(
              "package.json",
              '    "test:project-reading": "vitest run src/lib/project-item-navigation.test.ts src/project-reading-contract.test.ts src/lib/project-map-model.test.ts src/project-owned-content-contract.test.ts src/project-reference-placement-contract.test.ts src/lib/project-markdown.test.ts src/lib/project-readable-export.test.ts",',
              '    "test:project-reading": "vitest run src/lib/project-item-navigation.test.ts src/lib/project-inspector-model.test.ts src/project-inspector-details.test.ts src/project-reading-contract.test.ts src/lib/project-map-model.test.ts src/project-owned-content-contract.test.ts src/project-reference-placement-contract.test.ts src/lib/project-markdown.test.ts src/lib/project-readable-export.test.ts",',
          )
          replace_once(
              "package.json",
              '    "test:project-reading-mounted": "vitest run --config vitest.mounted.config.ts src/project-reading.mount.test.tsx src/project-stable-link-copy.mount.test.tsx src/project-rich-content.mount.test.tsx src/project-responsive-projection-safety.mount.test.tsx src/project-page.mobile.mount.test.tsx src/project-map-surface.mount.test.tsx",',
              '    "test:project-reading-mounted": "vitest run --config vitest.mounted.config.ts src/project-inspector-page.mount.test.tsx src/project-reading.mount.test.tsx src/project-stable-link-copy.mount.test.tsx src/project-rich-content.mount.test.tsx src/project-responsive-projection-safety.mount.test.tsx src/project-page.mobile.mount.test.tsx src/project-map-surface.mount.test.tsx",',
          )

          replace_once(
              "src/project-inspector-details.test.ts",
              'import { readFileSync } from "node:fs";\n',
              "",
          )
          details_path = Path("src/project-inspector-details.test.ts")
          details = details_path.read_text(encoding="utf-8")
          start_marker = '\n  it("is mounted by the Project page in place of the legacy inline summary", () => {'
          start = details.find(start_marker)
          if start < 0:
              raise SystemExit("Project Inspector source-matching test was not found")
          end = details.find("\n  });", start)
          if end < 0:
              raise SystemExit("Project Inspector source-matching test end was not found")
          end += len("\n  });")
          details_path.write_text(details[:start] + details[end:], encoding="utf-8")

          replace_once(
              "docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md",
              "Status: Phase 4A active; Phase 4A1 is complete and Phase 4A2 is the current bounded implementation slice",
              "Status: Phase 4A active; Phase 4A1 and Phase 4A2 are complete, and Phase 4A3 is the current bounded implementation slice",
          )
          replace_once(
              "docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md",
              "Last reviewed: 2026-08-16 after Phase 4A1 completion in PR #145",
              "Last reviewed: 2026-08-16 after Phase 4A2 completion in PR #146",
          )
          replace_once(
              "docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md",
              """## Phase 4A2 — hierarchy, provenance, and type-specific inspection

          Status: active.

          Deliver:""",
              """## Phase 4A2 — hierarchy, provenance, and type-specific inspection

          Status: complete in PR #146.

          Delivered:""",
          )
          replace_once(
              "docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md",
              "Current bounded implementation:",
              "Delivered implementation:",
          )
          replace_once(
              "docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md",
              """This implementation does not add persistence fields, source mutation, child-reference insertion, or editable source snapshots.

          ## Phase 4A3 — authoritative child-reference insertion

          Deliver after the Inspector hierarchy is stable:""",
              """This implementation does not add persistence fields, source mutation, child-reference insertion, or editable source snapshots.

          Exit: the Inspector exposes authoritative Project-local context, source hierarchy, provenance, type-specific details, and exact source navigation without creating a second source model.

          ## Phase 4A3 — authoritative child-reference insertion

          Status: current bounded implementation slice.

          Deliver after the Inspector hierarchy is stable:""",
          )

          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """Project/Comment renderer in PRs #143/#144, and Phase 4A1 canonical Project
          occurrence focus in PR #145""",
              """Project/Comment renderer in PRs #143/#144, Phase 4A1 canonical Project
          occurrence focus in PR #145, and Phase 4A2 Inspector completeness in PR #146""",
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """surfaces in PR #144. Phase 4A1 canonical Project occurrence focus is complete in
          PR #145. Phase 4A2 Inspector hierarchy, provenance, and type-specific detail is
          now the active bounded slice. Storage, lifecycle, Reference, and rich-content foundations
          return to correctness maintenance rather than continuing as independent feature
          tracks.""",
              """surfaces in PR #144. Phase 4A1 canonical Project occurrence focus is complete in
          PR #145, and Phase 4A2 Inspector hierarchy, provenance, type-specific detail, and
          exact source navigation are complete in PR #146. Phase 4A3 authoritative child-
          reference insertion is now the active bounded slice. Storage, lifecycle, Reference,
          and rich-content foundations return to correctness maintenance rather than continuing
          as independent feature tracks.""",
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              "**Status:** active; Phase 4A1 is complete in PR #145 and Phase 4A2 hierarchy/provenance is active.",
              "**Status:** active; Phase 4A1 is complete in PR #145, Phase 4A2 is complete in PR #146, and Phase 4A3 child-reference insertion is active.",
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """1. Complete **Phase 4A2** Inspector hierarchy, provenance, type-specific details,
             and exact source navigation.
          2. Complete **Phase 4A3** authoritative child-reference insertion through the
             existing Reference and Project placement path.
          3. Complete **Phase 4B** the selected v1 Canvas productivity operations.
          4. Complete **Phase 4C** representative-scale performance work and make explicit
             include/defer decisions for remaining optional interaction candidates.
          5. Declare the **v1 feature freeze** once the interaction-shaping feature set is
             stable.
          6. Run **Phase 5 frontend refinement** as a dedicated whole-product pass.
          7. Run **Phase 6 release hardening** and real-use/operational rehearsal.""",
              """1. Complete **Phase 4A3** authoritative child-reference insertion through the
             existing Reference and Project placement path.
          2. Complete **Phase 4B** the selected v1 Canvas productivity operations.
          3. Complete **Phase 4C** representative-scale performance work and make explicit
             include/defer decisions for remaining optional interaction candidates.
          4. Declare the **v1 feature freeze** once the interaction-shaping feature set is
             stable.
          5. Run **Phase 5 frontend refinement** as a dedicated whole-product pass.
          6. Run **Phase 6 release hardening** and real-use/operational rehearsal.""",
          )
          PY

          cat > src/project-inspector-page.mount.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import { cleanup, render, screen, waitFor, within } from "@testing-library/react";
          import { createMemoryRouter, RouterProvider } from "react-router-dom";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import { ProjectPage } from "./pages/ProjectPage";
          import { projectTestSnapshot } from "./project-test-fixture";

          vi.mock("./components/project/ProjectMapSurface", async () => {
            const React = await import("react");
            return {
              ProjectMapSurface: React.forwardRef(function ProjectMapSurfaceFixture(
                props: {
                  selectedItemId?: string | null;
                  focusedItemId?: string | null;
                },
                ref: React.ForwardedRef<{
                  getViewportCenter: () => { x: number; y: number };
                }>,
              ) {
                React.useImperativeHandle(ref, () => ({
                  getViewportCenter: () => ({ x: 400, y: 300 }),
                }));
                return <div
                  data-testid="project-flow-canvas"
                  data-selected-item-id={props.selectedItemId ?? ""}
                  data-focused-item-id={props.focusedItemId ?? ""}
                >Map fixture</div>;
              }),
            };
          });

          function desktopMatchMedia() {
            return vi.fn(() => ({
              matches: true,
              media: "(min-width: 860px)",
              onchange: null,
              addEventListener: vi.fn(),
              removeEventListener: vi.fn(),
              addListener: vi.fn(),
              removeListener: vi.fn(),
              dispatchEvent: vi.fn(),
            }));
          }

          function jsonResponse(payload: unknown, status = 200) {
            return Promise.resolve(new Response(JSON.stringify(payload), {
              status,
              headers: { "content-type": "application/json" },
            }));
          }

          function renderProjectPage(initialEntry: string) {
            const router = createMemoryRouter([{
              path: "/projects/:projectId",
              element: <ProjectPage />,
            }], { initialEntries: [initialEntry] });
            return render(<RouterProvider router={router} />);
          }

          describe("mounted Project Inspector integration", () => {
            const fetchMock = vi.fn<typeof fetch>();

            beforeEach(() => {
              vi.stubGlobal("matchMedia", desktopMatchMedia());
              vi.stubGlobal("fetch", fetchMock);
            });

            afterEach(() => {
              cleanup();
              fetchMock.mockReset();
              vi.unstubAllGlobals();
            });

            it("mounts the authoritative Inspector through ProjectPage occurrence focus", async () => {
              const snapshot = projectTestSnapshot();
              fetchMock.mockResolvedValueOnce(await jsonResponse(snapshot));
              renderProjectPage("/projects/project-a?focus=item-reference");

              const map = await screen.findByTestId("project-flow-canvas");
              await waitFor(() => {
                expect(map.getAttribute("data-selected-item-id")).toBe("item-reference");
                expect(map.getAttribute("data-focused-item-id")).toBe("item-reference");
              });

              const inspector = screen.getByRole("complementary", { name: "Project Inspector" });
              expect(within(inspector).getByRole("heading", { level: 2, name: "Sample A" })).toBeTruthy();
              expect(within(inspector).getByRole("heading", { name: "Source & provenance" })).toBeTruthy();
              expect(within(inspector).getByText("sample:sample-a")).toBeTruthy();
              expect(within(inspector).getByRole("link", { name: "Open exact source" }).getAttribute("href"))
                .toBe("/samples/sample-a");
              expect(within(inspector).queryByText("The authoritative Project occurrence is unavailable."))
                .toBeNull();
            });
          });
          EOF

          git diff --check

      - name: Install dependencies
        run: npm clean-install

      - name: Run focused Project Inspector and Reading verification
        run: |
          npm run test:project-reading
          npm run test:project-reading-mounted
          npm run build

      - name: Commit review fixes
        shell: bash
        run: |
          rm .github/workflows/apply-pr146-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/project-api.ts src/lib/project-inspector-model.ts src/lib/project-inspector-model.test.ts src/project-inspector-details.test.ts src/project-inspector-page.mount.test.tsx package.json docs/PROJECT_INSPECTOR_NAVIGATION_IMPLEMENTATION_PLAN.md docs/PRODUCT_ROADMAP.md .github/workflows/apply-pr146-review-fixes.yml
          git commit -m "Address Phase 4A2 review findings"
          git push origin HEAD:codex/phase-4a2-project-inspector
