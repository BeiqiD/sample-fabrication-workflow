name: Apply PR 141 architecture fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "48ff8faac4f64c5944eb475254489d35fd7d1487"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr141-architecture-fixes.yml"

      - name: Apply architecture patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/pr141_architecture_fixes.py.gz.b64 \
            | gzip -d > /tmp/pr141_architecture_fixes.py
          python3 /tmp/pr141_architecture_fixes.py
          rm scripts/pr141_architecture_fixes.py.gz.b64
          rm .github/workflows/pr141-architecture-fixes.yml
          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused architecture regressions
        run: npx vitest run worker/fabublox-import-recovery.test.ts worker/blob-registration-reconciliation.test.ts worker/blob-lifecycle-migration-safety.test.ts worker/blob-lifecycle-review-fixes.test.ts

      - name: Verify blob lifecycle and migrations
        run: npm run verify:blob-lifecycle

      - name: Run complete test suite
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Commit and push architecture fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): preserve occurrence identity across recovery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
