name: Apply v1 roadmap refinement v2

on:
  push:
    branches:
      - agent/roadmap-v1-feature-freeze-ui-refinement

permissions:
  contents: write

jobs:
  update-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact documentation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2878aef74eb4d4d0579ebaebbbdb23803863d370"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/roadmap-v1-refinement-v2.yml"

      - name: Apply roadmap update and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/roadmap-v1-refinement-runner.py
          rm -f \
            .github/roadmap-v1-refinement-runner.py \
            .github/workflows/roadmap-v1-refinement.yml \
            .github/workflows/roadmap-v1-refinement-v2.yml
          git diff --check
          git add -A
          test "$(git diff --cached --name-only | grep -v '^docs/PRODUCT_ROADMAP.md$' | wc -l)" -eq 3
          test "$(git diff --cached --name-only | grep -c '^docs/PRODUCT_ROADMAP.md$')" -eq 1

      - name: Commit documentation-only roadmap update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: define v1 feature freeze and refinement phases"
          git push origin "HEAD:${GITHUB_REF_NAME}"
