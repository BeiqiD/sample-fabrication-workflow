name: Temporary PR 145 stable-link race fix

on:
  push:
    branches:
      - phase-4a1-project-item-focus-links

permissions:
  contents: write

concurrency:
  group: pr-145-stable-link-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4a1-project-item-focus-links
          fetch-depth: 0

      - name: Apply exact source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          source_path = Path("src/pages/ProjectPage.tsx")
          source = source_path.read_text(encoding="utf-8")

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return value.replace(old, new, 1)

          source = replace_once(source, '  const [stableLinkCopyState, setStableLinkCopyState] = useState<"idle" | "copied" | "error">("idle");', '  const [stableLinkCopyState, setStableLinkCopyState] = useState<{\n    projectId: string;\n    itemId: string;\n    status: "copied" | "error";\n  } | null>(null);', "stable-link state")
          source = replace_once(source, '  const appliedFocusRef = useRef<string | null>(null);', '  const appliedFocusRef = useRef<string | null>(null);\n  const stableLinkCopyGenerationRef = useRef(0);', "stable-link generation ref")
          source = replace_once(source, '      ownedContentGenerationRef.current += 1;\n      navigationSaveRequestedRef.current = false;', '      ownedContentGenerationRef.current += 1;\n      stableLinkCopyGenerationRef.current += 1;\n      navigationSaveRequestedRef.current = false;', "unmount invalidation")
          source = replace_once(source, '  useEffect(() => {\n    setStableLinkCopyState("idle");\n  }, [selectedItemId]);\n\n  const copySelectedItemLink = useCallback(async () => {\n    if (!selected) return;\n    setStableLinkCopyState("idle");\n    try {\n      if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");\n      await navigator.clipboard.writeText(projectItemFocusAbsoluteUrl(\n        window.location.origin,\n        location.pathname,\n        selected.itemId,\n      ));\n      setStableLinkCopyState("copied");\n    } catch {\n      setStableLinkCopyState("error");\n    }\n  }, [location.pathname, selected]);', '  useEffect(() => {\n    stableLinkCopyGenerationRef.current += 1;\n    setStableLinkCopyState(null);\n  }, [projectId, selectedItemId]);\n\n  const copySelectedItemLink = useCallback(async () => {\n    if (!selected) return;\n    const requestProjectId = projectId;\n    const itemId = selected.itemId;\n    const generation = stableLinkCopyGenerationRef.current + 1;\n    stableLinkCopyGenerationRef.current = generation;\n    setStableLinkCopyState(null);\n    const requestIsCurrent = () => (\n      pageActiveRef.current\n      && stableLinkCopyGenerationRef.current === generation\n      && projectIdRef.current === requestProjectId\n    );\n    try {\n      if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");\n      await navigator.clipboard.writeText(projectItemFocusAbsoluteUrl(\n        window.location.origin,\n        location.pathname,\n        itemId,\n      ));\n      if (!requestIsCurrent()) return;\n      setStableLinkCopyState({ projectId: requestProjectId, itemId, status: "copied" });\n    } catch {\n      if (!requestIsCurrent()) return;\n      setStableLinkCopyState({ projectId: requestProjectId, itemId, status: "error" });\n    }\n  }, [location.pathname, projectId, selected]);\n\n  const selectedStableLinkCopyStatus = stableLinkCopyState?.projectId === projectId\n    && stableLinkCopyState.itemId === selectedItemId\n    ? stableLinkCopyState.status\n    : "idle";', "copy request identity")
          source = replace_once(source, '{stableLinkCopyState === "copied" ? "Stable link copied" : "Copy stable link"}', '{selectedStableLinkCopyStatus === "copied" ? "Stable link copied" : "Copy stable link"}', "copied presentation")
          source = replace_once(source, '{stableLinkCopyState === "error" && <small className="error">Clipboard access was unavailable; the link was not copied.</small>}', '{selectedStableLinkCopyStatus === "error" && <small className="error">Clipboard access was unavailable; the link was not copied.</small>}', "error presentation")
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("src/project-stable-link-copy.mount.test.tsx")
          test_path.write_bytes(base64.b64decode(''))

          Path(".github/workflows/zz-fix-pr145-stable-link.yml").unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused mounted regression
        run: npx vitest run --config vitest.mounted.config.ts src/project-stable-link-copy.mount.test.tsx

      - name: Commit patched branch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix stable-link copy request identity"
          git push origin HEAD:phase-4a1-project-item-focus-links
