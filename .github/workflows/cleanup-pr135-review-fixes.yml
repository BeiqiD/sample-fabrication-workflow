name: Clean PR135 review-fix diff

on:
  push:
    branches:
      - agent/project-owned-content

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-owned-content
      - name: Clean reverted files and navigation copy
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['shared/project-api.ts', 'worker/project-routes.ts']:
              path = Path(name)
              text = path.read_text()
              path.write_text(text.rstrip('\n') + '\n')

          page_path = Path('src/pages/ProjectPage.tsx')
          page = page_path.read_text()
          old_markdown = '''            : markdownEditor.status === "uncertain"
              ? "The Project Markdown save outcome is uncertain. Retry the exact save before leaving."
              : "The open Project Markdown editor must be saved or discarded before leaving."'''
          new_markdown = '''            : markdownEditor.status === "uncertain"
              ? "The Project Markdown save outcome is uncertain. Retry the exact save before leaving."
              : markdownEditor.status === "error" || markdownEditor.status === "conflict"
                ? "The Project Markdown save was rejected deterministically. Discard the failed edit before leaving, then start a new edit after resolving the cause."
                : "The open Project Markdown editor must be saved or discarded before leaving."'''
          old_attachment = '''              : attachmentEditor.status === "uncertain"
                ? "The attachment metadata save outcome is uncertain. Retry the exact save before leaving."
                : "The attachment metadata editor must be saved or discarded before leaving."'''
          new_attachment = '''              : attachmentEditor.status === "uncertain"
                ? "The attachment metadata save outcome is uncertain. Retry the exact save before leaving."
                : attachmentEditor.status === "error" || attachmentEditor.status === "conflict"
                  ? "The attachment metadata save was rejected deterministically. Discard the failed edit before leaving, then start a new edit after resolving the cause."
                  : "The attachment metadata editor must be saved or discarded before leaving."'''
          for old, new in [(old_markdown, new_markdown), (old_attachment, new_attachment)]:
              if page.count(old) != 1:
                  raise SystemExit(f'Expected one navigation-copy match, found {page.count(old)}')
              page = page.replace(old, new)
          page_path.write_text(page)
          PY
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-pr135-review-fixes.yml
          git add shared/project-api.ts worker/project-routes.ts src/pages/ProjectPage.tsx
          git diff --cached --check
          git commit -m "fix(project): clean review-fix state handling"
          git push origin HEAD:agent/project-owned-content
