name: Clean PR135 review-fix diff

on:
  push:
    branches:
      - agent/project-owned-content

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-owned-content
          fetch-depth: 0
      - name: Clean reverted files and navigation copy
        run: |
          git fetch origin v2/backend-foundation
          git checkout origin/v2/backend-foundation -- shared/project-api.ts worker/project-routes.ts
          python - <<'PY'
          from pathlib import Path

          page_path = Path('src/pages/ProjectPage.tsx')
          page = page_path.read_text()
          replacements = [
              (
                  'The open Project Markdown editor must be saved or discarded before leaving.',
                  'The open Project Markdown editor must be saved or discarded before leaving; deterministic save failures must be discarded and restarted.',
              ),
              (
                  'The attachment metadata editor must be saved or discarded before leaving.',
                  'The attachment metadata editor must be saved or discarded before leaving; deterministic save failures must be discarded and restarted.',
              ),
          ]
          for old, new in replacements:
              count = page.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one copy match, found {count}: {old}')
              page = page.replace(old, new)
          page_path.write_text(page)
          PY
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-pr135-review-fixes.yml
          git add shared/project-api.ts worker/project-routes.ts src/pages/ProjectPage.tsx
          git diff --cached --check
          git commit -m "fix(project): clean review-fix state handling"
          git push origin HEAD:agent/project-owned-content
