name: Apply PR 141 round-three review fixes v2

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply implementation and corrected legacy assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/pr141-round3-review-fixes.yml').read_text()
          marker = "cat > /tmp/apply-pr141-round3.py.gz.b64 <<'PAYLOAD'\n"
          payload = workflow.split(marker, 1)[1].split("\n          PAYLOAD", 1)[0]
          payload = "\n".join(line[10:] if line.startswith("          ") else line for line in payload.splitlines())
          Path('/tmp/apply-pr141-round3.py.gz.b64').write_text(payload.strip())
          PY
          base64 -d /tmp/apply-pr141-round3.py.gz.b64 | gzip -d > /tmp/apply-pr141-round3.py
          python /tmp/apply-pr141-round3.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one legacy assertion block')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'worker/blob-integrity.test.ts',
              """    database.prepare(`
                UPDATE imports SET status = 'ready', completed_at = ?
                WHERE id = 'import-pending-reuse'
              `).run(NOW);
          """,
              """    database.prepare(`
                UPDATE imports
                SET operation_id = 'operation-pending-reuse',
                    lease_expires_at = '2026-08-15T18:00:00.000Z'
                WHERE id = 'import-pending-reuse'
              `).run();
              database.prepare(`
                UPDATE imports
                SET status = 'ready', finalization_id = 'finalize-pending-reuse', completed_at = ?
                WHERE id = 'import-pending-reuse'
              `).run(NOW);
          """,
          )
          replace_once(
              'worker/blob-integrity-routes.test.ts',
              """    expect(deletedKeys).toContain(pendingAsset.r2_key);
              expect(stored.has(pendingAsset.r2_key)).toBe(false);

              const liveAfterFailure = await worker.fetch(new Request(
          """,
              """    expect(deletedKeys).not.toContain(pendingAsset.r2_key);
              expect(stored.has(pendingAsset.r2_key)).toBe(true);
              expect(database.prepare(`
                SELECT state FROM blob_gc_ledger
                WHERE store_kind = 'r2' AND provider = 'r2' AND object_key = ?
              `).get(pendingAsset.r2_key)).toEqual({ state: 'orphaned' });

              const liveAfterFailure = await worker.fetch(new Request(
          """,
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify focused and complete contracts
        run: |
          npm run verify:blob-lifecycle
          npm run verify:project-persistence
          npm run verify:project-reading
          npm test
          npm run build
          git diff --check
      - name: Commit reviewed implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker migrations docs package.json tsconfig.export-contract.json
          git rm .github/workflows/pr141-round3-review-fixes.yml
          git rm .github/workflows/pr141-round3-review-fixes-v2.yml
          git commit -m "fix: recover FabuBlox finalization and stale leases"
          git push origin HEAD:agent/storage-integrity-markdown-removal
