name: Apply exact-match specificity fix v3

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/deterministic-reference-search' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/deterministic-reference-search
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic ranking patch
        run: python .github/scripts/apply-reference-search-specificity.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused reference contract
        run: npm run test:reference-foundation

      - name: Verify real Worker and D1 search boundary
        run: npm run verify:reference-search-worker

      - name: Verify production build
        run: npm run build

      - name: Commit verified ranking fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve byte-exact search ranking specificity'
          git push origin HEAD:agent/deterministic-reference-search
