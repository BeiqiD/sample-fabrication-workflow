name: Apply reference export fix

on:
  push:
    branches:
      - agent/reference-registry-resolver

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-registry-resolver

      - name: Put reference targets in the core export batch
        shell: python
        run: |
          from pathlib import Path

          path = Path("worker/index.ts")
          text = path.read_text(encoding="utf-8")
          needle = '''    managed_storage_objects: "SELECT * FROM managed_storage_objects ORDER BY created_at, id",\n    blob_gc_ledger: "SELECT * FROM blob_gc_ledger ORDER BY store_kind, provider, object_key",\n'''
          replacement = '''    managed_storage_objects: "SELECT * FROM managed_storage_objects ORDER BY created_at, id",\n    reference_targets: "SELECT * FROM reference_targets ORDER BY target_type, target_id",\n    blob_gc_ledger: "SELECT * FROM blob_gc_ledger ORDER BY store_kind, provider, object_key",\n'''
          if text.count(needle) != 1:
              raise SystemExit("Expected exactly one core export table-query insertion point")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")

      - name: Commit the focused patch and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-reference-export-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts .github/workflows/apply-reference-export-fix.yml
          git commit -m "Keep reference targets in the core export snapshot"
          git push origin HEAD:agent/reference-registry-resolver
