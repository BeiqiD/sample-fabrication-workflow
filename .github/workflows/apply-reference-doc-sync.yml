name: Apply reference documentation sync

on:
  push:
    branches:
      - agent/reference-registry-resolver

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-registry-resolver

      - name: Update the blob documents' next boundary
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "docs/BLOB_LIFECYCLE_IMPLEMENTATION_PLAN.md": (
                  '''## Completion and next phase\n\nThis slice is complete when the PR head and generated merge result pass the\nlifecycle, full-test, and build checks and the exact merged integration head\npasses the same gate.\n\nThe next product phase is intentionally separate:\n\n1. `reference_targets`, backlinks, and a batch read-only resolver;\n2. object-level deep links and deterministic reference search;\n3. Project-owned data, Text, and Inspector;\n4. Map after the data/read model is stable.\n''',
                  '''## Completion and next phase\n\nThe blob-lifecycle slice completed in PR #123, and PR #124 corrected its\nD1/workerd migration compatibility. Feature-branch success still does not\nauthorize a remote operation: the exact merged integration head must pass the\nfull deployment gate.\n\nPR #125 implements the sparse reference registry and base batch resolver.\nActual Project backlinks remain intentionally deferred until\n`project_items.reference_target_id` exists. The remaining product sequence is:\n\n1. object-level deep links and archived read-only destinations;\n2. deterministic reference search and insertion;\n3. Project-owned data, `project_items` backlinks, Text, and Inspector;\n4. Map after the data/read model is stable.\n''',
              ),
              "docs/BLOB_LIFECYCLE_OPERATIONS.md": (
                  '''## Next implementation boundary\n\nAfter this slice is merged and the exact integration head passes its gate, the\nplanned product sequence remains:\n\n1. `reference_targets`, backlinks, and a batch read-only resolver;\n2. object-level deep links and deterministic reference search;\n3. Project-owned data, Text, and Inspector;\n4. Map after the data/read model is stable.\n\nEvery future Project attachment occurrence must add an ordinary branch to\n`blob_retention_edges`, guarded edge-creation tests, export occurrence mapping,\nand permanent-delete blockers before deployment.\n''',
                  '''## Next implementation boundary\n\nPR #125 implements the sparse reference registry and base batch resolver on top\nof this operational foundation. Actual Project backlinks remain deferred until\n`project_items.reference_target_id` exists. After the exact merged integration\nhead passes its gate, the remaining product sequence is:\n\n1. object-level deep links and archived read-only destinations;\n2. deterministic reference search and insertion;\n3. Project-owned data, `project_items` backlinks, Text, and Inspector;\n4. Map after the data/read model is stable.\n\nEvery future Project attachment occurrence must add an ordinary branch to\n`blob_retention_edges`, guarded edge-creation tests, export occurrence mapping,\nand permanent-delete blockers before deployment.\n''',
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one roadmap block in {filename}")
              path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit the focused documentation patch and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/apply-reference-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BLOB_LIFECYCLE_IMPLEMENTATION_PLAN.md docs/BLOB_LIFECYCLE_OPERATIONS.md .github/workflows/apply-reference-doc-sync.yml
          git commit -m "Align blob lifecycle docs with the reference phase"
          git push origin HEAD:agent/reference-registry-resolver
