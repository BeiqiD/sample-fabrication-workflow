name: Complete PR 141 Project import-readiness SQL guard

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Close the SQL UPDATE boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one patch target')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'migrations/0024_blob_integrity_quarantine.sql',
              """CREATE TRIGGER project_content_attachments_guard_asset_integrity_update
          BEFORE UPDATE OF asset_id ON project_content_attachments
          WHEN NEW.asset_id IS NOT NULL
            AND (OLD.asset_id IS NULL OR OLD.asset_id <> NEW.asset_id)
          BEGIN
            SELECT RAISE(ABORT, 'blob locator is quarantined') WHERE EXISTS (
              SELECT 1 FROM assets a JOIN blob_integrity_quarantine biq
                ON biq.store_kind = 'r2' AND biq.provider = 'r2' AND biq.object_key = a.r2_key
              WHERE a.id = NEW.asset_id
            );
          END;
          """,
              """CREATE TRIGGER project_content_attachments_guard_asset_integrity_update
          BEFORE UPDATE OF asset_id ON project_content_attachments
          WHEN NEW.asset_id IS NOT NULL
            AND (OLD.asset_id IS NULL OR OLD.asset_id <> NEW.asset_id)
          BEGIN
            SELECT RAISE(ABORT, 'blob locator is quarantined') WHERE EXISTS (
              SELECT 1 FROM assets a JOIN blob_integrity_quarantine biq
                ON biq.store_kind = 'r2' AND biq.provider = 'r2' AND biq.object_key = a.r2_key
              WHERE a.id = NEW.asset_id
            );
            SELECT RAISE(ABORT, 'blob locator is unavailable') WHERE EXISTS (
              SELECT 1
              FROM assets a
              LEFT JOIN imports i ON i.id = a.import_id
              WHERE a.id = NEW.asset_id
                AND (
                  a.status <> 'ready'
                  OR (a.import_id IS NOT NULL AND (i.id IS NULL OR i.status <> 'ready'))
                )
            );
          END;
          """,
          )

          replace_once(
              'worker/project-attachment-locator-routes.test.ts',
              """    expect(() => database.prepare(`
                INSERT INTO project_content_attachments (
                  project_content_id, asset_id, original_name, mime_type, byte_size,
                  created_by, created_at, creation_operation_id
                ) VALUES (
                  'content-import-sql', 'project-import-asset', 'image.png', 'image/png', 4,
                  '${ACTOR}', '2026-08-14T00:00:00.000Z', 'sql-import-guard'
                )
              `).run()).toThrow('blob locator is unavailable');
              database.close();
          """,
              """    expect(() => database.prepare(`
                INSERT INTO project_content_attachments (
                  project_content_id, asset_id, original_name, mime_type, byte_size,
                  created_by, created_at, creation_operation_id
                ) VALUES (
                  'content-import-sql', 'project-import-asset', 'image.png', 'image/png', 4,
                  '${ACTOR}', '2026-08-14T00:00:00.000Z', 'sql-import-guard'
                )
              `).run()).toThrow('blob locator is unavailable');

              database.exec(`
                INSERT INTO assets (
                  id, r2_key, original_name, mime_type, byte_size,
                  status, created_at, sha256
                ) VALUES (
                  'project-standalone-asset', 'projects/standalone.png', 'standalone.png',
                  'image/png', 4, 'ready', '2026-08-14T00:00:00.000Z',
                  '${'a'.repeat(64)}'
                );
                INSERT INTO project_content_attachments (
                  project_content_id, asset_id, original_name, mime_type, byte_size,
                  created_by, created_at, creation_operation_id
                ) VALUES (
                  'content-import-sql', 'project-standalone-asset', 'standalone.png',
                  'image/png', 4, '${ACTOR}', '2026-08-14T00:00:00.000Z',
                  'sql-standalone-attachment'
                );
              `);
              expect(() => database.prepare(`
                UPDATE project_content_attachments
                SET asset_id = 'project-import-asset'
                WHERE project_content_id = 'content-import-sql'
              `).run()).toThrow('blob locator is unavailable');
              expect(database.prepare(`
                SELECT asset_id FROM project_content_attachments
                WHERE project_content_id = 'content-import-sql'
              `).get()).toEqual({ asset_id: 'project-standalone-asset' });
              database.close();
          """,
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify persistence and full regression suite
        run: |
          npm run verify:project-persistence
          npm run verify:blob-lifecycle
          npm test
          npm run build
          git diff --check
      - name: Commit exact implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0024_blob_integrity_quarantine.sql worker/project-attachment-locator-routes.test.ts
          git rm .github/workflows/pr141-round3-sql-update-guard.yml
          git commit -m "fix: guard Project attachment import readiness on update"
          git push origin HEAD:agent/storage-integrity-markdown-removal
