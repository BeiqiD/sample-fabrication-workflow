name: Apply PR 141 review fixes v2

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: Verify bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a383c6687aafe6325146b69ef577c4f0a7116565"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr141-review-fixes-v2.yml"

      - name: Apply reviewed patch and fixture correction
        shell: bash
        run: |
          set -euo pipefail
          awk '/^[[:space:]]+H4sI/{gsub(/^[[:space:]]+/, ""); print; exit}' \
            .github/workflows/pr141-review-fixes.yml \
            | base64 -d | gzip -d > /tmp/pr141_review_fixes.py
          python3 /tmp/pr141_review_fixes.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("worker/blob-integrity.test.ts")
          text = path.read_text()
          old = '''    const database = referenceTestDatabase();
              database.prepare(`
                INSERT INTO imports (
                  id, status, source_filename, source_sha256, sheet_name,
                  template_type, warning_count, workbook_asset_key,
                  manifest_asset_key, created_at
                ) VALUES (
                  'import-pending-reuse', 'pending', 'pending.xlsx', ?, 'Process',
                  'process', 0, 'imports/pending/source.xlsx',
                  'imports/pending/source.xlsx', ?
                )
              `).run(SHA, NOW);'''
          new = '''    const database = referenceTestDatabase();
              database.exec(`
                INSERT INTO recipe_families (id, name, template_type, created_at)
                VALUES (
                  'family-pending-reuse', 'Pending reuse', 'process',
                  '2026-08-15T16:00:00.000Z'
                );

                INSERT INTO template_versions (
                  id, recipe_family_id, name, template_type, version,
                  manifest_hash, content_json, created_at, template_kind
                ) VALUES (
                  'template-pending-reuse', 'family-pending-reuse',
                  'Pending reuse', 'process', 1, 'manifest-pending-reuse', '{}',
                  '2026-08-15T16:00:00.000Z', 'process'
                );
              `);
              database.prepare(`
                INSERT INTO imports (
                  id, status, source_filename, source_sha256, sheet_name,
                  template_type, recipe_family_id, template_version_id,
                  warning_count, workbook_asset_key, manifest_asset_key, created_at
                ) VALUES (
                  'import-pending-reuse', 'pending', 'pending.xlsx', ?, 'Process',
                  'process', 'family-pending-reuse', 'template-pending-reuse',
                  0, 'imports/pending/source.xlsx',
                  'imports/pending/source.xlsx', ?
                )
              `).run(SHA, NOW);'''
          if text.count(old) != 1:
              raise SystemExit(
                  f"worker/blob-integrity.test.ts: expected one fixture target, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/pr141-review-fixes.yml
          rm .github/workflows/pr141-review-fixes-v2.yml
          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused recovery and registration tests
        run: npx vitest run worker/fabublox-import-recovery.test.ts worker/blob-registration-reconciliation.test.ts worker/blob-integrity.test.ts

      - name: Verify blob lifecycle and migrations
        run: npm run verify:blob-lifecycle

      - name: Run complete test suite
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Commit and push reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): close recovery and promotion review gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"
