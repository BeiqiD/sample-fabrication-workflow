name: Temporary PR136 final documentation fix

on:
  push:
    branches:
      - agent/project-basic-edges

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final documentation fix
        run: python scripts/tmp-pr136-final-doc-fix.py

      - name: Verify edge contracts
        run: npm run test:project-edges

      - name: Run complete tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-pr136-final-doc-fix.py
          git add docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md src/project-edges-contract.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs(project): finalize Phase 3B4 sequence"
          git push origin HEAD:agent/project-basic-edges
