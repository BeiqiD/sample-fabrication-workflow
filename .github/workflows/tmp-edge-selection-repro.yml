name: Temporary edge selection verification

on:
  push:
    branches:
      - agent/fix-project-edge-selection-loop

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-project-edge-selection-loop
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply structural selection fix
        run: python scripts/tmp-edge-selection-repro.py
      - name: Run focused real React Flow regressions
        run: npm run test:project-edges-mounted
      - name: Verify Project Map
        run: npm run verify:project-map
      - name: Verify Project edges
        run: npm run verify:project-edges
      - name: Verify Project Reading
        run: npm run verify:project-reading
      - name: Run complete tests
        run: npm test
      - name: Run production build
        run: npm run build
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/tmp-edge-selection-repro.py
          git add src/components/project/ProjectMapSurface.tsx src/project-edge-surface.mount.test.tsx
          git commit -m "fix(project): eliminate edge selection feedback loop"
          git push origin HEAD:agent/fix-project-edge-selection-loop
