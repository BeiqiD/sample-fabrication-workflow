name: Temporary edge selection reproduction

on:
  push:
    branches:
      - agent/fix-project-edge-selection-loop

permissions:
  contents: read

jobs:
  reproduce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-project-edge-selection-loop
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply reproduction only
        run: python scripts/tmp-edge-selection-repro.py
      - name: Run real React Flow edge surface
        run: npm run test:project-edges-mounted
