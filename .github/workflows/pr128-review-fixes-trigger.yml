name: Trigger PR 128 review fixes

on:
  pull_request:
    branches:
      - v2/backend-foundation
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-source-focus' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-source-focus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Extract and apply reviewed changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr128-review-fixes.yml').read_text()
          script = workflow.split("python <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          Path('/tmp/apply-pr128-review-fixes.py').write_text(script + '\n')
          PY
          python /tmp/apply-pr128-review-fixes.py
      - name: Install mounted-test dependencies
        run: npm install --save-dev @testing-library/react@16.3.0 jsdom@26.1.0
      - name: Verify focused reference behavior
        run: npm run test:reference-foundation
      - name: Verify full suite
        run: npm test
      - name: Verify build
        run: npm run build
      - name: Commit reviewed changes
        shell: bash
        run: |
          rm .github/workflows/pr128-review-fixes.yml
          rm .github/workflows/pr128-review-fixes-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address PR 128 review findings"
          git push origin HEAD:agent/reference-source-focus
