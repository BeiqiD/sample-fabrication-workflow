name: Trigger PR 128 review fixes

on:
  pull_request:
    branches:
      - v2/backend-foundation
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-source-focus' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-source-focus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed code, tests, and documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          verify = Path('.github/workflows/verify.yml').read_text()
          script = verify.split("          python <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(compile(script, '/tmp/apply-pr128-review-fixes.py', 'exec'), {
              '__name__': '__main__',
          })
          PY
      - name: Install mounted-test dependencies
        run: npm install --save-dev @testing-library/react@16.3.0 jsdom@26.1.0
      - name: Commit reviewed changes
        shell: bash
        run: |
          rm .github/workflows/pr128-review-fixes.yml
          rm .github/workflows/pr128-review-fixes-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address PR 128 review findings"
          git push origin HEAD:agent/reference-source-focus
