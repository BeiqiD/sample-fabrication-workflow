name: Finalize deterministic search portability contract

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/deterministic-reference-search' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deterministic-reference-search
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply final portability cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          search = Path('worker/references/search.ts')
          text = search.read_text(encoding='utf-8')
          text = text.replace('type SearchCandidate = {', 'type ReferenceSearchCandidate = {', 1)
          text = text.replace('SearchCandidate', 'ReferenceSearchCandidate')
          text = text.replace('type ReferenceSearchCandidate = {', 'export type ReferenceSearchCandidate = {', 1)
          text = text.replace('must contain 1 to ${MAX_REFERENCE_SEARCH_QUERY_LENGTH} characters', 'must contain 1 to ${MAX_REFERENCE_SEARCH_QUERY_LENGTH} Unicode code points', 1)
          search.write_text(text, encoding='utf-8')

          consistency = Path('worker/reference-search-consistency.test.ts')
          text = consistency.read_text(encoding='utf-8')
          text = text.replace(
              '    expect(source).toContain(\'kind: "sqlite-source-scan"\');\n',
              '    expect(source).toContain(\'kind: "sqlite-source-scan"\');\n    expect(source).toContain("export type ReferenceSearchCandidate");\n',
              1,
          )
          consistency.write_text(text, encoding='utf-8')

          plan = Path('docs/REFERENCE_SEARCH_IMPLEMENTATION_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          text = text.replace(
              'A future Docker deployment can provide the same interface over\nchanging API or ranking semantics.',
              'A future Docker deployment can provide the same interface without\nchanging API or ranking semantics.',
              1,
          )
          text = text.replace(
              'query              required non-empty string, at most 200 characters',
              'query              required non-empty string, at most 200 Unicode code points',
              1,
          )
          plan.write_text(text, encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run test:reference-foundation
      - run: npm run verify:reference-search-worker
      - run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/references/search.ts worker/reference-search-consistency.test.ts docs/REFERENCE_SEARCH_IMPLEMENTATION_PLAN.md
          git commit -m 'Polish deterministic search portability contract'
          git push origin HEAD:agent/deterministic-reference-search
