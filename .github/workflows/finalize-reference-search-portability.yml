name: Finalize deterministic search portability contract

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/deterministic-reference-search' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deterministic-reference-search
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply final portability cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          search = Path('worker/references/search.ts')
          text = search.read_text(encoding='utf-8')
          replacements = [
              ('type SearchCandidate = {', 'export type ReferenceSearchCandidate = {'),
              ('candidates: SearchCandidate[];', 'candidates: ReferenceSearchCandidate[];'),
              ('.map((row): SearchCandidate => ({', '.map((row): ReferenceSearchCandidate => ({'),
              ('function compareCandidates(left: SearchCandidate, right: SearchCandidate) {',
               'function compareCandidates(left: ReferenceSearchCandidate, right: ReferenceSearchCandidate) {'),
              ('must contain 1 to ${MAX_REFERENCE_SEARCH_QUERY_LENGTH} characters',
               'must contain 1 to ${MAX_REFERENCE_SEARCH_QUERY_LENGTH} Unicode code points'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'expected one search.ts match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          search.write_text(text, encoding='utf-8')

          consistency = Path('worker/reference-search-consistency.test.ts')
          text = consistency.read_text(encoding='utf-8')
          old = '    expect(source).toContain(\'kind: "sqlite-source-scan"\');\n'
          new = old + '    expect(source).toContain("export type ReferenceSearchCandidate");\n'
          if text.count(old) != 1:
              raise RuntimeError('candidate export assertion anchor is not unique')
          consistency.write_text(text.replace(old, new, 1), encoding='utf-8')

          plan = Path('docs/REFERENCE_SEARCH_IMPLEMENTATION_PLAN.md')
          text = plan.read_text(encoding='utf-8')
          replacements = [
              ('A future Docker deployment can provide the same interface over\nchanging API or ranking semantics.',
               'A future Docker deployment can provide the same interface without\nchanging API or ranking semantics.'),
              ('query              required non-empty string, at most 200 characters',
               'query              required non-empty string, at most 200 Unicode code points'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'expected one plan match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          plan.write_text(text, encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run test:reference-foundation
      - run: npm run verify:reference-search-worker
      - run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/references/search.ts worker/reference-search-consistency.test.ts docs/REFERENCE_SEARCH_IMPLEMENTATION_PLAN.md
          git commit -m 'Polish deterministic search portability contract'
          git push origin HEAD:agent/deterministic-reference-search
