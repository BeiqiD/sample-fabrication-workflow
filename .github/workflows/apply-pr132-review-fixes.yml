name: Apply PR 132 Review Fixes

on:
  push:
    branches:
      - codex/pr132-review-fixes-staging

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/pr132-review-fixes-staging
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply code, test, and documentation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one replacement in {path}, found {count}: {old[:120]!r}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "worker/projects/service.ts",
              """  if (current.item.deleted_at === null) {
    const contentActive = !current.content || current.content.deleted_at === null;
    if (current.item.last_mutation_id === input.operationId && contentActive) {
      return itemMutationResponse(db, projectId, itemId, true);
    }
    conflict(\"Project item is already active\");
  }""",
              """  if (current.item.deleted_at === null) {
    const contentReplayed = !current.content
      || (current.content.deleted_at === null
        && current.content.last_mutation_id === input.operationId);
    if (current.item.last_mutation_id === input.operationId && contentReplayed) {
      return itemMutationResponse(db, projectId, itemId, true);
    }
    conflict(\"Project item is already active\");
  }""",
          )

          test_path = Path("worker/project-persistence-service.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          test_title = "rejects stale owned-content restore replays after later Markdown or attachment mutations"
          if test_title in test_text:
              raise SystemExit("Restore replay regression test already exists")
          marker = "\n});\n"
          if not test_text.endswith(marker):
              raise SystemExit("Unexpected Project persistence test-file ending")
          regression = r'''

  it("rejects stale owned-content restore replays after later Markdown or attachment mutations", async () => {
    const { database, db } = fixture();
    await seedProject(db);
    await createMarkdownProjectItem(db, "project-a", markdownInput("restore", 1), ACTOR, NOW);
    seedAsset(database, "asset-restore", "projects/asset-restore.bin");
    await createAttachmentProjectItem(db, "project-a", {
      contentId: "content-attachment-restore",
      itemId: "item-attachment-restore",
      placementId: "placement-attachment-restore",
      locator: { assetId: "asset-restore" },
      caption: "Initial caption",
      sourceUrl: null,
      geometry: { ...geometry, x: 400 },
      expectedProjectRevision: 2,
      operationId: "create-attachment-restore",
    }, ACTOR, "2026-08-09T21:01:00.000Z");

    await removeProjectItem(db, "project-a", "item-restore", {
      expectedItemRevision: 1,
      expectedContentRevision: 1,
      operationId: "remove-markdown-restore",
    }, ACTOR, "2026-08-09T21:02:00.000Z");
    await restoreProjectItem(db, "project-a", "item-restore", {
      expectedItemRevision: 2,
      expectedContentRevision: 2,
      operationId: "restore-markdown-restore",
    }, ACTOR, "2026-08-09T21:03:00.000Z");
    await updateProjectMarkdown(db, "project-a", "content-restore", {
      markdownSource: "# Edited after restore",
      expectedRevision: 3,
      operationId: "edit-after-markdown-restore",
    }, ACTOR, "2026-08-09T21:04:00.000Z");
    await expect(restoreProjectItem(db, "project-a", "item-restore", {
      expectedItemRevision: 2,
      expectedContentRevision: 2,
      operationId: "restore-markdown-restore",
    }, ACTOR, "2026-08-09T21:05:00.000Z"))
      .rejects.toMatchObject({ code: "conflict" });

    await removeProjectItem(db, "project-a", "item-attachment-restore", {
      expectedItemRevision: 1,
      expectedContentRevision: 1,
      operationId: "remove-attachment-restore",
    }, ACTOR, "2026-08-09T21:06:00.000Z");
    await restoreProjectItem(db, "project-a", "item-attachment-restore", {
      expectedItemRevision: 2,
      expectedContentRevision: 2,
      operationId: "restore-attachment-restore",
    }, ACTOR, "2026-08-09T21:07:00.000Z");
    await updateProjectAttachment(db, "project-a", "content-attachment-restore", {
      caption: "Edited after restore",
      sourceUrl: "https://example.test/edited",
      expectedRevision: 3,
      operationId: "edit-after-attachment-restore",
    }, ACTOR, "2026-08-09T21:08:00.000Z");
    await expect(restoreProjectItem(db, "project-a", "item-attachment-restore", {
      expectedItemRevision: 2,
      expectedContentRevision: 2,
      operationId: "restore-attachment-restore",
    }, ACTOR, "2026-08-09T21:09:00.000Z"))
      .rejects.toMatchObject({ code: "conflict" });
    database.close();
  });'''
          test_path.write_text(test_text[:-len(marker)] + regression + marker, encoding="utf-8")

          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """Last reviewed: 2026-08-09 after the reference/search foundation through PR #129,
the reusable Project discovery surface implemented in PR #130, the Map-first
Project review, and the Phase 3A1 schema/export foundation implemented in PR #131""",
              """Last reviewed: 2026-08-10 after the reference/search foundation through PR #129,
the reusable Project discovery surface implemented in PR #130, the Map-first
Project review, the Phase 3A1 schema/export foundation implemented in PR #131,
and the Phase 3A2 authoritative persistence service under review in Draft PR #132""",
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """**Status:** immediate next PR.""",
              """**Status:** implemented in current Draft PR #132 and under review.""",
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """- one Project snapshot/read model for Map and Reading;
- expected-revision checks, idempotent operation IDs, and explicit `409`
  conflict behavior;""",
              """- one Project snapshot/read model for Map and Reading, plus an explicit
  `includeDeleted=1` Trash snapshot that keeps recoverable child rows discoverable;
- object-owned expected revisions, bounded retry idempotency through stable IDs
  and current-row operation IDs, and explicit `409` conflict behavior;""",
          )
          replace_once(
              "docs/PRODUCT_ROADMAP.md",
              """1. Implement **Phase 3A2: authoritative Project reads/writes, rollback-safe item
   plus placement insertion, idempotency, and conflict handling**.""",
              """1. Complete review and merge **Phase 3A2: authoritative Project reads/writes,
   rollback-safe item-plus-placement insertion, bounded retry idempotency, and
   conflict handling**.""",
          )

          replace_once(
              "docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md",
              "Status: active Phase 3A2 implementation contract",
              "Status: current Draft PR #132 implementation contract under review",
          )
          replace_once(
              "docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md",
              """Last reviewed: 2026-08-09 against `v2/backend-foundation` at
`21d535a243ae4adbe10330980fe6fc57a0b85366`, after Phase 3A1 was merged in
PR #131""",
              """Last reviewed: 2026-08-10 against `v2/backend-foundation` at
`21d535a243ae4adbe10330980fe6fc57a0b85366`, during implementation and review of
Draft PR #132 after Phase 3A1 was merged in PR #131""",
          )
          replace_once(
              "docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md",
              """A mutation is replayed successfully when the current row already contains the
same `last_mutation_id` and the requested semantic state. Reusing that operation
ID with different state returns `409`.

If a later mutation has already advanced the row, replaying an older operation
returns `409`; Phase 3A2 does not retain an unbounded historical response log.""",
              """A mutation is replayed successfully only when every row whose state is owned by
the operation still contains the same `last_mutation_id` and the requested
semantic state. For an item lifecycle operation with Project-owned content, both
the item and its content must still carry that operation ID. Reusing an operation
ID with different state returns `409`.

If any participating row has been advanced by a later mutation, replaying the
older operation returns `409`; Phase 3A2 does not retain an unbounded historical
response log.""",
          )
          replace_once(
              "docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md",
              """The item uses a scalar subquery requiring a non-tombstoned registry row. A target
that disappears or becomes tombstoned before commit aborts the entire batch.
Repeated occurrences remain valid because each request has a distinct item ID.""",
              """The item uses a scalar subquery requiring a non-tombstoned registry row. A
registry tombstone before commit aborts the entire batch. The source target is
resolved immediately before the batch and is re-resolved whenever a snapshot is
read; D1 cannot hold a source-row lock across the resolver read and the later
batch. A source lifecycle change in that interval therefore cannot copy stale
editable data into Project, but the committed occurrence may subsequently
resolve as retained, missing, or tombstoned. Repeated occurrences remain valid
because each request has a distinct item ID.""",
          )
          replace_once(
              "docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md",
              """1. soft-deletes active connected edges while the item is still active;
2. soft-deletes the item using its expected revision;
3. for owned content, soft-deletes the content using its expected revision;
4. leaves the placement row physically present but invisible through the active
   item join.""",
              """1. soft-deletes active connected edges while the item is still active;
2. for owned content, soft-deletes the content using its expected revision;
3. soft-deletes the item using its expected revision after the content transition;
4. leaves the placement row physically present but invisible through the active
   item join.""",
          )
          replace_once(
              "docs/PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md",
              """`includeDeleted=1` may open a recoverably deleted Project for Trash/restore
workflows, but ordinary Project lists and snapshots hide deleted Projects.""",
              """`includeDeleted=1` returns a Trash snapshot: it may open a recoverably deleted
Project and includes recoverably removed items, owned content, attachment
metadata, placements, edges, and their revisions so restore operations remain
discoverable. Ordinary Project lists and snapshots hide deleted Projects and
removed child rows.""",
          )

          replace_once(
              "docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md",
              "Status: implemented Phase 3A1 contract from PR #131",
              "Status: Phase 3A1 complete; Phase 3A2 implemented in current Draft PR #132",
          )
          replace_once(
              "docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md",
              """Last reviewed: 2026-08-09 against `v2/backend-foundation` at
`5047ad78a2679a1ea6c050bcb2c945a980db283e`, after PR #130 and the final PR #131
schema review""",
              """Last reviewed: 2026-08-10 after Phase 3A1 was merged in PR #131 and during
review of the Phase 3A2 authoritative persistence service in Draft PR #132""",
          )
          replace_once(
              "docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md",
              """and physical-byte safety by
[BLOB_LIFECYCLE_CONTRACT.md](./BLOB_LIFECYCLE_CONTRACT.md).""",
              """and physical-byte safety by
[BLOB_LIFECYCLE_CONTRACT.md](./BLOB_LIFECYCLE_CONTRACT.md). The concrete Phase 3A2
route, transaction, idempotency, snapshot, and rollback contract is in
[PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md](./PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md).""",
          )
          replace_once(
              "docs/PROJECT_CORE_IMPLEMENTATION_PLAN.md",
              """Phase 3A2 is the immediate next pull request and activates Project reads and
writes on top of the frozen schema:

- Project list, create, open, rename, recoverable delete, and restore;
- one Project snapshot/read model for Map and Reading;
- expected-revision checks and idempotent operation IDs;
- authoritative Project-owned Markdown creation and save;
- authoritative reference insertion that resolves the source, registers the
  stable target, allocates `created_sequence`, creates the occurrence, and
  creates its placement in one transaction;
- authoritative attachment creation over the existing blob lifecycle;
- revisioned attachment caption/source-URL updates without retargeting bytes;
- placement and basic-edge mutations;
- rollback tests proving an item is never committed without its placement;
- workerd route smokes and exact integration-head deployment verification.""",
              """Phase 3A2 is implemented in current Draft PR #132 and activates Project reads
and writes on top of the frozen schema:

- Project list, create, open, rename, recoverable delete, and restore;
- one normalized active snapshot for Map and Reading plus an explicit Trash
  snapshot for recoverably removed rows;
- object-owned expected revisions, bounded retry idempotency, and explicit `409`
  conflicts;
- authoritative Project-owned Markdown creation and save;
- authoritative reference insertion that resolves the source, registers the
  stable target, allocates `created_sequence`, creates the occurrence, and
  creates its placement in one rollback-safe transaction;
- authoritative attachment creation over the existing blob lifecycle;
- revisioned attachment caption/source-URL updates without retargeting bytes;
- recoverable item/content lifecycle, placement, and basic-edge mutations;
- rollback tests proving an item is never committed without its placement;
- dedicated Project-persistence tests, the complete ordered migration chain, and
  real workerd route smokes on the exact PR head.""",
          )

          replace_once(
              "docs/PROJECT_DESIGN_FOUNDATION.md",
              "Status: current product and architecture contract after Phase 3A1 schema foundation",
              "Status: current product and architecture contract during Phase 3A2 persistence review",
          )
          replace_once(
              "docs/PROJECT_DESIGN_FOUNDATION.md",
              """Last reviewed: 2026-08-09 after the Map-first Project interaction review, the
reusable Project discovery surface in PR #130, and Phase 3A1 implemented in
PR #131""",
              """Last reviewed: 2026-08-10 after the Map-first Project interaction review,
Phase 3A1 implemented in PR #131, and the authoritative persistence service under
review in Draft PR #132""",
          )
          replace_once(
              "docs/PROJECT_DESIGN_FOUNDATION.md",
              """The concrete Phase 3A1/3A2 backend boundary is in
[PROJECT_CORE_IMPLEMENTATION_PLAN.md](./PROJECT_CORE_IMPLEMENTATION_PLAN.md).""",
              """The frozen Phase 3A1 schema boundary is recorded in
[PROJECT_CORE_IMPLEMENTATION_PLAN.md](./PROJECT_CORE_IMPLEMENTATION_PLAN.md).
The current Phase 3A2 route, transaction, idempotency, snapshot, and rollback
contract is in
[PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md](./PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md).""",
          )
          replace_once(
              "docs/PROJECT_DESIGN_FOUNDATION.md",
              """Phase 2C2 and Phase 3A1 are complete in PR #130 and PR #131. The active sequence
now begins with:

1. Phase 3A2 authoritative reads/writes, item-plus-placement transactions,
   idempotency, and conflict handling;""",
              """Phase 2C2 and Phase 3A1 are complete in PR #130 and PR #131. Phase 3A2 is
implemented in current Draft PR #132; the active sequence begins with completing
its review:

1. review and merge Phase 3A2 authoritative reads/writes,
   item-plus-placement transactions, bounded retry idempotency, and conflict
   handling;""",
          )
          replace_once(
              "docs/PROJECT_DESIGN_FOUNDATION.md",
              """React Flow is selected and license-verified when Phase 3B1 begins. It is not
required for Phase 3A schema work.""",
              """React Flow is selected and license-verified when Phase 3B1 begins. It is not
required for Phase 3A schema or persistence-service work.""",
          )

          replace_once(
              "docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md",
              "Status: product and architecture contract after Phase 3A1 schema foundation",
              "Status: product and architecture contract during Phase 3A2 backend review",
          )
          replace_once(
              "docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md",
              """Last reviewed: 2026-08-09 after the Map-first Project interaction review and
Phase 3A1 implemented in PR #131""",
              """Last reviewed: 2026-08-10 after the Map-first Project interaction review,
Phase 3A1 implemented in PR #131, and the authoritative persistence service under
review in Draft PR #132""",
          )
          replace_once(
              "docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md",
              """This document defines the intended Project workspace before React Flow or an
editor dependency are selected. Phase 3A1, implemented in PR #131, freezes the
normalized schema; Phase 3A2 supplies its authoritative read/write transactions.""",
              """This document defines the intended Project workspace before React Flow or an
editor dependency are selected. Phase 3A1, implemented in PR #131, freezes the
normalized schema; Draft PR #132 implements the Phase 3A2 authoritative
read/write transactions.""",
          )
          replace_once(
              "docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md",
              """The concrete Phase 3A split and database/service guarantees are recorded in
[PROJECT_CORE_IMPLEMENTATION_PLAN.md](./PROJECT_CORE_IMPLEMENTATION_PLAN.md).""",
              """The Phase 3A1 database guarantees are recorded in
[PROJECT_CORE_IMPLEMENTATION_PLAN.md](./PROJECT_CORE_IMPLEMENTATION_PLAN.md), and
the active Phase 3A2 service guarantees are in
[PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md](./PROJECT_PERSISTENCE_SERVICE_IMPLEMENTATION_PLAN.md).""",
          )
          replace_once(
              "docs/PROJECT_CANVAS_INTERACTION_CONTRACT.md",
              """Phase 3A1 is complete in PR #131. The active implementation sequence is:

1. **Phase 3A2 — Authoritative persistence service**: Project reads/writes,
   rollback-safe item-plus-placement creation, reference registration,
   Markdown/attachment operations, expected revisions, idempotency, conflicts,
   and workerd route gates.""",
              """Phase 3A1 is complete in PR #131. Phase 3A2 is implemented in current Draft
PR #132, so the active implementation sequence is:

1. **Complete Phase 3A2 — Authoritative persistence service**: review the Project
   reads/writes, rollback-safe item-plus-placement creation, reference
   registration, Markdown/attachment operations, object-owned expected
