          ''',
              "",
          )
          replace_once(
              "src/components/ReferenceSourceFocus.tsx",
              '''  const signature = useMemo(() => processingDataSignature(columns), [columns]);

              useEffect(() => {
          ''',
              '''  const columnsRef = useRef(columns);
              columnsRef.current = columns;
              const signature = useMemo(() => processingDataSignature(columns), [columns]);

              useEffect(() => {
          ''',
          )
          replace_once(
              "src/components/ReferenceSourceFocus.tsx",
