          write("worker/media-response.ts", r'''const SAFE_INLINE_RASTER_MIME_TYPES = new Set([
            "image/avif",
            "image/bmp",
            "image/gif",
            "image/jpeg",
            "image/png",
            "image/tiff",
            "image/webp",
            "image/x-tiff",
          ]);

          export function normalizedMediaMimeType(value: string | null | undefined) {
            const normalized = (value ?? "").split(";", 1)[0].trim().toLowerCase();
            return normalized || "application/octet-stream";
          }

          export function isSafeInlineRasterMimeType(value: string | null | undefined) {
            return SAFE_INLINE_RASTER_MIME_TYPES.has(normalizedMediaMimeType(value));
          }

          function encodedFilename(value: string) {
            return encodeURIComponent(value || "download").replace(/[\'()*]/g, (character) => (
              `%${character.charCodeAt(0).toString(16).toUpperCase()}`
            ));
          }

          export function safeMediaResponseHeaders({
            headers = new Headers(),
            mimeType,
            filename,
            cacheControl,
            etag,
          }: {
            headers?: Headers;
            mimeType: string | null | undefined;
            filename: string;
            cacheControl: string;
            etag?: string | null;
          }) {
            const normalizedMimeType = normalizedMediaMimeType(mimeType);
            const inline = isSafeInlineRasterMimeType(normalizedMimeType);
            headers.set("content-type", normalizedMimeType);
            headers.set("cache-control", cacheControl);
            headers.set("x-content-type-options", "nosniff");
            headers.set("cross-origin-resource-policy", "same-origin");
            headers.set(
              "content-disposition",
              `${inline ? "inline" : "attachment"}; filename*=UTF-8''${encodedFilename(filename)}`,
            );
            if (etag) headers.set("etag", etag);
            if (inline) headers.delete("content-security-policy");
            else {
              headers.set(
                "content-security-policy",
                "sandbox; default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'",
              );
            }
            return headers;
          }
          ''')

          replace_once(
              "worker/reference-routes.ts",
              'import type { Env } from "./types";',
              'import { safeMediaResponseHeaders } from "./media-response";\nimport type { Env } from "./types";',
          )
          replace_once(
              "worker/reference-routes.ts",
              'export const routes = new Hono<AppBindings>();\n\nroutes.post("/references/resolve", async (c) => {',
              '''export const routes = new Hono<AppBindings>();

          // Mounted before the legacy declaration in worker/index.ts so ordinary assets and
          // reference media share one fail-closed response policy during this integration slice.
          routes.get("/assets/:key{.+}", async (c) => {
            const key = c.req.param("key");
            const source = await c.env.DB.prepare(`
              SELECT a.original_name, a.mime_type
              FROM assets a
              WHERE a.r2_key = ?
                AND a.status = 'ready'
                AND NOT EXISTS (
                  SELECT 1 FROM blob_gc_ledger bg
                  WHERE bg.store_kind = 'r2'
                    AND bg.provider = 'r2'
                    AND bg.object_key = a.r2_key
                    AND bg.state IN ('deleting', 'deleted')
                )
              LIMIT 1
            `).bind(key).first<{ original_name: string; mime_type: string }>();
            if (!source) throw new HTTPException(404, { message: "Asset not found" });
            const object = await c.env.ASSETS.get(key);
            if (!object) throw new HTTPException(404, { message: "Asset not found" });
            const headers = new Headers();
            object.writeHttpMetadata(headers);
            safeMediaResponseHeaders({
              headers,
              mimeType: source.mime_type,
              filename: source.original_name || "asset",
              cacheControl: "private, max-age=3600",
              etag: object.httpEtag,
            });
            return new Response(object.body, { headers });
          });

          routes.post("/references/resolve", async (c) => {''',
          )
          replace_once(
              "worker/reference-routes.ts",
              '''      AND rsa.role = 'execution'
                AND rsa.deleted_at IS NULL
            `).bind(id, stepId).first<{
          ''',
              '''      AND rsa.role = 'execution'
                AND rsa.deleted_at IS NULL
                AND NOT EXISTS (
                  SELECT 1 FROM blob_gc_ledger bg
                  WHERE bg.store_kind = 'r2'
                    AND bg.provider = 'r2'
                    AND bg.object_key = a.r2_key
                    AND bg.state IN ('deleting', 'deleted')
                )
            `).bind(id, stepId).first<{
          ''',
          )
          replace_once(
              "worker/reference-routes.ts",
              '''  const headers = new Headers();
            object.writeHttpMetadata(headers);
            headers.set("content-type", source.mime_type || headers.get("content-type") || "application/octet-stream");
            headers.set(
              "content-disposition",
              `inline; filename*=UTF-8''${encodeURIComponent(source.original_name || "execution-image")}`,
            );
            headers.set("cache-control", "private, no-store");
            if (object.httpEtag) headers.set("etag", object.httpEtag);
            return new Response(object.body, { headers });
          ''',
              '''  const headers = new Headers();
            object.writeHttpMetadata(headers);
            safeMediaResponseHeaders({
              headers,
              mimeType: source.mime_type,
              filename: source.original_name || "execution-image",
              cacheControl: "private, no-store",
              etag: object.httpEtag,
            });
            return new Response(object.body, { headers });
          ''',
          )

          write("worker/media-response.test.ts", r'''import { describe, expect, it } from "vitest";
          import {
            isSafeInlineRasterMimeType,
            normalizedMediaMimeType,
            safeMediaResponseHeaders,
          } from "./media-response";

          describe("safe media response policy", () => {
            it.each(["image/png", "IMAGE/JPEG; charset=binary", "image/webp", "image/tiff"])(
              "allows safe raster media inline for %s",
              (mimeType) => {
                const headers = safeMediaResponseHeaders({
                  mimeType,
                  filename: "image test.png",
                  cacheControl: "private, no-store",
                  etag: '"etag"',
                });
                expect(isSafeInlineRasterMimeType(mimeType)).toBe(true);
                expect(headers.get("content-disposition")).toMatch(/^inline;/);
                expect(headers.get("x-content-type-options")).toBe("nosniff");
                expect(headers.get("cross-origin-resource-policy")).toBe("same-origin");
                expect(headers.get("content-security-policy")).toBeNull();
              },
            );

            it.each(["image/svg+xml", "text/html", "application/octet-stream", ""])(
              "forces active or unknown media to a sandboxed attachment for %j",
              (mimeType) => {
                const headers = safeMediaResponseHeaders({
                  mimeType,
                  filename: "unsafe.svg",
                  cacheControl: "private, no-store",
                });
                expect(isSafeInlineRasterMimeType(mimeType)).toBe(false);
                expect(headers.get("content-disposition")).toMatch(/^attachment;/);
                expect(headers.get("content-security-policy")).toContain("sandbox");
                expect(headers.get("x-content-type-options")).toBe("nosniff");
              },
            );

            it("normalizes parameters and empty media types", () => {
              expect(normalizedMediaMimeType(" Image/PNG ; charset=utf-8 ")).toBe("image/png");
              expect(normalizedMediaMimeType(null)).toBe("application/octet-stream");
            });
          });
          ''')

          media_test = read("worker/reference-media-route.test.ts")
          media_test = media_test.replace(
              '    expect(response.headers.get("cache-control")).toBe("private, no-store");\n',
              '''    expect(response.headers.get("cache-control")).toBe("private, no-store");
              expect(response.headers.get("x-content-type-options")).toBe("nosniff");
              expect(response.headers.get("cross-origin-resource-policy")).toBe("same-origin");
              expect(response.headers.get("content-disposition")).toMatch(/^inline;/);
          ''',
