                  sample: item,
                  run: item.id === sample.id
                    ? selectedRun
                    : correspondingRunForSelectedRun(selectedRun, sample.runs, item.runs),
                }));
              }, [sample, samples, selectedRun]);
          ''',
          )
          replace_once(
              "src/pages/ProcessingWorkspacePage.tsx",
              '''  const gridColumns = selectedRun
                ? samples.map((item) => ({
                  sample: item,
                  run: item.id === sample.id
                    ? selectedRun
                    : correspondingRunForSelectedRun(selectedRun, sample.runs, item.runs),
                }))
