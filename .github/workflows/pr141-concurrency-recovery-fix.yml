name: PR 141 concurrency and recovery fix

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/storage-integrity-markdown-removal
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a5aebfab945425447ff4f52b4c52a5dbaa60fc8b HEAD
          test -f scripts/pr141-concurrency-recovery-fix.py
          python scripts/pr141-concurrency-recovery-fix.py
          if test -f scripts/pr141-concurrency-recovery-fix-round2.py; then
            python scripts/pr141-concurrency-recovery-fix-round2.py
          fi
          rm scripts/pr141-concurrency-recovery-fix.py
          rm -f scripts/pr141-concurrency-recovery-fix-round2.py
          rm .github/workflows/pr141-concurrency-recovery-fix.yml
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify blob lifecycle and storage integrity
        run: npm run verify:blob-lifecycle
      - name: Run ordinary and mounted tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): coordinate concurrent registration and canonical recovery"
          git push origin HEAD:agent/storage-integrity-markdown-removal
