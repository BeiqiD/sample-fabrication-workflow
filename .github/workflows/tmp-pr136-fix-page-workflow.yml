name: Temporary PR136 integration patch correction

on:
  push:
    branches:
      - agent/project-basic-edges
    paths:
      - .github/workflows/tmp-pr136-fix-page-workflow.yml

permissions:
  contents: write

jobs:
  correct-and-trigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
          fetch-depth: 0
      - name: Correct geometry history replacement target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-pr136-edge-page.yml')
          lines = path.read_text().splitlines()
          anchor = "          def replace_line(value, replacements, occurrence=0):"
          matches = [i for i, line in enumerate(lines) if line == anchor]
          if len(matches) != 1:
              raise SystemExit(f'expected one helper anchor, found {len(matches)}')
          index = matches[0]
          guard = [
              "              if value == '    setUndoStack((current) => [...current, command].slice(-100));' and occurrence == 0:",
              "                  occurrence = 1",
          ]
          if guard[0] not in lines:
              lines[index + 1:index + 1] = guard
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit correction and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr136-fix-page-workflow.yml
          git add .github/workflows/tmp-pr136-edge-page.yml
          git diff --cached --check
          git commit -m "chore(ci): target Project geometry history correctly"
          git push origin HEAD:agent/project-basic-edges
