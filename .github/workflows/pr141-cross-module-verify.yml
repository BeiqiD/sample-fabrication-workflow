name: Verify PR 141 cross-module fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: read

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b97350b7f4c54b54eb9496170bd039150c6ec119"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr141-cross-module-verify.yml"

      - name: Apply cross-module architecture patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/pr141-cross-module-fixes.py')
          text = path.read_text()
          needle = (
              '    updated, count = re.subn(pattern, replacement, text, '
              'count=1, flags=re.S)\n'
          )
          replacement = (
              '    pattern = pattern.replace("\\\\\\\\", "\\\\")\n'
              + needle
          )
          if text.count(needle) != 1:
              raise SystemExit('Could not normalize patch regex helper')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          set +e
          output="$(python3 .github/pr141-cross-module-fixes.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s' "$output" | tail -c 4000 | tr '\n' ' ')"
            echo "::error file=.github/pr141-cross-module-fixes.py::$message"
            exit "$status"
          fi
          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused cross-module regressions
        run: npx vitest run worker/fabublox-import-recovery.test.ts worker/blob-registration-reconciliation.test.ts

      - name: Verify blob lifecycle and migrations
        run: npm run verify:blob-lifecycle

      - name: Run complete test suite
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Stage patched tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr141-patched/worker/references /tmp/pr141-patched/docs
          cp worker/comment-submission-routes.ts /tmp/pr141-patched/worker/
          cp worker/fabublox-import-recovery.ts /tmp/pr141-patched/worker/
          cp worker/index.ts /tmp/pr141-patched/worker/
          cp worker/reference-routes.ts /tmp/pr141-patched/worker/
          cp worker/references/adapters.ts /tmp/pr141-patched/worker/references/
          cp worker/fabublox-import-recovery.test.ts /tmp/pr141-patched/worker/
          cp worker/blob-registration-reconciliation.test.ts /tmp/pr141-patched/worker/
          cp docs/BLOB_LIFECYCLE_CONTRACT.md /tmp/pr141-patched/docs/

      - name: Upload verified patched tree
        uses: actions/upload-artifact@v4
        with:
          name: pr141-cross-module-patched-tree
          path: /tmp/pr141-patched
          if-no-files-found: error
          retention-days: 1
