name: Verify PR 141 cross-module fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: read

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7fdef8dbd828112120bdfec014a4c36510d01b1e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr141-cross-module-verify.yml"

      - name: Apply database-owned cross-module patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr141-original/worker
          cp worker/fabublox-import-recovery.ts /tmp/pr141-original/worker/
          cp worker/index.ts /tmp/pr141-original/worker/
          cp worker/fabublox-import-recovery.test.ts /tmp/pr141-original/worker/
          cp worker/blob-registration-reconciliation.test.ts /tmp/pr141-original/worker/
          set +e
          output="$(python3 .github/pr141-cross-module-fixes-v5.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s' "$output" | tail -c 4000 | tr '\n' ' ')"
            echo "::error file=.github/pr141-cross-module-fixes-v5.py::$message"
            exit "$status"
          fi
          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused cross-module regressions
        run: npx vitest run worker/supersession-cross-module.test.ts

      - name: Verify blob lifecycle and migrations
        run: npm run verify:blob-lifecycle

      - name: Run complete test suite
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Stage patched tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            /tmp/pr141-patched/worker/references \
            /tmp/pr141-patched/docs \
            /tmp/pr141-patched/migrations
          cp worker/comment-submission-routes.ts /tmp/pr141-patched/worker/
          cp worker/reference-routes.ts /tmp/pr141-patched/worker/
          cp worker/references/adapters.ts /tmp/pr141-patched/worker/references/
          cp worker/supersession-cross-module.test.ts /tmp/pr141-patched/worker/
          cp docs/BLOB_LIFECYCLE_CONTRACT.md /tmp/pr141-patched/docs/
          cp migrations/0029_supersession_timeline_projection.sql \
            /tmp/pr141-patched/migrations/

      - name: Upload verified patched tree
        uses: actions/upload-artifact@v4
        with:
          name: pr141-cross-module-patched-tree-v2
          path: /tmp/pr141-patched
          if-no-files-found: error
          retention-days: 1
