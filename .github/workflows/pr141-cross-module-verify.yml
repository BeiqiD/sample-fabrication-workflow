name: Publish verified PR 141 cross-module fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  actions: read
  contents: write

jobs:
  publish-verified-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify publisher ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "18a1aea89be483c196fb1d0291587a435ed00f9c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr141-cross-module-verify.yml"

      - name: Download the already-verified product tree
        uses: actions/download-artifact@v4
        with:
          name: pr141-cross-module-patched-tree-v3
          path: /tmp/pr141-patched
          github-token: ${{ github.token }}
          repository: BeiqiD/sample-fabrication-workflow
          run-id: 31918236193

      - name: Install verified product files and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pr141-patched/docs/BLOB_LIFECYCLE_CONTRACT.md \
            docs/BLOB_LIFECYCLE_CONTRACT.md
          cp /tmp/pr141-patched/migrations/0029_supersession_timeline_projection.sql \
            migrations/0029_supersession_timeline_projection.sql
          cp /tmp/pr141-patched/worker/blob-registration-reconciliation.test.ts \
            worker/blob-registration-reconciliation.test.ts
          cp /tmp/pr141-patched/worker/comment-submission-routes.ts \
            worker/comment-submission-routes.ts
          cp /tmp/pr141-patched/worker/reference-routes.ts \
            worker/reference-routes.ts
          cp /tmp/pr141-patched/worker/references/adapters.ts \
            worker/references/adapters.ts
          cp /tmp/pr141-patched/worker/supersession-cross-module.test.ts \
            worker/supersession-cross-module.test.ts

          rm -f \
            .github/pr141-cross-module-fixes.py \
            .github/pr141-cross-module-fixes-v2.py \
            .github/pr141-cross-module-fixes-v3.py \
            .github/pr141-cross-module-fixes-v4.py \
            .github/pr141-cross-module-fixes-v5.py \
            .github/pr141-cross-module-fixes-v6.py \
            .github/workflows/pr141-cross-module-verify.yml

          git diff --check
          test "$(git diff --name-only | sort)" = "$(cat <<'EOF'
.github/pr141-cross-module-fixes-v2.py
.github/pr141-cross-module-fixes-v3.py
.github/pr141-cross-module-fixes-v4.py
.github/pr141-cross-module-fixes-v5.py
.github/pr141-cross-module-fixes-v6.py
.github/pr141-cross-module-fixes.py
.github/workflows/pr141-cross-module-verify.yml
docs/BLOB_LIFECYCLE_CONTRACT.md
migrations/0029_supersession_timeline_projection.sql
worker/blob-registration-reconciliation.test.ts
worker/comment-submission-routes.ts
worker/reference-routes.ts
worker/references/adapters.ts
worker/supersession-cross-module.test.ts
EOF
)"

      - name: Commit and push verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): align supersession projections and references"
          git push origin "HEAD:${GITHUB_REF_NAME}"
