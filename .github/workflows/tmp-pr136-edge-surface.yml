name: Temporary PR136 edge surface

on:
  push:
    branches:
      - agent/project-basic-edges
    paths:
      - .github/workflows/tmp-pr136-edge-surface.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-basic-edges
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire authoritative edges into React Flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/project/ProjectMapSurface.tsx')
          text = path.read_text()

          replacements = []
          replacements.append(('''  Background,
            Controls,
            NodeResizer,
            ReactFlow,
            applyNodeChanges,
            type Node,''', '''  Background,
            ConnectionMode,
            Controls,
            Handle,
            MarkerType,
            NodeResizer,
            Position,
            ReactFlow,
            applyNodeChanges,
            type Connection,
            type Edge,
            type Node,'''))
          replacements.append(('''import type { ProjectMapGeometry } from "../../../shared/project-types";''', '''import type { ProjectEdgeRecord } from "../../../shared/project-api";
          import type { ProjectEdgeHandle, ProjectMapGeometry } from "../../../shared/project-types";
          import type { ProjectPendingEdgePreview } from "../../lib/project-edges";'''))
          replacements.append(('''type ProjectFlowNode = Node<ProjectFlowNodeData, "projectItem">;''', '''type ProjectFlowNode = Node<ProjectFlowNodeData, "projectItem">;
          type ProjectFlowEdge = Edge;'''))
          replacements.append(('''export interface ProjectMapSurfaceProps {
            nodes: ProjectNodeDescriptor[];''', '''export interface ProjectMapSurfaceProps {
            nodes: ProjectNodeDescriptor[];
            edges?: ProjectEdgeRecord[];
            pendingEdge?: ProjectPendingEdgePreview | null;'''))
          replacements.append(('''  selectedItemId: string | null;
            geometryInteractionDisabled?: boolean;
            onSelect: (itemId: string | null) => void;''', '''  selectedItemId: string | null;
            selectedEdgeId?: string | null;
            geometryInteractionDisabled?: boolean;
            onSelect: (itemId: string | null) => void;
            onEdgeSelect?: (edgeId: string | null) => void;
            onEdgeConnect?: (connection: {
              sourceItemId: string;
              targetItemId: string;
              sourceHandle: ProjectEdgeHandle;
              targetHandle: ProjectEdgeHandle;
            }) => void;'''))
          replacements.append(('''  return <article
            className={`project-map-node project-map-node-${descriptor.kind}${editing ? " editing" : ""}`}
            onDoubleClick={(event) => {
              if (descriptor.kind !== "markdown" || editing) return;
              event.stopPropagation();
              data.onMarkdownEditRequest(descriptor.itemId);
            }}
          >
            <NodeResizer''', '''  return <article
            className={`project-map-node project-map-node-${descriptor.kind}${editing ? " editing" : ""}`}
            onDoubleClick={(event) => {
              if (descriptor.kind !== "markdown" || editing) return;
              event.stopPropagation();
              data.onMarkdownEditRequest(descriptor.itemId);
            }}
          >
            <Handle type="source" id="top" position={Position.Top} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <Handle type="source" id="right" position={Position.Right} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <Handle type="source" id="bottom" position={Position.Bottom} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <Handle type="source" id="left" position={Position.Left} className="project-edge-handle nodrag nopan" isConnectable={!geometryInteractionDisabled && !editing} />
            <NodeResizer'''))
          replacements.append(('''const PROJECT_NODE_TYPES = { projectItem: ProjectItemNode } as const;
          const PROJECT_EDGES: [] = [];
          const PROJECT_FIT_VIEW_OPTIONS''', '''const PROJECT_NODE_TYPES = { projectItem: ProjectItemNode } as const;
          const PROJECT_FIT_VIEW_OPTIONS'''))
          replacements.append(('''const NOOP_MARKDOWN_CHANGE = (_value: string) => undefined;
          const NOOP_ACTION = () => undefined;''', '''const NOOP_MARKDOWN_CHANGE = (_value: string) => undefined;
          const NOOP_ACTION = () => undefined;
          const NOOP_EDGE_SELECT = (_edgeId: string | null) => undefined;

          function isProjectEdgeHandle(value: string | null | undefined): value is ProjectEdgeHandle {
            return value === "top" || value === "right" || value === "bottom" || value === "left";
          }

          function projectFlowMarker(marker: "none" | "arrow") {
            return marker === "arrow" ? { type: MarkerType.ArrowClosed } : undefined;
          }

          function buildFlowEdge(edge: ProjectEdgeRecord, selected: boolean): ProjectFlowEdge {
            return {
              id: edge.id,
              source: edge.sourceItemId,
              target: edge.targetItemId,
              sourceHandle: edge.sourceHandle,
              targetHandle: edge.targetHandle,
              type: "default",
              label: edge.label ?? undefined,
              markerStart: projectFlowMarker(edge.markerStart),
              markerEnd: projectFlowMarker(edge.markerEnd),
              selected,
              selectable: true,
              deletable: false,
            };
          }

          function buildPendingFlowEdge(edge: ProjectPendingEdgePreview): ProjectFlowEdge {
            return {
              id: edge.edgeId,
              source: edge.sourceItemId,
              target: edge.targetItemId,
              sourceHandle: edge.sourceHandle,
              targetHandle: edge.targetHandle,
              type: "default",
              label: edge.label ?? undefined,
              markerStart: projectFlowMarker(edge.markerStart),
              markerEnd: projectFlowMarker(edge.markerEnd),
              selectable: false,
              deletable: false,
              animated: edge.status === "saving",
              className: `project-edge-pending ${edge.status}`,
            };
          }'''))
          replacements.append(('''  nodes: descriptors,
            pendingReference = null,''', '''  nodes: descriptors,
            edges = [],
            pendingEdge = null,
            pendingReference = null,'''))
          replacements.append(('''  selectedItemId,
            geometryInteractionDisabled = false,
            onSelect,
            onGeometryCommit,''', '''  selectedItemId,
            selectedEdgeId = null,
            geometryInteractionDisabled = false,
            onSelect,
            onEdgeSelect = NOOP_EDGE_SELECT,
            onEdgeConnect,
            onGeometryCommit,'''))
          replacements.append(('''  const [flowNodes, setFlowNodes] = useState<ProjectFlowNode[]>(projectedNodes);
            const flowNodesRef = useRef<ProjectFlowNode[]>(projectedNodes);''', '''  const [flowNodes, setFlowNodes] = useState<ProjectFlowNode[]>(projectedNodes);
            const flowNodesRef = useRef<ProjectFlowNode[]>(projectedNodes);
            const projectedEdges = useMemo(() => {
              const active = edges.map((edge) => buildFlowEdge(edge, edge.id === selectedEdgeId));
              if (pendingEdge && !active.some((edge) => edge.id === pendingEdge.edgeId)) {
                active.push(buildPendingFlowEdge(pendingEdge));
              }
              return active;
            }, [edges, pendingEdge, selectedEdgeId]);'''))
          replacements.append(('''  const handleNodeClick = useCallback<NodeMouseHandler<ProjectFlowNode>>((_event, node) => {
            if (!node.data.pendingReference && !node.data.pendingAttachment) onSelect(node.id);
            setContextMenu(null);
          }, [onSelect]);
          const handlePaneClick = useCallback(() => {
            onSelect(null);
            setContextMenu(null);
          }, [onSelect]);
          const handleSelectionChange = useCallback<OnSelectionChangeFunc<ProjectFlowNode>>(({ nodes }) => {
            const selected = [...nodes].reverse().find((node) => !node.data.pendingReference && !node.data.pendingAttachment);
            onSelect(selected?.id ?? null);
          }, [onSelect]);''', '''  const handleNodeClick = useCallback<NodeMouseHandler<ProjectFlowNode>>((_event, node) => {
            if (!node.data.pendingReference && !node.data.pendingAttachment) {
              onSelect(node.id);
              onEdgeSelect(null);
            }
            setContextMenu(null);
          }, [onEdgeSelect, onSelect]);
          const handleEdgeClick = useCallback((_event: React.MouseEvent, edge: ProjectFlowEdge) => {
            if (pendingEdge?.edgeId === edge.id) return;
            onEdgeSelect(edge.id);
            onSelect(null);
            setContextMenu(null);
          }, [onEdgeSelect, onSelect, pendingEdge]);
          const handlePaneClick = useCallback(() => {
            onSelect(null);
            onEdgeSelect(null);
            setContextMenu(null);
          }, [onEdgeSelect, onSelect]);
          const handleSelectionChange = useCallback<OnSelectionChangeFunc<ProjectFlowNode>>(({ nodes }) => {
            const selected = [...nodes].reverse().find((node) => !node.data.pendingReference && !node.data.pendingAttachment);
            if (selected) {
              onSelect(selected.id);
              onEdgeSelect(null);
            }
          }, [onEdgeSelect, onSelect]);
          const handleConnect = useCallback((connection: Connection) => {
            if (geometryInteractionDisabled || !onEdgeConnect || !connection.source || !connection.target
              || !isProjectEdgeHandle(connection.sourceHandle) || !isProjectEdgeHandle(connection.targetHandle)) return;
            onEdgeConnect({
              sourceItemId: connection.source,
              targetItemId: connection.target,
              sourceHandle: connection.sourceHandle,
              targetHandle: connection.targetHandle,
            });
          }, [geometryInteractionDisabled, onEdgeConnect]);'''))
          replacements.append(('''    <ReactFlow<ProjectFlowNode>
              nodes={flowNodes}
              edges={PROJECT_EDGES}''', '''    <ReactFlow<ProjectFlowNode, ProjectFlowEdge>
              nodes={flowNodes}
              edges={projectedEdges}'''))
          replacements.append(('''      onNodeClick={handleNodeClick}
              onSelectionChange={handleSelectionChange}
              onPaneClick={handlePaneClick}''', '''      onNodeClick={handleNodeClick}
              onEdgeClick={handleEdgeClick}
              onConnect={handleConnect}
              onSelectionChange={handleSelectionChange}
              onPaneClick={handlePaneClick}'''))
          replacements.append(('''      nodesDraggable={!geometryInteractionDisabled}
              nodesConnectable={false}
              elementsSelectable''', '''      nodesDraggable={!geometryInteractionDisabled}
              nodesConnectable={!geometryInteractionDisabled}
              edgesReconnectable={false}
              connectionMode={ConnectionMode.Loose}
              elementsSelectable'''))

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one surface anchor, found {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text)

          css = Path('src/components/project/project-map-surface.css')
          css_text = css.read_text()
          css_text += '''\n\n.project-edge-handle {\n  width: 10px;\n  height: 10px;\n  border-width: 2px;\n}\n\n.project-edge-pending {\n  stroke-dasharray: 6 5;\n}\n'''
          css.write_text(css_text)
          PY
      - name: Verify edge surface types and mounted behavior
        run: |
          npm run test:project-map-mounted
          npm run build
      - name: Commit verified edge surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr136-edge-surface.yml
          git add src/components/project/ProjectMapSurface.tsx src/components/project/project-map-surface.css
          git diff --cached --check
          git commit -m "feat(project): render basic Project edges"
          git push origin HEAD:agent/project-basic-edges
