name: PR 141 primary reconciliation fix

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-integrity-markdown-removal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact-head fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b6704f7e317ff16baa35e1a4a1240bf22675579c"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "worker/blob-lifecycle/registration.ts",
              '''export interface R2RegistrationReconciliation {
            asset: ReusableR2Asset;
            deduplicated: boolean;
          }

          /**
           * Resolve an uncertain ready-R2 INSERT without guessing from the content hash.
           *
           * The exact stable identity is authoritative. Only when primary D1 confirms
           * that this attempt did not commit may a different verified winner make the
           * uploaded locator redundant. The helper deletes a candidate only when the
           * winner is physically different; unresolved candidates remain caller-owned so
           * fixed-key retry loops can retry the INSERT before cleanup.
           */
          export async function reconcileR2RegistrationFailure(
            env: Env,
            input: {
              id: string;
              objectKey: string;
              sha256: string;
              findWinner: () => Promise<ReusableR2Asset | null>;
            },
          ): Promise<R2RegistrationReconciliation | null> {
            const committed = await reconcileCommittedR2Asset(env.DB, input);
            if (committed) {
              return { asset: committed, deduplicated: false };
            }

            const winner = await input.findWinner();
            if (!winner) return null;

            const sameAttempt = winner.id === input.id
              && winner.r2_key === input.objectKey;
            if (!sameAttempt) {
              await env.ASSETS.delete(input.objectKey);
            }
            return {
              asset: winner,
              deduplicated: !sameAttempt,
            };
          }
          ''',
              '''export type R2RegistrationReconciliation =
            | {
                outcome: "resolved";
                asset: ReusableR2Asset;
                deduplicated: boolean;
              }
            | {
                outcome: "confirmed-uncommitted";
                error?: unknown;
              }
            | {
                outcome: "authority-unavailable";
                error: unknown;
              };

          /**
           * Resolve an uncertain ready-R2 INSERT without guessing from the content hash.
           *
           * The exact stable identity is authoritative. A primary-D1 failure is distinct
           * from a confirmed absence: callers must preserve the uploaded locator and
           * return a retryable error while authority is unavailable. Only after primary
           * D1 confirms that the exact attempt did not commit may cleanup or winner
           * reconciliation make the candidate redundant.
           */
          export async function reconcileR2RegistrationFailure(
            env: Env,
            input: {
              id: string;
              objectKey: string;
              sha256: string;
              findWinner: () => Promise<ReusableR2Asset | null>;
            },
          ): Promise<R2RegistrationReconciliation> {
            let committed: ReusableR2Asset | null;
            try {
              committed = await reconcileCommittedR2Asset(env.DB, input);
            } catch (error) {
              return { outcome: "authority-unavailable", error };
            }
            if (committed) {
              return {
                outcome: "resolved",
                asset: committed,
                deduplicated: false,
              };
            }

            let winner: ReusableR2Asset | null;
            try {
              winner = await input.findWinner();
            } catch (error) {
              return { outcome: "confirmed-uncommitted", error };
            }
            if (!winner) return { outcome: "confirmed-uncommitted" };

            const sameAttempt = winner.id === input.id
              && winner.r2_key === input.objectKey;
            if (!sameAttempt) {
              await env.ASSETS.delete(input.objectKey);
            }
            return {
              outcome: "resolved",
              asset: winner,
              deduplicated: !sameAttempt,
            };
          }
          ''',
          )

          replace_once(
              "worker/index.ts",
              '''      let resolution;
                try {
                  resolution = await reconcileR2RegistrationFailure(c.env, {
                    id,
                    objectKey: key,
                    sha256,
                    findWinner: () => reusableR2Asset(c.env, sha256),
                  });
                } catch (verificationError) {
                  await c.env.ASSETS.delete(key);
                  throw verificationError;
                }
                if (resolution) {
                  const payload = {
                    id: resolution.asset.id,
                    key: resolution.asset.r2_key,
                    deduplicated: resolution.deduplicated,
                  };
                  return resolution.deduplicated
                    ? c.json(payload)
                    : c.json(payload, 201);
                }
                await c.env.ASSETS.delete(key);
                if (attempt === 1) throw error;
          ''',
              '''      const resolution = await reconcileR2RegistrationFailure(c.env, {
                  id,
                  objectKey: key,
                  sha256,
                  findWinner: () => reusableR2Asset(c.env, sha256),
                });
                if (resolution.outcome === "authority-unavailable") {
                  throw new HTTPException(503, {
                    message: "Asset registration outcome could not be verified. Retry later.",
                  });
                }
                if (resolution.outcome === "resolved") {
                  const payload = {
                    id: resolution.asset.id,
                    key: resolution.asset.r2_key,
                    deduplicated: resolution.deduplicated,
                  };
                  return resolution.deduplicated
                    ? c.json(payload)
                    : c.json(payload, 201);
                }
                await c.env.ASSETS.delete(key);
                if (resolution.error) throw resolution.error;
                if (attempt === 1) throw error;
          ''',
          )

          replace_once(
              "worker/index.ts",
              '''        let resolution;
                  try {
                    resolution = await reconcileR2RegistrationFailure(c.env, {
                      id: assetId,
                      objectKey: key,
                      sha256,
                      findWinner: () => reusableR2Asset(c.env, sha256),
                    });
                  } catch (verificationError) {
                    await c.env.ASSETS.delete(key);
                    throw verificationError;
                  }
                  if (resolution) {
                    asset = resolution.asset;
                    break;
                  }
                  if (attempt === 1) {
                    await c.env.ASSETS.delete(key);
                    throw error;
                  }
          ''',
              '''        const resolution = await reconcileR2RegistrationFailure(c.env, {
                    id: assetId,
                    objectKey: key,
                    sha256,
                    findWinner: () => reusableR2Asset(c.env, sha256),
                  });
                  if (resolution.outcome === "authority-unavailable") {
                    throw new HTTPException(503, {
                      message: "Asset registration outcome could not be verified. Retry later.",
                    });
                  }
                  if (resolution.outcome === "resolved") {
                    asset = resolution.asset;
                    break;
                  }
                  if (resolution.error) {
                    await c.env.ASSETS.delete(key);
                    throw resolution.error;
                  }
                  if (attempt === 1) {
                    await c.env.ASSETS.delete(key);
                    throw error;
                  }
          ''',
          )

          replace_once(
              "worker/comment-submission-routes.ts",
              '''            let resolution;
                      try {
                        resolution = await reconcileR2RegistrationFailure(c.env, {
                          id: assetId,
                          objectKey: key,
                          sha256,
                          findWinner: () => reusableCommentR2Asset(c.env, sha256),
                        });
                      } catch (verificationError) {
                        await c.env.ASSETS.delete(key);
                        throw verificationError;
                      }
                      if (resolution) {
                        asset = resolution.asset;
                        deduplicated = resolution.deduplicated;
                        break;
                      }
                      if (attempt === 1) {
                        await c.env.ASSETS.delete(key);
                        throw error;
                      }
          ''',
              '''            const resolution = await reconcileR2RegistrationFailure(c.env, {
                      id: assetId,
                      objectKey: key,
                      sha256,
                      findWinner: () => reusableCommentR2Asset(c.env, sha256),
                    });
                    if (resolution.outcome === "authority-unavailable") {
                      throw new HTTPException(503, {
                        message: "Asset registration outcome could not be verified. Retry later.",
                      });
                    }
                    if (resolution.outcome === "resolved") {
                      asset = resolution.asset;
                      deduplicated = resolution.deduplicated;
                      break;
                    }
                    if (resolution.error) {
                      await c.env.ASSETS.delete(key);
                      throw resolution.error;
                    }
                    if (attempt === 1) {
                      await c.env.ASSETS.delete(key);
                      throw error;
                    }
          ''',
          )

          replace_once(
              "worker/project-foundation-routes.ts",
              '''      let resolution;
                try {
                  resolution = await reconcileR2RegistrationFailure(c.env, {
                    id,
                    objectKey: key,
                    sha256,
                    findWinner: () => reusableProjectAsset(c.env, sha256),
                  });
                } catch (verificationError) {
                  await c.env.ASSETS.delete(key);
                  throw verificationError;
                }
                if (resolution) {
                  const payload = returnReusableProjectAsset(
                    resolution.asset,
                    filename,
                    contentType,
                    buffer.byteLength,
                    resolution.deduplicated,
                  );
                  return resolution.deduplicated
                    ? c.json(payload)
                    : c.json(payload, 201);
                }
                await c.env.ASSETS.delete(key);
                if (attempt === 1) throw error;
          ''',
              '''      const resolution = await reconcileR2RegistrationFailure(c.env, {
                  id,
                  objectKey: key,
                  sha256,
                  findWinner: () => reusableProjectAsset(c.env, sha256),
                });
                if (resolution.outcome === "authority-unavailable") {
                  throw new HTTPException(503, {
                    message: "Asset registration outcome could not be verified. Retry later.",
                  });
                }
                if (resolution.outcome === "resolved") {
                  const payload = returnReusableProjectAsset(
                    resolution.asset,
                    filename,
                    contentType,
                    buffer.byteLength,
                    resolution.deduplicated,
                  );
                  return resolution.deduplicated
                    ? c.json(payload)
                    : c.json(payload, 201);
                }
                await c.env.ASSETS.delete(key);
                if (resolution.error) throw resolution.error;
                if (attempt === 1) throw error;
          ''',
          )

          replace_once(
              "worker/blob-registration-reconciliation.test.ts",
              '''  constructor(
              readonly database: DatabaseSync,
              private readonly insertTarget: "assets" | "managed_storage_objects",
            ) {}

            prepare(query: string) {
              return new FaultD1Statement(this, query);
            }
          ''',
              '''  constructor(
              readonly database: DatabaseSync,
              private readonly insertTarget: "assets" | "managed_storage_objects",
              private readonly failPrimaryAssetRead = false,
            ) {}

            prepare(query: string) {
              const normalized = query.replace(/\\s+/g, " ");
              if (
                this.failPrimaryAssetRead
                && normalized.includes(
                  "WHERE a.id = ? AND a.r2_key = ? AND a.sha256 = ?",
                )
              ) {
                throw new Error("injected persistent primary asset reconciliation failure");
              }
              return new FaultD1Statement(this, query);
            }
          ''',
          )

          replace_once(
              "worker/blob-registration-reconciliation.test.ts",
              '''  it("keeps a committed managed Comment attachment and does not delete its own provider key after response loss", async () => {
          ''',
              '''  it("keeps a committed ordinary R2 asset when primary reconciliation is persistently unavailable", async () => {
              const bytes = Uint8Array.from([137, 80, 78, 71, 91, 92, 93]);
              const database = referenceTestDatabase();
              const stored = new Map<string, Uint8Array>();
              const deleted: string[] = [];
              const env = {
                AUTH_MODE: "disabled",
                DB: new FaultD1Database(
                  database,
                  "assets",
                  true,
                ) as unknown as D1Database,
                ASSETS: {
                  put: vi.fn(async (key: string, value: unknown) => {
                    if (!(value instanceof ArrayBuffer)) throw new Error("Expected an ArrayBuffer");
                    stored.set(key, new Uint8Array(value.slice(0)));
                  }),
                  delete: vi.fn(async (key: string) => {
                    deleted.push(key);
                    stored.delete(key);
                  }),
                  head: vi.fn(async (key: string) => {
                    const value = stored.get(key);
                    return value ? r2Object(value, "image/png") : null;
                  }),
                  get: vi.fn(async (key: string) => {
                    const value = stored.get(key);
                    return value ? r2Object(value, "image/png") : null;
                  }),
                  list: vi.fn(async () => ({ objects: [], truncated: false })),
                } as unknown as R2Bucket,
              } satisfies Env;

              const response = await worker.fetch(new Request(
                "https://app.test/api/assets",
                {
                  method: "POST",
                  headers: {
                    "content-type": "image/png",
                    "x-filename": "primary-unavailable.png",
                  },
                  body: bytes,
                },
              ), env, executionContext);
              expect(response.status).toBe(503);

              const row = database.prepare(`
                SELECT id, r2_key, status, sha256
                FROM assets
                ORDER BY created_at DESC
                LIMIT 1
              `).get() as {
                id: string;
                r2_key: string;
                status: string;
                sha256: string;
              };
              expect(row.status).toBe("ready");
              expect(row.sha256).toBe(await sha256Hex(bytesBuffer(bytes)));
              expect(deleted).not.toContain(row.r2_key);
              expect(stored.get(row.r2_key)).toEqual(bytes);
              database.close();
            });

            it("keeps a committed managed Comment attachment and does not delete its own provider key after response loss", async () => {
          ''',
          )

          workflow = Path(".github/workflows/pr141-primary-reconciliation-fix.yml")
          workflow.unlink()
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify lifecycle and storage integrity
        run: npm run verify:blob-lifecycle
      - name: Run ordinary and mounted tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build:deploy
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/blob-lifecycle/registration.ts worker/index.ts worker/comment-submission-routes.ts worker/project-foundation-routes.ts worker/blob-registration-reconciliation.test.ts .github/workflows/pr141-primary-reconciliation-fix.yml
          git commit -m "fix(storage): preserve R2 objects when reconciliation authority is unavailable"
          git push origin HEAD:agent/storage-integrity-markdown-removal
