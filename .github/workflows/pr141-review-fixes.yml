name: Apply PR 141 review fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3002f5a37f7e01a2545d694075067e0f65f68b47"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr141-review-fixes.yml"

      - name: Apply reviewed patch and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cat <<'B64' | base64 -d | gzip -d > /tmp/pr141_review_fixes.py
          
          B64
          python3 /tmp/pr141_review_fixes.py
          rm .github/workflows/pr141-review-fixes.yml
          git diff --check
          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused recovery and registration tests
        run: npx vitest run worker/fabublox-import-recovery.test.ts worker/blob-registration-reconciliation.test.ts

      - name: Verify blob lifecycle and migrations
        run: npm run verify:blob-lifecycle

      - name: Run complete test suite
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Commit and push reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): close recovery and promotion review gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"
