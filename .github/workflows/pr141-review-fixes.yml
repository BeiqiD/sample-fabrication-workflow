name: Apply PR 141 review fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: "github.event.head_commit.message == 'chore: apply PR 141 review fixes'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply review fixes
        run: |
          python .github/scripts/apply-pr141-review-code.py
          python .github/scripts/apply-pr141-review-tests.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused and complete contracts
        run: |
          npm run verify:storage-integrity
          npm run verify:project-reading
          npm test
          npm run build
          git diff --check

      - name: Commit reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations worker src docs package.json
          git rm \
            .github/scripts/apply-pr141-review-code.py \
            .github/scripts/apply-pr141-review-tests.py \
            .github/workflows/pr141-review-fixes.yml
          git commit -m "fix: enforce quarantine integrity boundaries"
          git push origin HEAD:agent/storage-integrity-markdown-removal
