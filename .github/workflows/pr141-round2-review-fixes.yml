name: Apply PR 141 round-two review fixes

on:
  push:
    branches:
      - agent/storage-integrity-markdown-removal

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply review fixes
        shell: bash
        run: |
          cat > /tmp/apply-pr141-round2.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/apply-pr141-round2.py.gz.b64 | gzip -d > /tmp/apply-pr141-round2.py
          python /tmp/apply-pr141-round2.py
      - name: Install dependencies
        run: npm ci
      - name: Verify focused and complete contracts
        run: |
          npm run verify:storage-integrity
          npm run test:blob-lifecycle
          npm run verify:project-reading
          npm test
          npm run build
          git diff --check
      - name: Commit reviewed implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker migrations shared docs
          git rm .github/workflows/pr141-round2-review-fixes.yml
          git commit -m "fix: isolate pending imports and guard thumbnails"
          git push origin HEAD:agent/storage-integrity-markdown-removal
