name: Apply deterministic search review fixes

on:
  push:
    branches:
      - agent/deterministic-reference-search

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/deterministic-reference-search
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assemble and apply transparent review fixes
        shell: bash
        run: |
          cat .review-fixes/reference-search/part-*.pyfrag > /tmp/apply-reference-search-review-fixes.py
          python /tmp/apply-reference-search-review-fixes.py
          rm -rf .review-fixes/reference-search
          rmdir .review-fixes 2>/dev/null || true
          rm .github/workflows/apply-reference-search-review-fixes.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify focused reference contract
        run: npm run test:reference-foundation

      - name: Verify real Worker and D1 search boundary
        run: npm run verify:reference-search-worker

      - name: Verify production build
        run: npm run build

      - name: Commit verified review fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix deterministic search matcher and portability boundaries'
          git push origin HEAD:agent/deterministic-reference-search
