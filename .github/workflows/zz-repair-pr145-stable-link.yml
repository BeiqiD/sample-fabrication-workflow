name: Repair PR 145 stable-link patch test

on:
  push:
    branches:
      - phase-4a1-project-item-focus-links

permissions:
  contents: write

concurrency:
  group: pr-145-stable-link-repair
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4a1-project-item-focus-links
          fetch-depth: 0

      - name: Apply source patch and repair generated regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow_path = Path(".github/workflows/zz-fix-pr145-stable-link.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          match = re.search(r"          python - <<'PY'\n(?P<script>.*?)\n          PY\n", workflow, re.S)
          if match is None:
              raise SystemExit("could not locate the exact patch script")
          script = textwrap.dedent(match.group("script"))
          exec(compile(script, str(workflow_path), "exec"), {})

          test_path = Path("src/project-stable-link-copy.mount.test.tsx")
          test = test_path.read_text(encoding="utf-8")
          old = '      first.reject(new Error("late denial");'
          new = '      first.reject(new Error("late denial"));'
          if test.count(old) != 1:
              raise SystemExit(f"late rejection repair expected one match, found {test.count(old)}")
          test_path.write_text(test.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/zz-repair-pr145-stable-link.yml").unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused mounted regression
        run: npx vitest run --config vitest.mounted.config.ts src/project-stable-link-copy.mount.test.tsx

      - name: Commit patched branch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix stable-link copy request identity"
          git push origin HEAD:phase-4a1-project-item-focus-links
