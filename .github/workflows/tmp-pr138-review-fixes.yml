name: Temporary PR 138 review fixes

on:
  push:
    branches:
      - agent/project-reading-projection

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-reading-projection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply review fixes
        run: python scripts/tmp-pr138-review-fixes.py

      - name: Run focused Reading tests
        run: |
          npm run test:project-reading
          npm run test:project-reading-mounted

      - name: Verify Reading slice
        run: npm run verify:project-reading

      - name: Re-run edge gate
        run: npm run verify:project-edges

      - name: Run complete tests
        run: npm test

      - name: Run production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/tmp-pr138-review-fixes.py
          git add \
            README.md \
            docs/PROJECT_READING_IMPLEMENTATION_PLAN.md \
            package.json \
            src/pages/ProjectPage.tsx \
            src/project-reading-contract.test.ts \
            src/project-responsive-projection-safety.mount.test.tsx
          if git diff --cached --quiet; then
            echo "No PR 138 review fixes to commit"
            exit 0
          fi
          git commit -m "fix(project): protect responsive Reading transitions"
          git push origin HEAD:agent/project-reading-projection
