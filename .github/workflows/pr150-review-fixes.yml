name: Apply PR150 review fixes

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && github.head_ref == 'codex/phase-4b3-canvas-alignment-z-order' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4b3-canvas-alignment-z-order
          fetch-depth: 0

      - name: Repair staged helper and apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/pr150-review-fixes.mjs')
          source = path.read_text()
          old = '      if (init.method !== "POST") throw new Error(`Unexpected ${init.method} ${path}`);'
          new = '      if (init.method !== "POST") throw new Error("Unexpected " + init.method + " " + path);'
          if source.count(old) != 1:
              raise RuntimeError('expected one staged template-string repair target')
          path.write_text(source.replace(old, new, 1))
          PY
          node scripts/pr150-review-fixes.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path('src/project-map-surface.mount.test.tsx')
          source = path.read_text()
          down = '    fireEvent.mouseDown(note, {\n'
          move = '    fireEvent.mouseMove(window, {\n'
          up = '    fireEvent.mouseUp(window, {\n'
          view_line = '      view: window,\n'
          if source.count(down) != 1 or source.count(move) != 2 or source.count(up) != 1:
              raise RuntimeError('expected one mouse-down, two mouse-move, and one mouse-up drag calls')
          if source.count(view_line) != 4:
              raise RuntimeError('expected four explicit MouseEvent view lines')

          helper = '''    const dispatchMouse = (
              target: EventTarget,
              type: "mousedown" | "mousemove" | "mouseup",
              init: MouseEventInit,
            ) => {
              const view = document.defaultView!;
              const MouseEventConstructor = (
                view as unknown as typeof globalThis
              ).MouseEvent;
              const event = new MouseEventConstructor(type, {
                ...init,
                bubbles: true,
                cancelable: true,
              });
              Object.defineProperty(event, "view", { value: view });
              target.dispatchEvent(event);
            };

          '''
          source = source.replace(
              down,
              helper + '    dispatchMouse(note, "mousedown", {\n',
              1,
          )
          source = source.replace(
              move,
              '    dispatchMouse(document.defaultView!, "mousemove", {\n',
          )
          source = source.replace(
              up,
              '    dispatchMouse(document.defaultView!, "mouseup", {\n',
              1,
          )
          path.write_text(source.replace(view_line, ''))
          PY

      - name: Check patch
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 4B3 review fixes
        run: npm run verify:project-canvas-productivity

      - name: Commit verified fixes
        run: |
          rm scripts/pr150-review-fixes.mjs
          rm .github/workflows/pr150-review-fixes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve authoritative Canvas ordering"
          git push origin HEAD:codex/phase-4b3-canvas-alignment-z-order
