name: Apply PR150 review fixes

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && github.head_ref == 'codex/phase-4b3-canvas-alignment-z-order' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4b3-canvas-alignment-z-order
          fetch-depth: 0

      - name: Repair staged helper and apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/pr150-review-fixes.mjs')
          source = path.read_text()
          old = '      if (init.method !== "POST") throw new Error(`Unexpected ${init.method} ${path}`);'
          new = '      if (init.method !== "POST") throw new Error("Unexpected " + init.method + " " + path);'
          if source.count(old) != 1:
              raise RuntimeError('expected one staged template-string repair target')
          source = source.replace(old, new, 1)

          view_old = '      view: window,'
          view_new = '      view: document.defaultView,'
          if source.count(view_old) != 4:
              raise RuntimeError('expected four mounted MouseEvent view repair targets')
          path.write_text(source.replace(view_old, view_new))
          PY
          node scripts/pr150-review-fixes.mjs

      - name: Check patch
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 4B3 review fixes
        run: npm run verify:project-canvas-productivity

      - name: Commit verified fixes
        run: |
          rm scripts/pr150-review-fixes.mjs
          rm .github/workflows/pr150-review-fixes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve authoritative Canvas ordering"
          git push origin HEAD:codex/phase-4b3-canvas-alignment-z-order
