name: Apply exact-match specificity fix v2

on:
  pull_request:
    branches:
      - v2/backend-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/deterministic-reference-search' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deterministic-reference-search
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic ranking fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_section(text: str, start: str, end: str, new: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"{label}: start marker not found")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"{label}: end marker not found")
              end_index += len(end)
              return text[:start_index] + new + text[end_index:]

          search_path = Path('worker/references/search.ts')
          search = search_path.read_text(encoding='utf-8')

          search = replace_once(
              search,
              '''const MATCH_TIER_BY_NUMBER: Record<number, ReferenceSearchMatchTier> = {
            0: "exact_id",
            1: "exact_primary",
            2: "prefix_primary",
            3: "content",
            4: "metadata",
          };

          const MATCH_TIER_ORDER: Record<ReferenceSearchMatchTier, number> = {
            exact_id: 0,
            exact_primary: 1,
            prefix_primary: 2,
            content: 3,
            metadata: 4,
          };
          ''',
              '''export const REFERENCE_SEARCH_MATCH_SPECIFICITY = {
            byte_exact_id: 0,
            ascii_folded_exact_id: 1,
            byte_exact_primary: 2,
            ascii_folded_exact_primary: 3,
            prefix_primary: 4,
            content: 5,
            metadata: 6,
          } as const;

          export type ReferenceSearchMatchSpecificity =
            typeof REFERENCE_SEARCH_MATCH_SPECIFICITY[keyof typeof REFERENCE_SEARCH_MATCH_SPECIFICITY];

          const MATCH_TIER_BY_SPECIFICITY: Record<
            ReferenceSearchMatchSpecificity,
            ReferenceSearchMatchTier
          > = {
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_id]: "exact_id",
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.ascii_folded_exact_id]: "exact_id",
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_primary]: "exact_primary",
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.ascii_folded_exact_primary]: "exact_primary",
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.prefix_primary]: "prefix_primary",
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.content]: "content",
            [REFERENCE_SEARCH_MATCH_SPECIFICITY.metadata]: "metadata",
          };

          function normalizeMatchSpecificity(value: number): ReferenceSearchMatchSpecificity {
            if (Number.isInteger(value)
              && value >= REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_id
              && value <= REFERENCE_SEARCH_MATCH_SPECIFICITY.metadata) {
              return value as ReferenceSearchMatchSpecificity;
            }
            return REFERENCE_SEARCH_MATCH_SPECIFICITY.metadata;
          }
          ''',
              'specificity constants',
          )

          search = replace_once(
              search,
              '''type CandidateRow = {
            target_id: string;
            match_tier: number;
            matched_at: string | null;
          };

          export type ReferenceSearchCandidate = {
            target: ReferenceTarget;
            tier: ReferenceSearchMatchTier;
            matchedAt: string | null;
          };
          ''',
              '''type CandidateRow = {
            target_id: string;
            match_specificity: number;
            matched_at: string | null;
          };

          export type ReferenceSearchCandidate = {
            target: ReferenceTarget;
            specificity: ReferenceSearchMatchSpecificity;
            matchedAt: string | null;
          };
          ''',
              'candidate shape',
          )

          search = replace_once(
              search,
              '''function exactTextSql(expression: string) {
            const text = textExpression(expression);
            return `(${text} = ? COLLATE BINARY OR LOWER(${text}) = ?)`;
          }

          function primaryExactSql(expressions: string[]) {
            if (!expressions.length) return "0";
            return expressions.map(exactTextSql).join(" OR ");
          }
          ''',
              '''function primaryExactSql(
            expressions: string[],
            mode: "byte_exact" | "ascii_folded",
          ) {
            if (!expressions.length) return "0";
            return expressions.map((expression) => {
              const text = textExpression(expression);
              return mode === "byte_exact"
                ? `${text} = ? COLLATE BINARY`
                : `LOWER(${text}) = ?`;
            }).join(" OR ");
          }
          ''',
              'primary exact helpers',
          )

          search = replace_once(
              search,
              '''    const exactPrimary = primaryExactSql(spec.primarySqls);
              const prefixPrimary = primaryPrefixSql(spec.primarySqls);
          ''',
              '''    const byteExactPrimary = primaryExactSql(spec.primarySqls, "byte_exact");
              const asciiFoldedExactPrimary = primaryExactSql(spec.primarySqls, "ascii_folded");
              const prefixPrimary = primaryPrefixSql(spec.primarySqls);
          ''',
              'primary exact expressions',
          )

          search = replace_section(
              search,
              '    const sql = `\n',
              '    `;\n\n',
              '''    const sql = `
              SELECT CAST(${spec.idSql} AS TEXT) AS target_id,
                     CASE
                       WHEN ${textExpression(spec.idSql)} = ? COLLATE BINARY
                         THEN ${REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_id}
                       WHEN LOWER(${textExpression(spec.idSql)}) = ?
                         THEN ${REFERENCE_SEARCH_MATCH_SPECIFICITY.ascii_folded_exact_id}
                       WHEN (${byteExactPrimary})
                         THEN ${REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_primary}
                       WHEN (${asciiFoldedExactPrimary})
                         THEN ${REFERENCE_SEARCH_MATCH_SPECIFICITY.ascii_folded_exact_primary}
                       WHEN (${prefixPrimary})
                         THEN ${REFERENCE_SEARCH_MATCH_SPECIFICITY.prefix_primary}
                       WHEN (${contentMatch})
                         THEN ${REFERENCE_SEARCH_MATCH_SPECIFICITY.content}
                       ELSE ${REFERENCE_SEARCH_MATCH_SPECIFICITY.metadata}
                     END AS match_specificity,
                     ${spec.timestampSql} AS matched_at
              ${spec.fromSql}
              WHERE (${spec.visibilitySql})
                AND (${fullMatch})
                ${sampleFilter ? `AND (${sampleFilter.sql})` : ""}
                ${timeSql.map((condition) => `AND (${condition})`).join("\n")}
              ORDER BY match_specificity ASC,
                       COALESCE(${spec.timestampSql}, '') DESC,
                       target_id ASC
              LIMIT ?
            `;

          ''',
              'SQL specificity',
          )

          search = replace_once(
              search,
              '''      input.query,
                input.normalizedQuery,
                ...spec.primarySqls.flatMap(() => [input.query, input.normalizedQuery]),
                ...spec.primarySqls.flatMap(() => [input.query, input.normalizedQuery]),
          ''',
              '''      input.query,
                input.normalizedQuery,
                ...spec.primarySqls.map(() => input.query),
                ...spec.primarySqls.map(() => input.normalizedQuery),
                ...spec.primarySqls.flatMap(() => [input.query, input.normalizedQuery]),
          ''',
              'specificity bindings',
          )

          search = replace_once(
              search,
              '''    const candidates = rows.results.slice(0, candidateLimit).map((row): ReferenceSearchCandidate => ({
                target: { type: spec.type, id: row.target_id },
                tier: MATCH_TIER_BY_NUMBER[Number(row.match_tier)] ?? "metadata",
                matchedAt: row.matched_at,
              }));
          ''',
              '''    const candidates = rows.results.slice(0, candidateLimit).map((row): ReferenceSearchCandidate => ({
                target: { type: spec.type, id: row.target_id },
                specificity: normalizeMatchSpecificity(Number(row.match_specificity)),
                matchedAt: row.matched_at,
              }));
          ''',
              'candidate specificity mapping',
          )

          search = replace_once(
              search,
              '''function compareCandidates(left: ReferenceSearchCandidate, right: ReferenceSearchCandidate) {
            const leftTier = MATCH_TIER_ORDER[left.tier];
            const rightTier = MATCH_TIER_ORDER[right.tier];
            if (leftTier !== rightTier) return leftTier - rightTier;

            const leftTime = left.matchedAt ?? "";
          ''',
              '''function compareCandidates(left: ReferenceSearchCandidate, right: ReferenceSearchCandidate) {
            if (left.specificity !== right.specificity) {
              return left.specificity - right.specificity;
            }

            const leftTime = left.matchedAt ?? "";
          ''',
              'cross-type specificity comparator',
          )

          search = replace_once(
              search,
              '''      match: { tier: candidate.tier, matchedAt: candidate.matchedAt },
          ''',
              '''      match: {
                tier: MATCH_TIER_BY_SPECIFICITY[candidate.specificity],
                matchedAt: candidate.matchedAt,
              },
          ''',
              'public tier mapping',
          )
          search_path.write_text(search, encoding='utf-8')

          boundary_path = Path('worker/reference-search-boundaries.test.ts')
          boundary = boundary_path.read_text(encoding='utf-8')
          boundary = replace_once(
              boundary,
              '''  ReferenceSearchInputError,
            createSqliteSourceReferenceSearchBackend,
            normalizeReferenceSearchInput,
            searchReferences,
          ''',
              '''  REFERENCE_SEARCH_ADAPTERS,
            REFERENCE_SEARCH_MATCH_SPECIFICITY,
            ReferenceSearchInputError,
            createSqliteSourceReferenceSearchBackend,
            normalizeReferenceSearchInput,
            searchReferences,
          ''',
              'boundary imports',
          )
          boundary = replace_once(
              boundary,
              '''    VALUES (?, ?, ?, ?, 'stored', 'Matcher box', 0,
                      '2026-08-03T00:00:00.000Z', '2026-08-03T00:00:00.000Z')
            `);
            const addSample = (id: string, code: string, title: string, description: string) => {
              insert.run(id, code, title, description);
            };
          ''',
              '''    VALUES (?, ?, ?, ?, 'stored', 'Matcher box', 0, ?, ?)
            `);
            const addSample = (
              id: string,
              code: string,
              title: string,
              description: string,
              timestamp = "2026-08-03T00:00:00.000Z",
            ) => {
              insert.run(id, code, title, description, timestamp, timestamp);
            };
          ''',
              'timestamp-aware fixture',
          )
          boundary = replace_once(
              boundary,
              '''  it("accepts only date-only or RFC 3339 timestamps with explicit timezones", () => {
          ''',
              '''  it("prefers byte-exact IDs and primary fields before newer ASCII-folded matches", async () => {
            const { database, db, d1, addSample } = fixture();
            addSample("Case-ID", "CASE-ID-EXACT", "Older exact identity", "Identity collision fixture", "2026-08-01T00:00:00.000Z");
            addSample("case-id", "CASE-ID-FALLBACK", "Newer folded identity", "Identity collision fixture", "2026-08-02T00:00:00.000Z");
            addSample("primary-byte-exact", "Case-Code", "Older exact primary", "Primary collision fixture", "2026-08-01T00:00:00.000Z");
            addSample("primary-ascii-folded", "case-code", "Newer folded primary", "Primary collision fixture", "2026-08-02T00:00:00.000Z");

            const idInput = normalizeReferenceSearchInput({ query: "Case-ID", types: ["sample"], limit: 1 });
            const idBatch = await REFERENCE_SEARCH_ADAPTERS.sample(d1, idInput, 1);
            expect(idBatch.candidates).toEqual([
              expect.objectContaining({
                target: { type: "sample", id: "Case-ID" },
                specificity: REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_id,
              }),
            ]);

            const idSearch = await searchReferences(db, { query: "Case-ID", types: ["sample"], limit: 1 });
            expect(idSearch.results[0]).toMatchObject({
              target: { type: "sample", id: "Case-ID" },
              match: { tier: "exact_id" },
            });
            expect(JSON.stringify(idSearch)).not.toContain("specificity");

            const primaryInput = normalizeReferenceSearchInput({ query: "Case-Code", types: ["sample"], limit: 1 });
            const primaryBatch = await REFERENCE_SEARCH_ADAPTERS.sample(d1, primaryInput, 1);
            expect(primaryBatch.candidates).toEqual([
              expect.objectContaining({
                target: { type: "sample", id: "primary-byte-exact" },
                specificity: REFERENCE_SEARCH_MATCH_SPECIFICITY.byte_exact_primary,
              }),
            ]);

            const primarySearch = await searchReferences(db, { query: "Case-Code", types: ["sample"], limit: 1 });
            expect(primarySearch.results[0]).toMatchObject({
              target: { type: "sample", id: "primary-byte-exact" },
              match: { tier: "exact_primary" },
            });
            expect(JSON.stringify(primarySearch)).not.toContain("specificity");
            database.close();
          });

          it("accepts only date-only or RFC 3339 timestamps with explicit timezones", () => {
          ''',
              'case collision tests',
          )
          boundary_path.write_text(boundary, encoding='utf-8')

          consistency_path = Path('worker/reference-search-consistency.test.ts')
          consistency = consistency_path.read_text(encoding='utf-8')
          consistency = replace_once(
              consistency,
              '''    expect(source).toContain("export type ReferenceSearchCandidate");
          ''',
              '''    expect(source).toContain("export type ReferenceSearchCandidate");
            expect(source).toContain("match_specificity");
            expect(source).toContain("left.specificity - right.specificity");
            expect(source).toContain("MATCH_TIER_BY_SPECIFICITY[candidate.specificity]");
          ''',
              'specificity structural assertions',
          )
          consistency_path.write_text(consistency, encoding='utf-8')

          smoke_path = Path('scripts/verify-reference-search-worker.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          smoke = replace_once(
              smoke,
              '''    VALUES (?, ?, ?, ?, 'stored', 'Matcher box', 0,
                      '2026-08-03T00:00:00.000Z', '2026-08-03T00:00:00.000Z')
            `);
            const longToken = "a".repeat(60);
          ''',
              '''    VALUES (?, ?, ?, ?, 'stored', 'Matcher box', 0, ?, ?)
            `);
            const addSample = async (
              id,
              code,
              title,
              description,
              timestamp = "2026-08-03T00:00:00.000Z",
            ) => insertSample.bind(id, code, title, description, timestamp, timestamp).run();
            const longToken = "a".repeat(60);
          ''',
              'workerd timestamp-aware fixture',
          )
          smoke = replace_once(
              smoke,
              '''  ]) {
                await insertSample.bind(...row).run();
              }

            const crossOrigin = await postSearch(
          ''',
              '''  ]) {
                await addSample(...row);
              }
              await addSample("Case-ID", "CASE-ID-EXACT", "Older exact identity", "Identity collision fixture", "2026-08-01T00:00:00.000Z");
              await addSample("case-id", "CASE-ID-FALLBACK", "Newer folded identity", "Identity collision fixture", "2026-08-02T00:00:00.000Z");
              await addSample("primary-byte-exact", "Case-Code", "Older exact primary", "Primary collision fixture", "2026-08-01T00:00:00.000Z");
              await addSample("primary-ascii-folded", "case-code", "Newer folded primary", "Primary collision fixture", "2026-08-02T00:00:00.000Z");

            const crossOrigin = await postSearch(
          ''',
              'workerd collision fixtures',
          )
          smoke = replace_once(
              smoke,
              '''  const commentResponse = await postSearch(miniflare, {
          ''',
              '''  const idCollisionResponse = await postSearch(miniflare, {
                query: "Case-ID",
                types: ["sample"],
                limit: 1,
              });
              const idCollisionPayload = await idCollisionResponse.json();
              assert.equal(idCollisionResponse.status, 200, JSON.stringify(idCollisionPayload));
              assert.equal(idCollisionPayload.results[0].target.id, "Case-ID");
              assert.equal(idCollisionPayload.results[0].match.tier, "exact_id");
              assert(!JSON.stringify(idCollisionPayload).includes("specificity"));

              const primaryCollisionResponse = await postSearch(miniflare, {
                query: "Case-Code",
                types: ["sample"],
                limit: 1,
              });
              const primaryCollisionPayload = await primaryCollisionResponse.json();
              assert.equal(primaryCollisionResponse.status, 200, JSON.stringify(primaryCollisionPayload));
              assert.equal(primaryCollisionPayload.results[0].target.id, "primary-byte-exact");
              assert.equal(primaryCollisionPayload.results[0].match.tier, "exact_primary");
              assert(!JSON.stringify(primaryCollisionPayload).includes("specificity"));

            const commentResponse = await postSearch(miniflare, {
          ''',
              'workerd collision assertions',
          )
          smoke = replace_once(
              smoke,
              'Reference search Worker/D1 smoke passed: portable literal matching, Unicode policy, strict timestamps, deterministic ranking, lifecycle filters, read-only behavior, and locator non-disclosure.',
              'Reference search Worker/D1 smoke passed: byte-exact specificity, portable literal matching, Unicode policy, strict timestamps, deterministic ranking, lifecycle filters, read-only behavior, and locator non-disclosure.',
              'workerd summary',
          )
          smoke_path.write_text(smoke, encoding='utf-8')

          plan_path = Path('docs/REFERENCE_SEARCH_IMPLEMENTATION_PLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = replace_once(
              plan,
              '''Candidate discovery is behind `ReferenceSearchCandidateBackend`. The current
          `sqlite-source-scan` backend uses standard SQLite expressions and a narrow
          `prepare -> bind -> all` query interface; Cloudflare D1 is one adapter, not the
          search contract. A future Docker deployment can provide the same interface without
          changing API or ranking semantics.
          ''',
              '''Candidate discovery is behind `ReferenceSearchCandidateBackend`. Every
          backend returns the same internal match specificity so per-type candidate caps and
          cross-type merging preserve byte-exact matches before ASCII-folded fallbacks. The
          current `sqlite-source-scan` backend uses standard SQLite expressions and a narrow
          `prepare -> bind -> all` query interface; Cloudflare D1 is one adapter, not the
          search contract. A future Docker deployment can provide the same interface without
          changing API or ranking semantics.
          ''',
              'backend specificity contract',
          )
          plan = replace_once(
              plan,
              '''Every candidate receives exactly one ranking tier:

          1. `exact_id` — byte-exact stable-ID match, then ASCII-case-insensitive fallback;
          2. `exact_primary` — byte-exact code/title/name/filename match, then ASCII-case-insensitive fallback;
          3. `prefix_primary` — the primary field begins with the raw or ASCII-folded complete query;
          4. `content` — every token matches the target-owned body/description/note fields;
          5. `metadata` — every token matches only context or weaker metadata.

          Results sort by:

          ```text
          ranking tier ascending
          search timestamp descending
          closed target-type order
          stable target ID ascending
          ```
          ''',
              '''Every result exposes one of five public ranking tiers:

          1. `exact_id`;
          2. `exact_primary`;
          3. `prefix_primary`;
          4. `content`;
          5. `metadata`.

          Candidate backends additionally carry a private specificity that is never returned
          by the API:

          ```text
          0  byte-exact stable ID
          1  ASCII-folded exact stable ID
          2  byte-exact primary field
          3  ASCII-folded exact primary field
          4  primary prefix
          5  target-owned content
          6  metadata / context
          ```

          Both the per-type SQL query and the cross-type application merge sort by:

          ```text
          internal specificity ascending
          search timestamp descending
          closed target-type order
          stable target ID ascending
          ```

          The public mapping remains `0..1 -> exact_id`, `2..3 -> exact_primary`,
          `4 -> prefix_primary`, `5 -> content`, and `6 -> metadata`. This keeps
          stable-ID matches stronger than primary fields while ensuring a byte-exact match
          cannot be displaced by a newer ASCII-folded fallback under any candidate or result
          limit.
          ''',
              'ranking specificity documentation',
          )
          plan = replace_once(
              plan,
              '''- byte-exact Unicode IDs/titles, ASCII-only case folding, and distinct NFC/NFD
            forms;
          ''',
              '''- byte-exact Unicode IDs/titles, ASCII-only case folding, and distinct NFC/NFD
            forms;
          - older byte-exact ID and primary matches beating newer ASCII-folded collisions at
            both the per-type candidate cap and final `limit: 1` boundary;
          ''',
              'ranking regression verification',
          )
          plan_path.write_text(plan, encoding='utf-8')

          architecture_path = Path('docs/ARCHITECTURE.md')
          architecture = architecture_path.read_text(encoding='utf-8')
          architecture = replace_once(
              architecture,
              '''- Ranking uses explicit exact-ID, exact-primary, primary-prefix,
            target-content, and metadata tiers. Ties use timestamp, closed type
            order, and stable ID.
          ''',
              '''- Ranking exposes exact-ID, exact-primary, primary-prefix, target-content,
            and metadata tiers. Candidate backends also carry one private specificity:
            byte-exact ID, folded ID, byte-exact primary, folded primary, prefix, content,
            then metadata. SQL candidate caps and cross-type merging use that same order
            before timestamp, closed type order, and stable ID.
          ''',
              'architecture ranking invariant',
          )
          architecture_path.write_text(architecture, encoding='utf-8')

          Path('.github/workflows/apply-reference-search-ranking-fix-v2.yml').unlink()
          PY

      - run: npm ci
      - run: npm run test:reference-foundation
      - run: npm run verify:reference-search-worker
      - run: npm run build

      - name: Commit verified ranking fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve byte-exact search ranking specificity'
          git push origin HEAD:agent/deterministic-reference-search
